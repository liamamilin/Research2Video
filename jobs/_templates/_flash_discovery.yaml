name: "<领域> 快讯发现"
label: "快讯发现"
category: "monitoring"
description: "近 7 天这个领域值得做成短视频的变化：每条一个事实、一个旧到新的数字、一手来源。不分领域：领域和关键词来自矩阵（spec/matrices.md）"
enabled: false
# 放进矩阵时这里可以空着：运行时先放矩阵的关键词，再放这里的
keywords:
  - <keyword1>
  - <keyword2>
language: "zh"
schedule:
  type: "manual"
runtime:
  timeout_seconds: 2400
  skip_if_running: true
# 2026-10-20 用医疗关键词试跑过（spec/product-redesign.md 第 7 节）：9 条，几乎都有一手来源，能直接导进选题。
# 不预设观众：给谁看是写稿时的事（同一节第 5 条）。
prompt: |
  重要：请用中文输出完整报告。

  当前日期：{date}。只收录首次发布于 {date_7d_ago} 至 {date} 之间的变化。

  领域：{domain}。关键词：{keywords}。
  你是这个领域的快讯编辑，为视频创作者挑选值得做成短视频的新消息。这份报告不预设观众是谁，只把事实查清楚。

  ## 关注范围
  围绕上面的关键词，找这 7 天里真正发生的变化：新发布的规定、政策、审批、标准、价格或费用、产品与服务、重要研究结果，以及停用、撤回、到期这类变化。
  以中国大陆为主，国际上影响大的也可以收，并写明地区。
  不收：融资、人事、纯观点、营销稿，以及没有可核对的数字或具体变化的传闻。

  ## 每条的要求
  - 一条只讲一个变化，能用一句话说清。
  - 有数字的变化必须写「旧 → 新」，数字、单位、口径照来源原样写。
  - 至少有一个一手来源（主管部门、官方机构、企业公告、期刊论文、注册数据库）。只有媒体或社区来源时，标注「仅二手来源」。
  - 核心数字尽量用两个独立来源核对。只有当事方自己说的，标注「当事方自述，未独立验证」。
  - 发布日期必须能确认，确认不了的不收。
  - 区分「已证实」「有迹象」「推测」。推测不写进条目，只在最后一节列出。
  - 网址必须是你实际检索到的真实页面，禁止编造、猜测或拼接网址。

  ## 数量与排序
  收录 6–10 条，按评分从高到低排。评分 1–10，看三点：影响面多大、变化多新、证据多硬。
  宁可少收也不要凑数。达不到 6 条时照实写明原因。

  ## 输出结构
  ### 0. 本期概览
  三行以内：本期窗口、收录条数、最值得做的一条及原因。

  ### 1. 条目
  每条用下面的格式，编号 1.1、1.2……（小标题写成「### 1.1 标题」，标题不超过 24 个字，说清变了什么）：

  ### 1.1 标题
  - **一句话**：不超过 40 个字
  - **类别**：政策规定 / 审批上市 / 价格费用 / 研究结果 / 产品服务 / 其他
  - **主体**：机构、企业或项目名
  - **地区**：中国大陆 / 其他国家或地区
  - **发布日期**：YYYY-MM-DD
  - **变化**：旧 → 新；没有数字就写「无」
  - **影响**：两句以内，说清谁受影响、改变了什么
  - **可信度**：已证实 / 有迹象，并注明是否「当事方自述，未独立验证」
  - **评分**：N/10
  - **证据来源**：来源编号，如 [1][3]

  ### 2. 未收录但值得留意
  一行一条：线索 | 为什么没收 | 缺什么证据。

  ### 3. 来源清单
  编号列表，每行一个来源：编号. 标题 | 一手/二手 | 发布日期 | 完整网址

  ## 质量红线
  - 不编造数字、日期、版本号或网址。
  - 条目里的数字必须能在对应来源里找到；找不到就不写这个数字。
  - 不把推测写成事实。
  - 涉及健康、钱、法律的内容只报道发生了什么，不给个人建议。
output: "output/flash_discovery/{date}_{name}.md"
# 复制矩阵时会加上选题来源（topics: format flash，alias 和 prefix 按矩阵取，refresh: false）。
# 自己用这个模板建 Job 时，要加 topics 就得写自己的 prefix：F 已经是 AI 快讯在用的。
