# 视频调研模板（spec/video-recipes.md）：配方写 research: {template: comparison_developer} 引用它，每篇文稿的调研 Job 由它生成。
# prompt 里的 {topic.<字段>}、{topic_title} 等由选题填，{date} 等由 Job 运行时填。

name: 视频调研：对比 · 开发者
description: 把两个对象放在同几个维度上比：每个维度谁强谁弱、差多少，最后说明什么情况下选哪个。
language: zh
runtime:
  timeout_seconds: 2400
prompt: |
  根据素材，产出目标观众愿意看、听得懂、想继续看的视频。
  当前步骤：研究这个选题，把后续讲述用得上的具体资料写明白。
  研究方向：从开发者实际会遇到的选择出发，寻找能解释这些对象差别的使用场景和具体材料。
  选题：{topic_title}
  目标观众：{topic_audience}
  选题资料：{topic.一句话}
  对比对象：{topic_subjects}
  对比维度：{topic_dimensions}
  来源资料：{topic_sources}
  日期：{date}
  输出语言：{language}

  数据格式：Markdown；末尾「### 来源清单」记录素材链接。
