# 视频调研模板（spec/video-recipes.md）：配方写 research: {template: one_point} 引用它，每篇文稿的调研 Job 由它生成。
# prompt 里的 {topic.<字段>}、{topic_title} 等由选题填，{date} 等由 Job 运行时填。

name: 视频调研：一个知识点
description: 核实一个知识点的结论、依据和适用条件，供后续按配方写稿。
language: zh
runtime:
  timeout_seconds: 1800
prompt: |
  根据素材，产出目标观众愿意看、听得懂、想继续看的视频。
  当前步骤：研究这个选题，把后续讲述用得上的具体资料写明白。
  研究方向：围绕观众对这个知识点的疑问寻找解释、例子和有意思的发现。
  选题：{topic_title}
  目标观众：{topic_audience}
  选题资料：{topic.一句话}
  来源资料：{topic_sources}
  日期：{date}
  输出语言：{language}

  数据格式：Markdown；末尾「### 来源清单」记录素材链接。
