name: "<主题> 选题发现"
label: "选题发现"
category: "monitoring"
description: "为视频找选题：报告里每个 ### 标题加 - **字段**：值 就是一个选题，跑完自动进选题池（topics: 块）"
enabled: false
keywords:
  - <keyword1>
  - <keyword2>
language: "zh"
schedule:
  type: "manual"
runtime:
  timeout_seconds: 1800
  skip_if_running: true
prompt: |
  重要：请用中文输出完整报告。

  当前日期：{date}。你是一名视频选题编辑，为一位做 {name} 方向视频的创作者找值得做的题目。

  ## 要找什么
  - 关键词：{keywords}
  - 优先近期（{date_7d_ago} 至 {date}）有新进展、能讲清楚“发生了什么、为什么重要、观众该怎么做”的题目。
  - 每个题目要有可核对的一手来源；网址必须是实际检索到的页面，不要编造。

  ## 怎么判断值不值得做
  - 观众看完能做一件具体的事（换个配置、算一笔账、避开一个坑），比“了解一下”更值得做。
  - 有数字的变化写清“旧 → 新”，数字、单位、口径照来源原样写；只有厂商自己的说法时注明“厂商自述”。
  - 一个题目只讲一件事；能拆成两期的就拆开列。
  - 不收：融资、人事、纯观点、没有可核对事实的传闻、和 {keywords} 无关的泛 AI 新闻。
  - 和最近几期已经讲过的题目重复的，除非有新进展，否则不列。

  ## 输出格式（选题池按这个格式读，不要改）
  每个选题一节，用三级标题，下面是加粗字段：

  ### 1. 选题标题
  - **核心角度**：一句话说这期讲什么
  - **目标受众**：谁会关心
  - **为什么有人在乎**：对观众的钱、时间或做法有什么影响
  - **发布日期**：事件发生的日期（YYYY-MM-DD）
  - **评分**：1–10 的整数，写成 8/10
  - **证据来源**：直接写网址

  列 5–8 个选题。概述、方法说明不要用三级标题。
output: "output/topic_discovery/{date}_{name}.md"
# 选题来源（spec/video-topics.md）：prefix 是选题编号的字母（D1、D2…），每个来源要不同，建好后按需改
topics:
  format: items
  prefix: D
