name: 数码选购周观察
description: 每周挑一类产品，把参数、评测和可维修性讲清楚，说明适合谁（读 Notebookcheck、GSMArena、Tom's Hardware、iFixit、IIHS、Ars Technica 抓取的内容），不联网搜索
enabled: true
keywords:
- 数码新品
- 产品评测
- 购买指南
language: zh
schedule:
  type: manual
runtime:
  timeout_seconds: 1800
  skip_if_running: true
search: false
sources_limit: 10
sources:
- tag:consumer
prompt: |
  根据素材，产出目标观众愿意看、听得懂、想继续看的视频。
  当前步骤：研究事情本身，把后续讲述用得上的具体资料写明白。
  这次研究要帮助观众理解：回看这一周的材料，找到值得继续追问的变化和联系。关注消费产品带来的真实使用体验与购买选择，保留能把事情讲生动、讲明白的具体材料。
  任务：{name}
  领域：{domain}
  关键词：{keywords}
  日期：{date}
  输出语言：{language}

  数据格式：Markdown；条目以「### 2.1 名称」标识，末尾「### 来源清单」记录素材链接。
output: output/consumer/{date}_consumer_weekly.md
