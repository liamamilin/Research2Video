name: 软件与工具周观察
description: 每周挑一类软件或一个工作流讲清楚：解决什么问题、有哪些选择、各自适合谁（读 Product Hunt、Show HN、GitHub、Changelog、LWN 抓取的内容），不联网搜索
enabled: true
keywords:
- 软件发现
- 开源工具
- 效率工具
language: zh
schedule:
  type: manual
runtime:
  timeout_seconds: 1800
  skip_if_running: true
search: false
sources_limit: 10
sources:
- source:product_hunt
- source:hn_show
- source:github_blog
- source:changelog
- source:lwn
- source:gh_new_selfhosted
prompt: |
  根据素材，产出目标观众愿意看、听得懂、想继续看的视频。
  当前步骤：研究事情本身，把后续讲述用得上的具体资料写明白。
  这次研究要帮助观众理解：回看这一周的材料，找到值得继续追问的变化和联系。关注软件工具怎样解决一个实际问题，以及它用起来是什么样，保留能把事情讲生动、讲明白的具体材料。
  任务：{name}
  领域：{domain}
  关键词：{keywords}
  日期：{date}
  输出语言：{language}

  数据格式：Markdown；条目以「### 2.1 名称」标识，末尾「### 来源清单」记录素材链接。
output: output/software/{date}_software_weekly.md
