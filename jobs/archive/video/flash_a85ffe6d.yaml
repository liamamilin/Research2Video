prompt: |-
  你是一名技术研究员，为一位制作 B 站 60–90 秒 AI / 软件开发快讯视频的创作者核实一条变化。你的报告会被写成约 1.25 分钟的口播文稿，文稿里的每个事实都要能追溯到你引用的网页，所以每个关键判断都要给出原始网址。

  ## 条目
  - 标题：OpenAI 弃用 GPT-4o 与 GPT-4.1 系列
  - 一句话：GPT-4o、GPT-4o mini、GPT-4.1、GPT-4.1 mini 将于 2027-01-14 从 API 下线。
  - 发布日期：2026-10-14
  - 变化（旧 → 新）：四个模型（快照 `gpt-4o-2024-08-06`、`gpt-4o-2024-11-20`、`gpt-4o-mini-2024-07-18`、`gpt-4.1-2025-04-14`、`gpt-4.1-mini-2025-04-14`）→ 2027-01-14 关停，官方指定唯一替代 `gpt-6-luna`；单价（每百万 token，输入/输出，Standard 档）`gpt-4o` $2.50/$10.00 → `gpt-6-luna` $0.10/$0.50，`gpt-4.1-mini` $0.40/$1.60 → $0.10/$0.50。
  - 对开发者的影响：任何 model 字符串以 `gpt-4o` 或 `gpt-4.1` 开头的调用在 2027-01-14 后直接失败，微调版本一并下线。token 单价大幅下降，但 Luna 是推理模型，实际消耗的 token 数会变，按 token 而非金额设的预算告警会误报。
  - 候选来源：
  https://developers.openai.com/api/docs/deprecations
  https://dev.to/gabrielanhaia/gpt-4o-and-gpt-41-leave-openais-api-on-january-14-2027-you-have-92-days-2n9b
  https://cellcog.ai/blog/gpt-4o-api-shutdown

  ## 任务
  核实这条变化是否属实、数字是否准确，并找出它对开发者的实际影响。检索保持克制：以核实为主，不做背景综述。
  1. 打开候选来源，确认日期、旧到新的数字、适用范围（哪些套餐、哪些模型、什么时候生效）。
  2. 找一个独立来源交叉核对核心数字；只有厂商自己的说法时，标注「厂商自述，未独立验证」。
  3. 找出例外、生效条件或隐藏的计费坑；确实找不到时写明「未找到限制条件」。
  4. 数字（价格、版本号、日期、比例）照来源原样写，注明口径（输入还是输出、每百万 token 还是每次）。
  证据以 {date_7d_ago} 至 {date} 的信息为主；更早的关键资料可以用，但要注明原始日期。
  输出语言：{language}。

  ## 证据规则
  1. 每个关键判断附来源网址和发布日期。优先官方文档、发布说明、代码仓库、论文、定价页等一手来源；媒体和社区帖子只作补充。
  2. 网址必须是你实际检索到的真实页面，禁止编造、猜测或拼接网址；不确定就不写。
  3. 区分「已证实」「有迹象」「推测」，不把推测写成事实。

  ## 输出结构
  ### 1. 直接回答
  ### 2. 关键事实（表格：事实 | 置信度 | 来源编号）
  ### 3. 限制与反方证据
  ### 4. 仍未确定的问题
  ### 5. 适合快讯的讲法（不超过 2 条）
  ### 6. 来源清单
  编号列表，每行一个来源：编号. 标题 | 一手/二手 | 发布日期 | 完整网址
output: output/video/{datetime}_flash_a85ffe6d.md
