prompt: |-
  你是一名技术研究员，为一位制作 AI / 软件类知识视频的创作者做选题调研。你的报告会被写成一篇约 6 分钟的口播文稿，文稿里的每个事实都要能追溯到你引用的网页，所以每个关键判断都要给出原始网址。

  ## 选题
  - 标题：长上下文计费陷阱：>272K 的请求，是整次请求翻倍
  - 核心角度：把「阈值拦截」做成路由层的硬规则
  - 目标受众：习惯「把整个仓库塞进上下文」的 agent 开发者；做长文档分析的数据分析师
  - 为什么有人在乎：OpenAI 官方文档明确：GPT-6 Sol 输入超过 272K token 的请求，整次请求的输入与缓存费率按 2x 计、输出按 1.5x 计；缓存写入按未缓存输入价的 1.25x；区域化处理另加 10% 溢价（2026-09-22 随模型发布同步文档，窗口边界项，https://developers.openai.com/api/docs/models/gpt-6-sol ）。这是最容易被预算模型低估的一类坑。
  - 建议大纲：① 阈值计价图示（分块 vs 直投）→ ② 三种替代方案成本对比（超长直投 / 分块 + 缓存 / 换 1M 上下文模型）→ ③ 路由层告警与上下文裁剪实现 → ④ 上线前的 5 条检查项

  ## 任务
  围绕这个选题做深度调研：先直接回答它要回答的问题，再给出支撑证据、反方证据和仍未确定的部分。证据以 {date_7d_ago} 至 {date} 的信息为主；更早的关键资料可以用，但要注明原始日期。
  输出语言：{language}。

  ## 证据规则
  1. 每个关键判断附来源网址和发布日期。优先官方文档、发布说明、代码仓库、论文、定价页等一手来源；媒体和社区帖子只作补充。
  2. 网址必须是你实际检索到的真实页面，禁止编造、猜测或拼接网址；不确定就不写。
  3. 核心结论尽量由两个相互独立的来源支撑；只有厂商自己的说法时，标注「厂商自述，未独立验证」。
  4. 给出反方证据或失败案例；确实找不到时写明「未找到反方证据」。
  5. 区分「已证实」「有迹象」「推测」，不把推测写成事实。
  6. 数字（价格、版本号、日期、比例）照来源原样写，注明口径。

  ## 输出结构
  ### 1. 直接回答
  ### 2. 关键事实（表格：事实 | 置信度 | 来源编号）
  ### 3. 争议与反方证据
  ### 4. 仍未确定的问题
  ### 5. 适合视频的讲述角度（不超过 3 条）
  ### 6. 来源清单
  编号列表，每行一个来源：编号. 标题 | 一手/二手 | 发布日期 | 完整网址
output: output/video/{datetime}_deep_dive_48fef9b1.md
