prompt: |-
  你是一名技术研究员，为一位制作 B 站 60–90 秒 AI / 软件开发快讯视频的创作者核实一条变化。你的报告会被写成约 1.25 分钟的口播文稿，文稿里的每个事实都要能追溯到你引用的网页，所以每个关键判断都要给出原始网址。

  ## 条目
  - 标题：DeepSeek 搜索接口结束免费期
  - 一句话：三框架的 Search/Fetch 免费期将在 10 月 31 日结束。
  - 发布日期：2026-10-17
  - 变化（旧 → 新）：Search/Fetch 此前非全量开放 → 2026-10-17 向所有开发者开放；DeepSeek Harness、Claude Code、Codex 的服务端工具路径目前免费 → 2026-10-31 16:00 UTC 起按 $0.75/每 1,000 次成功请求计费，Search 与 Fetch 分别适用；每账号每接口 5 QPS。
  - 对开发者的影响：免费承诺只覆盖三条服务端工具路径，官方未同样写明直接调用两个接口在 10 月 31 日前免费；届时失败或空结果不计费，但成功请求新增费用。5 QPS 会约束高并发 agent，而 Claude Code/Codex 的 Web Search 仍会另算模型 token。
  - 候选来源：
  https://api-docs.deepseek.com/news/news261017
  https://api-docs.deepseek.com/guides/search
  https://api-docs.deepseek.com/quick_start/pricing
  https://api-docs.deepseek.com/zh-cn/quick_start/pricing/
  https://api-docs.deepseek.com/updates/
  https://api-docs.deepseek.com/api/search
  https://api-docs.deepseek.com/api/fetch
  https://thenewstack.io/deepseek-web-search-api
  https://api-docs.deepseek.com/zh-cn/quick_start/agent_integrations/claude_code/

  ## 任务
  核实这条变化是否属实、数字是否准确，并找出它对开发者的实际影响。检索保持克制：以核实为主，不做背景综述。
  1. 打开候选来源，确认日期、旧到新的数字、适用范围（哪些套餐、哪些模型、什么时候生效）。
  2. 找一个独立来源交叉核对核心数字；只有厂商自己的说法时，标注「厂商自述，未独立验证」。
  3. 找出例外、生效条件或隐藏的计费坑；确实找不到时写明「未找到限制条件」。
  4. 数字（价格、版本号、日期、比例）照来源原样写，注明口径（输入还是输出、每百万 token 还是每次）。
  证据以 {date_7d_ago} 至 {date} 的信息为主；更早的关键资料可以用，但要注明原始日期。
  输出语言：{language}。

  ## 证据规则
  1. 每个关键判断附来源网址和发布日期。优先官方文档、发布说明、代码仓库、论文、定价页等一手来源；媒体和社区帖子只作补充。
  2. 网址必须是你实际检索到的真实页面，禁止编造、猜测或拼接网址；不确定就不写。
  3. 区分「已证实」「有迹象」「推测」，不把推测写成事实。

  ## 输出结构
  ### 1. 直接回答
  ### 2. 关键事实（表格：事实 | 置信度 | 来源编号）
  ### 3. 限制与反方证据
  ### 4. 仍未确定的问题
  ### 5. 适合快讯的讲法（不超过 2 条）
  ### 6. 来源清单
  编号列表，每行一个来源：编号. 标题 | 一手/二手 | 发布日期 | 完整网址
output: output/video/{datetime}_flash_c5d88429.md
