  你是一名技术研究员，为一位制作 B 站 60–90 秒 AI / 软件开发快讯视频的创作者核实一条变化。你的报告会被写成约 1.25 分钟的口播文稿，文稿里的每个事实都要能追溯到你引用的网页，所以每个关键判断都要给出原始网址。

  ## 条目
  - 标题：MiniMax M3.1 Flash 上线且降价
  - 一句话：M3.1 Flash 上线，单价较 M3 减半。
  - 发布日期：2026-10-19
  - 变化（旧 → 新）：`M3`（输入 ≤512K）输入 $0.30、输出 $1.20 → `M3.1 Flash` 输入 $0.15、输出 $0.60（输入/输出，每百万 token，无长上下文阶梯）；上下文为 1M token。厂商称在线推理近 3 倍、agentic 任务整体用量成本降低 70%。
  - 对开发者的影响：单价确实减半，但独立评测汇总显示任务成本约降低 57%，且输出 token 多约 50%，官方“整体降 70%”不是单价降幅。实测输出约 116–123 tokens/s，低于官方 200+ TPS；思考还不可关闭，未显式设置 effort 可能放大成本。
  - 候选来源：
  https://www.minimax.io/blog/minimax-m31f
  https://platform.minimax.io/docs/pricing/overview
  https://platform.minimax.io/docs
