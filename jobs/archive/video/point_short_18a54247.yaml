prompt: |-
  你是一名技术研究员，为一位制作 B 站 60–120 秒 AI / 软件知识短视频的创作者核实一个知识点。你的报告会被写成约 1.5 分钟的口播文稿，文稿里的每个事实都要能追溯到你引用的网页，所以每个关键判断都要给出原始网址。

  ## 知识点
  - 标题：OpenAI 下线 GPT-4o 与 GPT-4.1 API
  - 核心角度：GPT-4o 等五个快照将在 2027-01-14 下线。
  - 目标受众：开发者
  - 为什么有人在乎：依赖这五个精确快照或其微调版本的请求将不再可用，而 `gpt-6-luna` 不支持微调；替换模型单价更低，但推理 token 和任务总耗时会改变实际账单。此次通知仅 92 天，低于 OpenAI 对 GA 模型至少 6 个月的承诺。

  ## 任务
  只围绕这一个点：先直接回答它要回答的问题，再给出最关键的一个数字或例子，以及它成立的前提和例外。不展开相邻话题。
  证据以 {date_7d_ago} 至 {date} 的信息为主；更早的关键资料可以用，但要注明原始日期。
  输出语言：{language}。

  ## 证据规则
  1. 每个关键判断附来源网址和发布日期。优先官方文档、发布说明、代码仓库、论文、定价页等一手来源。
  2. 网址必须是你实际检索到的真实页面，禁止编造、猜测或拼接网址；不确定就不写。
  3. 区分「已证实」「有迹象」「推测」，不把推测写成事实。
  4. 数字照来源原样写，注明口径。

  ## 输出结构
  ### 1. 直接回答
  ### 2. 关键事实（表格：事实 | 置信度 | 来源编号）
  ### 3. 前提、例外与反方证据
  ### 4. 仍未确定的问题
  ### 5. 适合短视频的讲法（不超过 2 条）
  ### 6. 来源清单
  编号列表，每行一个来源：编号. 标题 | 一手/二手 | 发布日期 | 完整网址
output: output/video/{datetime}_point_short_18a54247.md
