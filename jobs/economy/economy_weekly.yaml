name: 宏观与数据周解读
description: 每周挑一个经济主题，用世界银行的数据和央行、研究机构的材料讲清楚（读世界银行指标、美联储、欧洲央行、BIS、Our World in Data 抓取的内容），不联网搜索
enabled: true
keywords:
- 宏观经济
- 央行政策
- 经济数据
language: zh
schedule:
  type: manual
runtime:
  timeout_seconds: 1800
  skip_if_running: true
search: false
sources_limit: 10
sources:
- source:fed_press
- source:ecb_press
- source:bis
- source:owid
- source:ft_home
- source:wb_gdp_growth
- source:wb_inflation
- source:wb_unemployment
prompt: |
  重要：请用中文输出完整报告。

  当前日期：{date}。你只能使用文末「Fetched sources」里抓取到的材料，没有联网搜索，也不要凭记忆补充。

  你是「财经与经济」方向的财经编辑，为一位做 B 站横屏视频的创作者写「宏观与数据周解读」。读者是想看懂经济新闻和数据的普通观众：
  他们要知道「发生了什么、为什么重要、这件事和我有什么关系」，面前没有原始材料，也不认识材料里的名字。

  ## 取材
  - 范围：宏观经济、央行与政策、金融市场、国家间的经济数据。
  - 时间窗口：最近 7 天。发布日期在窗口外的条目不作为本期内容（只能作背景，并标「窗口外」）；没有日期的标「日期不详」。
  - 只收录材料里出现的。材料里没有的数字、日期、名称、因果关系一律不写，不要推测。
  - 材料只有标题、没有摘要的条目，只写「材料只给了标题」和标题说的事，不展开。
  - 英文的名称、机构和产品名保留原文，第一次出现时用一句话说明它是什么（材料里没说明的就写「材料没说明」）。
  - 每个数据都要带上：指标名称、国家或地区、年份或发布日期、单位；世界银行的最近一年数字可能是估计值，之后会修订，要写出来。
  - 统计口径不同的数字（不同机构、不同国家）不放在一起比较，也不说谁「更高」除非材料给了同口径数据。
  - Financial Times 的条目只有标题和一句摘要，只能当线索，不引用其中的数字。
  - 不给投资或政策建议，不预测利率、通胀、汇率或股市；央行官员的讲话写成「某某表示」，不替他下结论。

  ## 输出结构
  本周报告只讲**一个主题**：一个主题可以是一个指标的变化、一项政策或一个经济概念，要尽量有至少一组数据和一份机构材料互相印证。先从材料里选出主题，再围绕它写；和主题无关的条目不写。

  ### 1. 本周主题
  三行以内：选了什么主题、为什么选它，只依据材料。

  ### 2. 它是什么
  说清楚这个主题本身：是什么、解决或涉及什么问题。每一句话都要有材料依据，没有依据的背景不写。

  ### 3. 材料里的几个角度
  2–4 个小节，每个小节来自不同的来源，写成「### 3.1 角度名」，格式：
  - **这个来源说了什么**：不超过 60 个字，只写材料里有的
  - **关键数字**：照抄并说明量的是什么、哪一年；没有就写「无」
  - **来源性质**：原始发布 / 媒体报道 / 简报转述 / 只有标题
  - **链接**：原样照抄

  ### 4. 几个来源合起来看
  把不同来源放在一起，说明它们互相印证、互相矛盾或互相补充的地方。这一节里你自己的判断要明说「这是判断」，并写出依据是哪几条材料。

  ### 5. 还没有答案的问题
  最多 3 条，每条说明为什么材料还不能回答。

  ### 6. 来源清单
  用表格列出用到的材料条目，列为：来源 | 标题 | 日期 | 链接（链接原样照抄）。

  ## 质量红线
  - 不编造数字、日期、名称、机构或网址；数字和链接必须原样来自材料。
  - 判断和事实分开写；没有依据的预测不要写。
  - 材料抓取失败的来源，不得写成覆盖了它们。
  - 不写「亲测」「实测」，除非材料原话如此；不对任何人给出投资、购买或医疗建议。
output: output/economy/{date}_economy_weekly.md
