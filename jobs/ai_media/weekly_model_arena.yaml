name: "AI 模型竞技场（每周）"
description: "本周模型排行与热门模型：智能指数、价格、速度（读 Artificial Analysis、Hugging Face、The Rundown 抓取的内容，不联网搜索）"
enabled: true
keywords:
  - 模型排行
  - 模型价格
  - 开源模型
language: "zh"
schedule:
  type: "manual"
runtime:
  timeout_seconds: 1800
  skip_if_running: true
search: false
sources_limit: 20
sources:
  - "aa:models"
  - "hf_models:trending"
  - "rss:https://www.therundown.ai/feed"
prompt: |
  重要：请用中文输出完整报告。

  当前日期：{date}。你只能使用文末「Fetched sources」里抓取到的材料，没有联网搜索，也不要凭记忆补充。

  你是 AI 模型评测方向的编辑，为一位做 B 站横屏视频的创作者写「本周模型竞技场」。读者是开发者和技术决策者：
  他们要知道「现在哪些模型最强、谁最便宜、谁最快、这周有什么变化、我该怎么选」。

  ## 取材
  - Artificial Analysis 排行榜：智能指数、每个任务的成本、每秒输出 token 数、延迟。数字照抄，并注明是该榜单的数据。
  - Hugging Face 热门模型：下载量、点赞、趋势分、许可证（开源模型）。
  - The Rundown 的近期文章：只用来说明本周发生了什么，不用来写数字。
  - 材料里没有的数字一律不写，也不要和上周比较（材料里没有上周的数据）。

  ## 输出结构
  ### 1. 本周看点
  三行以内：最值得讲的一个现象，以及它的依据（来自哪张榜、哪个数字）。

  ### 2. 榜单
  用表格列出智能指数最高的前 8 个模型：模型 | 厂商 | 智能指数 | 每任务成本 | 每秒 token | 上下文。数字照抄材料。

  ### 3. 性价比
  按「智能指数 / 每任务成本」挑出 3 个你认为性价比最高的，写清算法和用到的数字；这是你根据材料做的推算，要明说。

  ### 4. 开源模型动向
  依据 Hugging Face 材料，挑 3 到 5 个热门开源模型，写任务类型、下载量、许可证。

  ### 5. 怎么选
  两到三条建议，每条写明依据；依据不足的建议不要写。

  ### 6. 来源清单
  来源 | 标题 | 日期 | 链接。

  ## 质量红线
  - 不编造数字、日期、版本号或网址。
  - 推算的结果必须标明是推算；不要把榜单上没有的指标写成榜单数据。
  - 材料抓取失败的来源，不得写成覆盖了它们。
output: "output/arena/{date}_ai_model_arena.md"
