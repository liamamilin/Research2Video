name: T01 · 产品与能力认知
description: ChatGPT 到底能做什么？ — 吸引新用户；按 S01–S06 资料研究 ChatGPT 视频题材。
enabled: true
keywords:
- ChatGPT 能做什么
- ChatGPT 入门
language: zh
schedule:
  type: manual
runtime:
  timeout_seconds: 2400
  skip_if_running: true
search: false
source_history: false
sources_limit: 8
sources:
- source:cg_capabilities
- source:cg_learn_videos
- source:cg_help
- source:cg_release_notes
prompt: |
  根据素材，产出目标观众愿意看、听得懂、想继续看的视频。
  当前步骤：为「ChatGPT 获客矩阵」研究题材，写成后续作者可以直接使用的候选材料。
  题材：T01 产品与能力认知
  观众核心问题：ChatGPT 到底能做什么？
  获客作用：吸引新用户
  目标受众：中文普通用户、职场与学习人群，以及正在考虑升级 ChatGPT 的潜在订阅用户。
  从官方演示挑一个普通人容易理解的能力，用具体输入、操作与可见输出解释它能完成什么。优先让不了解 ChatGPT 的观众看懂结果，不堆功能名称。
  优先提炼对观众有用的任务、操作和可见成果，以价值展示与解决问题自然承接购买意图。
  创作者视频与播客只作为公开标题、简介或索引文本中的研究线索；拿到完整内容时再展开，不能凭标题补写操作或测试结果。
  素材中提供的具体事实、数据和结论作为输入，围绕解释与画面组织材料，不额外增加人工审核步骤。
  每个候选聚焦一个观众问题，保留场景、具体对象、操作过程、结果和画面建议。候选数量由材料决定。
  任务：{name}
  领域：{domain}
  关键词：{keywords}
  日期：{date}
  输出语言：{language}

  输出 Markdown。每个候选使用三级标题，并按以下字段写明；不要将概览或来源清单写成候选。
  ### 1. 选题标题
  - **题材分类**：T01 产品与能力认知
  - **一句话**：这一期帮助观众理解或完成什么
  - **核心角度**：ChatGPT 到底能做什么？ 对应的具体切入点
  - **目标受众**：有哪种任务或疑问的人
  - **具体材料**：来自本次素材的内容、例子、数据与适用条件
  - **操作与演示**：可以展示的输入、步骤与输出；待实测部分标明待实测
  - **画面建议**：能讲清变化或过程的页面、操作、对比或结果
  - **获客作用**：吸引新用户；与观众下一步选择的联系
  - **发布日期**：材料提供的日期；没有则写未提供
  - **来源网址**：实际使用的素材链接

  ## 来源清单
  记录实际使用的来源链接。
  若变化监测显示没有新增或修改，只输出本次暂无新题材及简短说明，不生成重复候选。
output: output/chatgpt_acquisition/{date}_t01_product.md
topics:
  alias: chatgpt_t01_product
  format: items
  prefix: CGA
  refresh: true
