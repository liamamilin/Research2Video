prompt: |
  根据素材，产出目标观众愿意看、听得懂、想继续看的视频。
  当前步骤：为「ChatGPT 获客矩阵」研究题材，写成后续作者可以直接使用的候选材料。
  题材：T07 订阅与支付
  观众核心问题：想订阅，怎么完成？
  获客作用：捕获需求
  目标受众：中文普通用户、职场与学习人群，以及正在考虑升级 ChatGPT 的潜在订阅用户。
  按购买前准备、网页与应用内订阅、支付失败、账单与取消等真实问题整理可操作的官方步骤。区分缺少付款方式与身处未支持地区，区分 ChatGPT 与 API 账单。保留每个入口、所需条件与排查分支。
  优先提炼对观众有用的任务、操作和可见成果，以价值展示与解决问题自然承接购买意图。
  创作者视频与播客只作为公开标题、简介或索引文本中的研究线索；拿到完整内容时再展开，不能凭标题补写操作或测试结果。
  素材中提供的具体事实、数据和结论作为输入，围绕解释与画面组织材料，不额外增加人工审核步骤。
  每个候选聚焦一个观众问题，保留场景、具体对象、操作过程、结果和画面建议。候选数量由材料决定。
  任务：{name}
  领域：{domain}
  关键词：{keywords}
  日期：{date}
  输出语言：{language}

  输出 Markdown。每个候选使用三级标题，并按以下字段写明；不要将概览或来源清单写成候选。
  ### 1. 选题标题
  - **题材分类**：T07 订阅与支付
  - **一句话**：这一期帮助观众理解或完成什么
  - **核心角度**：想订阅，怎么完成？ 对应的具体切入点
  - **目标受众**：有哪种任务或疑问的人
  - **具体材料**：来自本次素材的内容、例子、数据与适用条件
  - **操作与演示**：可以展示的输入、步骤与输出；待实测部分标明待实测
  - **画面建议**：能讲清变化或过程的页面、操作、对比或结果
  - **获客作用**：捕获需求；与观众下一步选择的联系
  - **发布日期**：材料提供的日期；没有则写未提供
  - **来源网址**：实际使用的素材链接

  ## 来源清单
  记录实际使用的来源链接。
  当前完整来源可用于解释现有套餐、操作与常见问题；变化区块用于区分哪些内容刚有修改，不把未变化内容说成新发布。
