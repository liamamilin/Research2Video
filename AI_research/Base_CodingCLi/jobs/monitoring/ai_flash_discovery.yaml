name: "AI Flash Discovery"
description: "近 2 天 AI 与软件开发领域值得讲的变化（读 TLDR AI、The Rundown 抓取的内容，不联网搜索）：围绕有价值的变化挑选素材"
enabled: true
keywords:
  - 新模型发布
  - API 价格变化
  - AI 编程工具更新
  - agent 框架发布
  - 开源模型发布
  - 额度与限流变化
language: "zh"
schedule:
  type: "manual"
search: false            # 只读下面声明的订阅源，不联网搜索（core/engine.py）
sources_limit: 10
sources:
  - "tldr:ai"
  - "rss:https://www.therundown.ai/feed"
  - "hf_models:trending"
  - "tag:ai_radar"
runtime:
  timeout_seconds: 2400
  skip_if_running: true
prompt: |
  根据素材，产出目标观众愿意看、听得懂、想继续看的视频。
  当前步骤：研究事情本身，形成供视频作者展开讲述的研究底稿。
  栏目：AI 快讯，面向已经在工作中使用 AI 的开发者和高频使用者。
  研究方向：从现有来源中挑出会改变能力、成本、使用门槛或操作方式的重要变化，帮助后续作者回答“这次变化和我做的哪件事有关”。
  对每个候选保留具体对象、这次改变了什么、相关工作场景，以及能展示变化的页面与细节。优先把最值得单独讲一期的发现放在前面，候选数量由本期材料决定。
  研究保留足以展开讲述的材料，视频作者将围绕其中一个变化重新创作完整口播。
  开头用简短导读说明本期值得关注的变化，条目正文保留理解它所需的细节。对有展开价值的变化，沿一个具体使用场景写清原来怎样操作、现在过程怎样改变、用户最终得到什么；把材料中的一次操作或前后状态展开，解释中间起作用的机制。
  一句话字段用于快速浏览，正文中的例子、过程和背景仍然充分展开。保留可展示的页面、输入输出或功能位置，相关条件贴着它影响的操作说明。研究底稿和原始材料会共同交给作者，视频顺序、篇幅与标题留给作者组织，不预先压成短口播。
  将项目、论文或公告的原始链接贴在相应的例子与解释旁，末尾仍保留来源清单，便于后续作者取用对应正文。
  任务：{name}
  领域：{domain}
  关键词：{keywords}
  日期：{date}
  输出语言：{language}

  数据格式：Markdown。
  ### 1.1 选题标题
  - **一句话**：内容
  - **发布日期**：日期
  - **证据来源**：链接

  ### 来源清单
  素材链接。
output: "output/flash/{date}_ai_flash_discovery.md"
# 选题来源（spec/video-topics.md）：报告里的 ### 1.1 条目导入选题表，编号 F1、F2…；自动流水线可在当天没有报告时启动它
topics:
  alias: flash
  format: flash
  refresh: true
