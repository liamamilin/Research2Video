# 视频调研模板（spec/video-recipes.md）：配方写 research: {template: quick_take} 引用它，每篇文稿的调研 Job 由它生成。
# prompt 里的 {topic.<字段>}、{topic_title} 等由选题填，{date} 等由 Job 运行时填。

name: 视频调研：快讯
description: 一个变化讲清楚：改了什么（旧到新）、对观众意味着什么、现在该做什么。
language: zh
runtime:
  timeout_seconds: 1500
prompt: |
  根据素材，产出目标观众愿意看、听得懂、想继续看的视频。
  当前步骤：研究这个选题，把后续讲述用得上的具体资料写明白。
  研究方向：找到这个新变化最值得观众关心的地方，准备能把变化讲清楚的具体材料。
  选题：{topic_title}
  目标观众：{topic_audience}
  选题资料：{topic.一句话}；{topic_change}
  来源资料：{topic_sources}
  日期：{date}
  输出语言：{language}

  数据格式：Markdown；末尾「### 来源清单」记录素材链接。
