# 视频调研模板（spec/video-recipes.md）：配方写 research: {template: quick_take} 引用它，每篇文稿的调研 Job 由它生成。
# prompt 里的 {topic.<字段>}、{topic_title} 等由选题填，{date} 等由 Job 运行时填。

name: 视频调研：快讯
description: 挖清变化实质、受影响人群与隐藏边界，以及观众立刻该查的动作或盯紧的关键信号。
language: zh
runtime:
  timeout_seconds: 1500
prompt: |
  根据素材，产出目标观众愿意看、听得懂、想继续看的视频。
  当前步骤：研究这个选题，把后续写高密度快讯口播所需的硬资料挖透。
  研究方向：不要只复述新闻通稿。重点找清三件事：
  1. 真正变了什么（旧到新的具体差值，以及官方宣传里没披露的基线、前提或限制）；
  2. 到底咬到谁的利益（哪类用户/开发者/行业立刻受影响、哪类人不受影响）；
  3. 观众现在能立刻核对的版本/配置/入口动作，或悬而未决事件接下来最该盯紧的时间节点与关键信号。
  选题：{topic_title}
  目标观众：{topic_audience}
  选题资料：{topic.一句话}；{topic_change}
  来源资料：{topic_sources}
  日期：{date}
  输出语言：{language}

  数据格式：Markdown；末尾「### 来源清单」记录素材链接。
