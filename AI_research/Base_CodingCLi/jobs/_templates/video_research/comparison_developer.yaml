# 视频调研模板（spec/video-recipes.md）：配方写 research: {template: comparison_developer} 引用它，每篇文稿的调研 Job 由它生成。
# prompt 里的 {topic.<字段>}、{topic_title} 等由选题填，{date} 等由 Job 运行时填。

name: 视频调研：对比 · 开发者
description: 挖清决定选型的核心分水岭、不同工作流该选谁，以及各自最隐蔽的成本、限额或使用陷阱。
language: zh
runtime:
  timeout_seconds: 2400
prompt: |
  根据素材，产出目标观众愿意看、听得懂、想继续看的视频。
  当前步骤：研究这个选题，把后续写立场鲜明的选型对比稿所需的硬资料挖透。
  研究方向：不要堆砌平淡的优缺点清单。重点找三类决定选择的实证资料：
  1. 真正拉开差距的核心分水岭（同口径的实测任务结果、总任务账单或吞吐/延迟边界）；
  2. 不同具体工作流、上下文规模或预算门槛下，什么人该直接选哪个对象；
  3. 每个对象参数表第一行看不到、上手后最容易踩的隐蔽坑（例如单价低但任务总价反超、超阈值加价或缓存失效、静默降级/路由、账号或入口限制、权限与安全边界、厂商自报与独立评测的口径差异）。有真坑就写清触发条件和来源，没有就不硬凑。
  选题：{topic_title}
  目标观众：{topic_audience}
  选题资料：{topic.一句话}
  对比对象：{topic_subjects}
  对比维度：{topic_dimensions}
  来源资料：{topic_sources}
  日期：{date}
  输出语言：{language}

  数据格式：Markdown；末尾「### 来源清单」记录素材链接。
