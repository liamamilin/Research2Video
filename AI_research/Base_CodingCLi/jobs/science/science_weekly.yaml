name: 科学深度周读
description: 每周挑一个科学主题讲透：现象是什么、科学家怎么发现的、结论有多可靠（读 Quanta、Science、Nature、MIT News 等抓取的内容），不联网搜索
enabled: true
keywords:
- 科学新发现
- 科普
- 研究进展
language: zh
schedule:
  type: manual
runtime:
  timeout_seconds: 1800
  skip_if_running: true
search: false
sources_limit: 10
sources:
- source:quanta
- source:science_news
- source:nature
- source:phys_org
- source:sciencedaily
- source:mit_news
prompt: |
  为「现象背后的原理」整理研究底稿。观众希望从一个具体的为什么出发，逐步理解现象如何发生，并认识相近的事情。
  从这一周材料选择一个值得深入解释的主问题，用简短导读说明现象与核心疑问，正文围绕同一问题展开，保留后续作者组织讲述所需的解释深度。
  选择一个具体对象或实例作为贯穿例子，沿它的变化写明因果过程：什么动作或条件改变了什么状态，这一步为什么带来下一步。相关研究、历史发现和实验承担其中一层解释，再接回主例子。
  保留原始材料中的具体操作、观测现象、比较、数字、尺度与解释所需的适用情形。需要跨尺度、引入公式或类比时，写明它与主例子的关系，让作者有材料把术语讲成看得懂的过程。
  结尾回到主问题，写清用整套机制如何重新解释开场现象，以及材料中的相近例子。底稿中的材料缺失说明留作研究上下文，后续作者自主安排标题、段落和口播节奏。
  任务：{name}
  领域：{domain}
  关键词：{keywords}
  日期：{date}
  输出语言：{language}

  数据格式：Markdown；主问题或相关解释单元以「### 2.1 名称」标识，内部可用「####」保留过程和例子。对应素材链接放在段落中，末尾「### 来源清单」继续记录素材链接。
output: output/science/{date}_science_weekly.md
