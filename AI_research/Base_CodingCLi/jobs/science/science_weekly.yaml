name: 科学深度周读
description: 每周挑一个科学主题讲透：现象是什么、科学家怎么发现的、结论有多可靠（读 Quanta、Science、Nature、MIT News 等抓取的内容），初稿沿用固定材料，选题后按问题补材
enabled: true
keywords:
- 科学新发现
- 科普
- 研究进展
language: zh
schedule:
  type: manual
runtime:
  timeout_seconds: 1800
  skip_if_running: true
search: false
sources_limit: 10
sources:
- source:quanta
- source:science_news
- source:nature
- source:phys_org
- source:sciencedaily
- source:mit_news
- source:esa_science
- source:nih_news
- source:nsf_news
- source:science_journal
- source:cell_journal
- source:scientific_american
- source:new_scientist
- source:knowable
prompt: |
  为「现象背后的原理」整理研究底稿。观众希望从一个具体的为什么出发，逐步理解现象如何发生，并认识相近的事情。
  从这一周材料选择一个值得深入解释的主问题，用简短导读说明现象与核心疑问，正文围绕同一问题展开，保留后续作者组织讲述所需的解释深度。
  选择一个具体对象或实例作为贯穿例子，沿它的变化写明因果过程：什么动作或条件改变了什么状态，这一步为什么带来下一步。相关研究、历史发现和实验承担其中一层解释，再接回主例子。
  保留原始材料中的具体操作、观测现象、比较、数字、尺度与解释所需的适用情形。需要跨尺度、引入公式或类比时，写明它与主例子的关系，让作者有材料把术语讲成看得懂的过程。
  结尾回到主问题，写清用整套机制如何重新解释开场现象，以及材料中的相近例子。底稿中的材料缺失说明留作研究上下文，后续作者自主安排标题、段落和口播节奏。
  任务：{name}
  领域：{domain}
  关键词：{keywords}
  日期：{date}
  输出语言：{language}

  数据格式：Markdown；主问题或相关解释单元以「### 2.1 名称」标识，内部可用「####」保留过程和例子。对应素材链接放在段落中，末尾「### 来源清单」继续记录素材链接。
  选题与材料组织：科学：从生活现象、好奇心或反直觉发现进入，保留实验对象、操作、观测与解释链，不硬写消费建议。
  选题分别考虑与观众切身相关的收益或损失、情绪动机、有趣的新发现和可带走的理解，不要求每题全部具备。优先在栏目范围内覆盖较广的共同问题，具体例子不等于整篇受众；专业问题保留真实适用范围，不伪装成人人适用。说明观看动机、新意与实际收获；商业关联可以较弱，不硬接购买、不预测转化。热度是辅助线索，不等于本题需求；不把多个维度合成总分。材料按需求线索、变化或事实材料、具体案例、比较或解释背景搭配，不必凑齐四类。
  本期只选一个主问题，先判断为什么有人值得花时间理解它，再围绕它保留完整解释、原因、过程、案例及条件。不要为了覆盖面拆成新闻列表，也不把商业关联硬写成购买建议。
  原有文稿风格、结构与口播安排交由下游作者；此步骤优化选什么和材料如何组织，不预写新的口播模板。
output: output/science/{date}_science_weekly.md
content_strategy: audience-v1

# After initial research and audience-led selection; preserves the existing writer.
question_material: question-v1
