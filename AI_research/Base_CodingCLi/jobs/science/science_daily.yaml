name: 科学新发现日报
description: 每天值得关注的几项科学新发现（读 Quanta、Science、Nature、Phys.org、ScienceDaily 抓取的内容），初稿沿用固定材料，选题后按问题补材
domain: 科学与知识
enabled: true
keywords:
- 科学新发现
- 科普
- 研究进展
language: zh
schedule:
  type: manual
runtime:
  timeout_seconds: 1800
  skip_if_running: true
search: false
sources_limit: 8
sources:
- source:science_news
- source:quanta
- source:nature
- source:phys_org
- source:sciencedaily
- source:esa_science
- source:nih_news
- source:science_journal
- source:cell_journal
- source:scientific_american
- source:new_scientist
prompt: |
  为「科学新理解」整理研究底稿。观众想理解一项研究做了什么，以及它让我们对一个具体问题多理解了什么。
  从本次材料选出可持续解释的研究问题。可以简短概览值得讲的候选，并为重点候选保留完整资料段落，供作者选择其中一个展开。
  围绕每个候选讲清具体研究对象、原来的疑问、研究者采取的操作或观测、看见的变化，以及结果如何连接到新的理解。
  保留材料里的实验过程、对照、例子、尺度、关键数字、对象之间的关系与适用情形；相关原文可以完整摘录在对应主题下，术语贴着它解释的现象展开。
  让后续作者可以沿一个具体过程讲故事，主要篇幅留给事情如何发生。已有材料中的缺失说明留在底稿，不转成要求观众执行的清单。讲述节奏与最终口播由后续作者安排。
  任务：{name}
  领域：{domain}
  关键词：{keywords}
  日期：{date}
  输出语言：{language}

  数据格式：Markdown；候选条目以「### 2.1 名称」标识，条目内部可用「####」保留具体过程和例子。对应素材链接放在条目中，末尾「### 来源清单」继续记录素材链接。
  选题与材料组织：科学：从生活现象、好奇心或反直觉发现进入，保留实验对象、操作、观测与解释链，不硬写消费建议。
  选题分别考虑与观众切身相关的收益或损失、情绪动机、有趣的新发现和可带走的理解，不要求每题全部具备。优先在栏目范围内覆盖较广的共同问题，具体例子不等于整篇受众；专业问题保留真实适用范围，不伪装成人人适用。商业关联可以较弱，不硬接购买、不预测转化。热度是辅助线索，不等于本题需求；不把多个维度合成总分。材料按需求线索、变化或事实材料、具体案例、比较或解释背景搭配，不必凑齐四类。
  候选按本轮值得制作的顺序排列，先说明共同问题，再保存能展开讲述的具体材料。保留原有字段和本栏目需要的操作、测试、实例或比较条件；不为扩大受众泛化专业内容。
  原有文稿风格、结构与口播安排交由下游作者；此步骤优化选什么和材料如何组织，不预写新的口播模板。
output: output/science/{date}_science_daily.md
audience_channel: science_daily
content_strategy: audience-v1
question_material: question-v1
