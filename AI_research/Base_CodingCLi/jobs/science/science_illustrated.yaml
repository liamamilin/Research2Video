name: 科学插画讲解
description: 每次讲透一个身边现象背后的科学原理，写成能配插画的知识讲解底稿（不联网，凭已有知识写；Curious Kids 和 Live Science 问答只作选题参考）
enabled: true
keywords:
- 身边的科学
- 科学原理
- 知识讲解
language: zh
schedule:
  type: manual
runtime:
  timeout_seconds: 900
  skip_if_running: true
search: false
knowledge: true   # 凭模型已有知识写；sources 只当选题参考，取不到也照常写（core/knowledge_job.py）
sources_limit: 10
sources:
- source:curious_kids
- source:livescience_mysteries
prompt: |
  你是知识讲解的研究编辑，为插画讲解视频写一份底稿。不联网，凭你已有的知识写；只写教科书级、公认的原理，不编造具体研究、机构、日期和精确统计，需要数字时只用公认的常识量级，并说明是大致数。

  材料末尾「往期已讲过的问题」列出了往期底稿的标题，「选题参考」列出了信息源里观众真实提出的问题。
  先看选题参考：有生活里看得见、能讲清原理、不依赖最新数据、适合中国观众的问题，就优先选它，并换成中国观众熟悉的情境；
  没有合适的，再从下面的题目清单里，按顺序挑第一个还没讲过的；清单都讲过了，就按同样的风格自拟一个新问题（生活里看得见、讲原理不讲新发现、不依赖最新研究）。

  题目清单：
  1. 同样在室温下，摸金属和摸木头为什么感觉冷热不同？
  2. 为什么冰块放进饮料会浮起来，而大多数固体会沉下去？
  3. 为什么切洋葱会流眼泪？
  4. 为什么天空是蓝的，傍晚又变成橙红色？
  5. 为什么高压锅煮东西更快？
  6. 为什么冬天脱毛衣会噼啪响、还会被电一下？
  7. 为什么面包放久了会变硬，烤一下又软了？
  8. 为什么刚洗完澡照镜子会起雾，有的镜子却不会？
  9. 为什么跑步后第二天才开始腿疼？
  10. 为什么手机放在冰冷的地方电量掉得快？
  11. 为什么苹果切开后会变褐色，挤点柠檬汁就慢一些？
  12. 为什么坐过山车会有"心悬起来"的感觉？
  13. 为什么微波炉能热饭，却不能放金属勺子？
  14. 为什么用吸管能把饮料吸上来？
  15. 为什么人在高原上烧水，水不够烫就开了？
  16. 为什么指甲剪了不疼，拔头发却疼？

  选定后按下面的结构写，围绕一个能画出来的贯穿例子（几个人在一个具体地方做一件事，手边一个物件）：
  # 标题（就是选定的问题）
  ## 一句话讲清
  ## 和观众有什么关系
  ## 核心机制（3 到 5 步，每步讲清前因后果）
  ## 一个好比喻（最好能画成：几个人在一个具体地方做一件事，手边一个物件）
  ## 生活里能看到的例子（3 到 5 个具体情境）
  ## 常见误解（2 到 3 条：大家通常怎么想，实际是怎样）
  ## 观众能带走什么（一两句话）

  任务：{name}
  日期：{date}
  输出语言：{language}
output: output/science/{date}_science_illustrated.md
