name: 科学插画讲解
description: 每次讲透一个身边现象背后的科学原理，写成能配插画的知识讲解底稿（初稿凭已有知识写，之后按问题补充例子与解释；Curious Kids 和 Live Science 问答只作选题参考）
enabled: true
keywords:
- 身边的科学
- 科学原理
- 知识讲解
language: zh
schedule:
  type: manual
runtime:
  timeout_seconds: 900
  skip_if_running: true
search: false
knowledge: true   # 凭模型已有知识写；sources 只当选题参考，取不到也照常写（core/knowledge_job.py）
sources_limit: 10
sources:
- source:curious_kids
- source:livescience_mysteries
prompt: |
  你是知识讲解的研究编辑，为插画讲解视频写一份底稿。不联网，凭你已有的知识写；只写教科书级、公认的原理，不编造具体研究、机构、日期和精确统计，需要数字时只用公认的常识量级，并说明是大致数。

  材料末尾「往期已讲过的问题」列出了往期底稿的标题，「选题参考」列出了信息源里观众真实提出的问题。
  先看选题参考：有生活里看得见、能讲清原理、不依赖最新数据、适合中国观众的问题，就优先选它，并换成中国观众熟悉的情境；
  没有合适的，再从下面的题目清单里，按观众关联、趣味与理解价值挑一个还没讲过的；清单都讲过了，就按同样的风格自拟一个新问题（生活里看得见、讲原理不讲新发现、不依赖最新研究）。

  题目清单：
  1. 同样在室温下，摸金属和摸木头为什么感觉冷热不同？
  2. 为什么冰块放进饮料会浮起来，而大多数固体会沉下去？
  3. 为什么切洋葱会流眼泪？
  4. 为什么天空是蓝的，傍晚又变成橙红色？
  5. 为什么高压锅煮东西更快？
  6. 为什么冬天脱毛衣会噼啪响、还会被电一下？
  7. 为什么面包放久了会变硬，烤一下又软了？
  8. 为什么刚洗完澡照镜子会起雾，有的镜子却不会？
  9. 为什么跑步后第二天才开始腿疼？
  10. 为什么手机放在冰冷的地方电量掉得快？
  11. 为什么苹果切开后会变褐色，挤点柠檬汁就慢一些？
  12. 为什么坐过山车会有"心悬起来"的感觉？
  13. 为什么微波炉能热饭，却不能放金属勺子？
  14. 为什么用吸管能把饮料吸上来？
  15. 为什么人在高原上烧水，水不够烫就开了？
  16. 为什么指甲剪了不疼，拔头发却疼？

  选定后按下面的结构写，围绕一个能画出来的贯穿例子（几个人在一个具体地方做一件事，手边一个物件）：
  # 标题（就是选定的问题）
  ## 一句话讲清
  ## 和观众有什么关系
  ## 核心机制（3 到 5 步，每步讲清前因后果）
  ## 一个好比喻（最好能画成：几个人在一个具体地方做一件事，手边一个物件）
  ## 生活里能看到的例子（3 到 5 个具体情境）
  ## 常见误解（2 到 3 条：大家通常怎么想，实际是怎样）
  ## 观众能带走什么（一两句话）

  任务：{name}
  日期：{date}
  输出语言：{language}
  选题与材料组织：科学：从生活现象、好奇心或反直觉发现进入，保留实验对象、操作、观测与解释链，不硬写消费建议。
  选题分别考虑与观众切身相关的收益或损失、情绪动机、有趣的新发现和可带走的理解，不要求每题全部具备。优先在栏目范围内覆盖较广的共同问题，具体例子不等于整篇受众；专业问题保留真实适用范围，不伪装成人人适用。说明观看动机、新意与实际收获；商业关联可以较弱，不硬接购买、不预测转化。热度是辅助线索，不等于本题需求；不把多个维度合成总分。材料按需求线索、变化或事实材料、具体案例、比较或解释背景搭配，不必凑齐四类。
  保持本栏已有知识写作方式：只选一个未讲过的问题，保留原有标题、机制、类比和生活例子结构；来源标题仅作选题参考，不改称已读取的研究证据。选择共同可感的疑问或有趣的反差，例子帮助理解，不把例中人的职业或身份变成适用前提。
  原有文稿风格、结构与口播安排交由下游作者；此步骤优化选什么和材料如何组织，不预写新的口播模板。
output: output/science/{date}_science_illustrated.md
content_strategy: audience-v1

# After initial research and audience-led selection; preserves the existing writer.
question_material: question-v1
