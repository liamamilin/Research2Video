name: 数码选购周观察
description: 每周挑一类产品，把参数、评测和可维修性讲清楚，说明适合谁（读 Notebookcheck、GSMArena、Tom's Hardware、iFixit、IIHS、Ars Technica 抓取的内容），不联网搜索
enabled: true
keywords:
- 数码新品
- 产品评测
- 购买指南
language: zh
schedule:
  type: manual
runtime:
  timeout_seconds: 1800
  skip_if_running: true
search: false
sources_limit: 10
sources:
- tag:consumer
prompt: '为「一个选择怎么做」整理研究底稿。围绕一个持续的实际使用需求，让有意义的方案面对同一任务和使用周期。完整保留各方案的操作、结果、时间、成本与维护过程，说明各项差别怎样改变用户的下一步；型号、地区、价格与兼容条件在影响该项取舍时进入，再接回同一使用过程。保留开场需求完成选择后的新使用状态和后续体验，让结尾能向前推进。深度用于体验差别和长期取舍，取材备忘作为作者背景，结构与节奏留给作者组织。

  任务：{name}

  领域：{domain}

  关键词：{keywords}

  日期：{date}

  输出语言：{language}

  数据格式：Markdown；以「## 本期主问题：具体需求与选择」组织同一个解释主题。随后「### 2.1 名称」等编号单元是相关方案、操作阶段或取舍维度，属于同一主问题，并非独立新闻；「####」保留完整过程与例子。素材链接放在对应段落，末尾「###
  来源清单」记录链接。

  '
output: output/consumer/{date}_consumer_weekly.md
