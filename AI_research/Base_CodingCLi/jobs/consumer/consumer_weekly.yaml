name: 数码选购周观察
description: 每周挑一类产品，把参数、评测和可维修性讲清楚，说明适合谁（读 Notebookcheck、GSMArena、Tom's Hardware、iFixit、IIHS、Ars Technica 
  抓取的内容），初稿沿用固定材料，选题后按问题补材
domain: 消费科技
enabled: true
keywords:
- 数码新品
- 产品评测
- 购买指南
language: zh
schedule:
  type: manual
runtime:
  timeout_seconds: 1800
  skip_if_running: true
search: false
sources_limit: 10
sources:
- tag:consumer
prompt: |
  为「一个选择怎么做」整理研究底稿。围绕一个持续的实际使用需求，让有意义的方案面对同一任务和使用周期。完整保留各方案的操作、结果、时间、成本与维护过程，说明各项差别怎样改变用户的下一步；型号、地区、价格与兼容条件有助于理解取舍时也可展开。已有的后续使用状态和体验可以作为选择依据。深度用于体验差别和长期取舍，取材备忘作为作者背景，结构与节奏留给作者组织。
  任务：{name}
  领域：{domain}
  关键词：{keywords}
  日期：{date}
  输出语言：{language}
  数据格式：Markdown；以「## 本期主问题：具体需求与选择」组织同一个解释主题。随后「### 2.1 名称」等编号单元是相关方案、操作阶段或取舍维度，属于同一主问题，并非独立新闻；「####」保留完整过程与例子。素材链接放在对应段落，末尾「### 来源清单」记录链接。
  选题与材料组织：消费科技：购买、使用、维修与升级中的共同疑问，保留真实使用差异和适用条件，不默认买贵或买新。
  选题分别考虑与观众切身相关的收益或损失、情绪动机、有趣的新发现和可带走的理解，不要求每题全部具备。优先在栏目范围内覆盖较广的共同问题，具体例子不等于整篇受众；专业问题保留真实适用范围，不伪装成人人适用。商业关联可以较弱，不硬接购买、不预测转化。热度是辅助线索，不等于本题需求；不把多个维度合成总分。材料按需求线索、变化或事实材料、具体案例、比较或解释背景搭配，不必凑齐四类。
  本期只选一个主问题，先判断为什么有人值得花时间理解它，再围绕它保留完整解释、原因、过程、案例及条件。不要为了覆盖面拆成新闻列表，也不把商业关联硬写成购买建议。
  原有文稿风格、结构与口播安排交由下游作者；此步骤优化选什么和材料如何组织，不预写新的口播模板。
output: output/consumer/{date}_consumer_weekly.md
audience_channel: consumer_weekly
content_strategy: audience-v1
question_material: question-v1
