name: 新品与评测日报
description: 每天值得关注的数码新品和评测（读 Notebookcheck、GSMArena、Tom's Hardware、iFixit、Engadget 抓取的内容），不联网搜索
enabled: true
keywords:
- 数码新品
- 产品评测
- 购买指南
language: zh
schedule:
  type: manual
runtime:
  timeout_seconds: 1800
  skip_if_running: true
search: false
sources_limit: 8
sources:
- source:notebookcheck_reviews
- source:gsmarena
- source:toms_hardware
- source:ifixit_news
- source:engadget
prompt: '为「一处体验变化」整理研究底稿。选择材料中有实际操作和结果的一处产品或服务变化，从同一位使用者想完成的事进入，尽早保留新体验，再展开准备、使用、结果与善后的完整过程。把对象特征、具体动作、投入、耗时和维护放在相应步骤，参数解释当前体验和取舍；相关条件影响哪一步就在那一步讲清，接回主任务。保留完成这件事后的新状态和下一次使用，让作者有材料把结尾继续向前推进。底稿完整保留例子、过程与解释深度，取材备忘作为作者背景。

  任务：{name}

  领域：{domain}

  关键词：{keywords}

  日期：{date}

  输出语言：{language}

  数据格式：Markdown；候选或解释单元以「### 2.1 名称」标识，内部用「####」保留完整过程与例子。素材链接放在对应段落，末尾「### 来源清单」记录链接。

  '
output: output/consumer/{date}_consumer_daily.md
