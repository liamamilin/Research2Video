name: 新品与评测日报
description: 每天值得关注的数码新品和评测（读 Notebookcheck、GSMArena、Tom's Hardware、iFixit、Engadget 抓取的内容），初稿沿用固定材料，选题后按问题补材
enabled: true
keywords:
- 数码新品
- 产品评测
- 购买指南
language: zh
schedule:
  type: manual
runtime:
  timeout_seconds: 1800
  skip_if_running: true
search: false
sources_limit: 8
sources:
- source:notebookcheck_reviews
- source:gsmarena
- source:toms_hardware
- source:ifixit_news
- source:engadget
- source:apple_newsroom
- source:samsung_newsroom
- source:google_products
- source:cpsc_recalls
- source:the_verge
- source:ithome
- source:nine_to_five_mac
- source:android_authority
prompt: |
  为「一处体验变化」整理研究底稿。选择材料中有实际操作和结果的一处产品或服务变化，从同一位使用者想完成的事进入，尽早保留新体验，再展开准备、使用、结果与善后的完整过程。把对象特征、具体动作、投入、耗时和维护放在相应步骤，参数解释当前体验和取舍；相关条件影响哪一步就在那一步讲清，接回主任务。保留完成这件事后的新状态和下一次使用，让作者有材料把结尾继续向前推进。底稿完整保留例子、过程与解释深度，取材备忘作为作者背景。
  任务：{name}
  领域：{domain}
  关键词：{keywords}
  日期：{date}
  输出语言：{language}
  数据格式：Markdown；候选或解释单元以「### 2.1 名称」标识，内部用「####」保留完整过程与例子。素材链接放在对应段落，末尾「### 来源清单」记录链接。
  选题与材料组织：消费科技：购买、使用、维修与升级中的共同疑问，保留真实使用差异和适用条件，不默认买贵或买新。
  选题分别考虑与观众切身相关的收益或损失、情绪动机、有趣的新发现和可带走的理解，不要求每题全部具备。优先在栏目范围内覆盖较广的共同问题，具体例子不等于整篇受众；专业问题保留真实适用范围，不伪装成人人适用。说明观看动机、新意与实际收获；商业关联可以较弱，不硬接购买、不预测转化。热度是辅助线索，不等于本题需求；不把多个维度合成总分。材料按需求线索、变化或事实材料、具体案例、比较或解释背景搭配，不必凑齐四类。
  候选按本轮值得制作的顺序排列，先说明共同问题，再保存能展开讲述的具体材料。保留原有字段和本栏目需要的操作、测试、实例或比较条件；不为扩大受众泛化专业内容。
  原有文稿风格、结构与口播安排交由下游作者；此步骤优化选什么和材料如何组织，不预写新的口播模板。
output: output/consumer/{date}_consumer_daily.md
content_strategy: audience-v1

# After initial research and audience-led selection; preserves the existing writer.
question_material: question-v1
