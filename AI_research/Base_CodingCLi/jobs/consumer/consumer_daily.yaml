name: 新品与评测日报
description: 每天值得关注的数码新品和评测（读 Notebookcheck、GSMArena、Tom's Hardware、iFixit、Engadget 抓取的内容），初稿沿用固定材料，选题后按问题补材
domain: 消费科技
enabled: true
keywords:
- 数码新品
- 产品评测
- 购买指南
language: zh
schedule:
  type: manual
runtime:
  timeout_seconds: 1800
  skip_if_running: true
search: false
sources_limit: 8
sources:
- source:notebookcheck_reviews
- source:gsmarena
- source:toms_hardware
- source:ifixit_news
- source:engadget
- source:apple_newsroom
- source:samsung_newsroom
- source:google_products
- source:cpsc_recalls
- source:the_verge
- source:ithome
- source:nine_to_five_mac
- source:android_authority
prompt: |
  为「一处体验变化」整理研究底稿。选择材料中有实际操作和结果的一处产品或服务变化，建议整理使用者的实际需求、体验变化、操作过程和后续使用情况。对象特征、动作、投入、耗时、维护与适用条件可以帮助作者解释体验和取舍。材料中已有的后续使用情况也值得保留。底稿完整保留例子、过程与解释深度，取材备忘作为作者背景。
  任务：{name}
  领域：{domain}
  关键词：{keywords}
  日期：{date}
  输出语言：{language}
  数据格式：Markdown；候选或解释单元以「### 2.1 名称」标识，内部用「####」保留完整过程与例子。素材链接放在对应段落，末尾「### 来源清单」记录链接。
output: output/consumer/{date}_consumer_daily.md
audience_channel: consumer_daily
content_strategy: audience-v1
question_material: question-v1
