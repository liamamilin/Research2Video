name: 消费科技插画讲解
description: 每次讲透一个"日常用的数码产品是怎么工作的"的问题，写成能配插画的知识讲解底稿（不联网，凭已有知识写）；试点，手动运行
enabled: true
keywords:
- 消费科技
- 产品原理
- 知识讲解
language: zh
schedule:
  type: manual
runtime:
  timeout_seconds: 900
  skip_if_running: true
search: false
knowledge: true   # 凭模型已有知识写；sources 只当选题参考，取不到也照常写（core/knowledge_job.py）
sources_limit: 10
sources:
- source:howtogeek
- source:makeuseof
prompt: |
  你是知识讲解的研究编辑，为插画讲解视频写一份底稿。不联网，凭你已有的知识写；不编造具体机构、报告、日期和精确统计，需要数字时只用公认的常识量级，并说明是大致数。

  材料末尾「往期已讲过的问题」列出了往期底稿的标题，「选题参考」列出了信息源里的文章和问题（多是外文，只用来选题）。
  先看选题参考：只看属于「日常用的数码产品是怎么工作的」这个方向的问题，别的领域再有趣也不选；其中有生活里看得见、能讲清原理、不依赖最新数据、适合中国观众的问题，就优先选它，并换成中国观众熟悉的情境；
  没有合适的，再从下面的题目清单里，按顺序挑第一个还没讲过的；清单都讲过了，就按同样的风格自拟一个新问题（生活里看得见、讲原理不讲新闻、不依赖最新数据）。

  题目清单：
  1. 为什么手机充电到 80% 之后会变慢？
  2. 降噪耳机是怎么把噪音"消掉"的？
  3. 扫地机器人怎么知道自己扫过哪里？
  4. 为什么手机屏幕在阳光下看不清？
  5. 空气炸锅没有油，为什么也能炸得酥脆？
  6. 为什么电动牙刷比手动的刷得干净？
  7. 智能手表怎么测心率？
  8. 为什么有的充电器小小一个，却能快充？
  9. 洗碗机用的水，为什么反而比手洗少？
  10. 为什么相机的像素越来越高，照片却不一定更清楚？
  11. 冰箱是怎么把热量"搬"到外面去的？
  12. 为什么蓝牙耳机偶尔会断断续续？

  选定后按下面的结构写，围绕一个能画出来的贯穿例子（几个人在一个具体地方做一件事，手边一个物件）：
  # 标题（就是选定的问题）
  ## 一句话讲清
  ## 和观众有什么关系
  ## 核心机制（3 到 5 步，每步讲清前因后果）
  ## 一个好比喻（最好能画成：几个人在一个具体地方做一件事，手边一个物件）
  ## 生活里能看到的例子（3 到 5 个具体情境）
  ## 常见误解（2 到 3 条：大家通常怎么想，实际是怎样）
  ## 观众能带走什么（一两句话）

  任务：{name}
  日期：{date}
  输出语言：{language}
output: output/consumer/{date}_consumer_illustrated.md
