name: "AI 开源雷达"
description: "本期值得开发者关注的 AI 开源项目、热门模型和论文（读 GitHub、Hugging Face、TLDR 抓取的内容，初稿沿用固定材料，选题后按问题补材）"
enabled: true
keywords:
  - 开源项目
  - 开源模型
  - 论文
language: "zh"
schedule:
  type: "manual"
runtime:
  timeout_seconds: 7200  # 周更：7 天材料全读原文，超出模型上限时分批研究再合并
  skip_if_running: true
search: false
sources_limit: 10
sources:
  - "gh_new:llm"
  - "gh_new:agent"
  - "hf_models:trending"
  - "hf_papers:daily"
  - "tldr:ai"
  - "tag:ai_radar"
  - "tag:radar_opensource"
prompt: |
  根据素材，产出目标观众愿意看、听得懂、想继续看的视频。
  当前步骤：研究事情本身，形成供视频作者展开讲述的研究底稿。
  栏目：AI 开源发现，面向想把工具用于实际工作的开发者和 AI 高频使用者。
  这次研究要帮助观众理解：哪些项目解决了具体工作问题，它们在任务中承担哪一环，最有辨识度的特点是什么。
  从现有 GitHub、Hugging Face 与 TLDR 材料中选择有清楚用途的候选，把已有信息按实际问题组织：输入什么、处理什么、得到什么、与其他工具怎样衔接。保留能解释用途的具体细节和项目页面链接，热度用于交代背景。
  优先展开最值得认识的项目，让后续作者可以从中选择一个，通过具体任务讲清其工作位置与特点。
  开头保留简短导读，重点项目的正文沿一个具体任务充分展开：用户给什么输入，项目在哪一步做什么处理，产出怎样的文件、代码、界面或结果，下一步如何接入工作。把已有示例中的操作与输出写清，解释体现项目特点的机制，让参数与原理落在它实际影响的步骤。
  README、模型卡、功能说明或原始报道中的例子与过程值得保留为创作资料；相关项目说明怎样衔接主任务。篇幅随解释需要分配，不将所有项目压成同样长的简介。底稿和原始材料会共同交给作者，视频的主问题、讲述顺序与篇幅由作者选择。
  将项目、论文或公告的原始链接贴在相应的例子与解释旁，末尾仍保留来源清单，便于后续作者取用对应正文。
  任务：{name}
  领域：{domain}
  关键词：{keywords}
  日期：{date}
  输出语言：{language}

  数据格式：Markdown；条目以「### 2.1 名称」标识，末尾「### 来源清单」记录素材链接。
  选题与材料组织：开源工具：先选观众有什么问题值得解决，再说明项目如何做到；保留部署条件、操作与结果，专业工具不伪装成零门槛大众工具。
  选题分别考虑与观众切身相关的收益或损失、情绪动机、有趣的新发现和可带走的理解，不要求每题全部具备。优先在栏目范围内覆盖较广的共同问题，具体例子不等于整篇受众；专业问题保留真实适用范围，不伪装成人人适用。说明观看动机、新意与实际收获；商业关联可以较弱，不硬接购买、不预测转化。热度是辅助线索，不等于本题需求；不把多个维度合成总分。材料按需求线索、变化或事实材料、具体案例、比较或解释背景搭配，不必凑齐四类。
  候选按本轮值得制作的顺序排列，先说明共同问题，再保存能展开讲述的具体材料。保留原有字段和本栏目需要的操作、测试、实例或比较条件；不为扩大受众泛化专业内容。
  原有文稿风格、结构与口播安排交由下游作者；此步骤优化选什么和材料如何组织，不预写新的口播模板。
output: "output/radar/{date}_ai_opensource_radar.md"
content_strategy: audience-v1

# After initial research and audience-led selection; preserves the existing writer.
question_material: question-v1
