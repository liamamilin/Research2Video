name: "AI 开源雷达（每日）"
description: "最近几天值得开发者关注的 AI 开源项目、热门模型和论文（读 GitHub、Hugging Face、TLDR 抓取的内容，不联网搜索）"
enabled: true
keywords:
  - 开源项目
  - 开源模型
  - 论文
language: "zh"
schedule:
  type: "manual"
runtime:
  timeout_seconds: 1800
  skip_if_running: true
search: false
sources_limit: 10
sources:
  - "gh_new:llm"
  - "gh_new:agent"
  - "hf_models:trending"
  - "hf_papers:daily"
  - "tldr:ai"
  - "tag:ai_radar"
prompt: |
  根据素材，产出目标观众愿意看、听得懂、想继续看的视频。
  当前步骤：研究事情本身，形成供视频作者展开讲述的研究底稿。
  栏目：AI 开源发现，面向想把工具用于实际工作的开发者和 AI 高频使用者。
  这次研究要帮助观众理解：哪些项目解决了具体工作问题，它们在任务中承担哪一环，最有辨识度的特点是什么。
  从现有 GitHub、Hugging Face 与 TLDR 材料中选择有清楚用途的候选，把已有信息按实际问题组织：输入什么、处理什么、得到什么、与其他工具怎样衔接。保留能解释用途的具体细节和项目页面链接，热度用于交代背景。
  优先展开最值得认识的项目，让后续作者可以从中选择一个，通过具体任务讲清其工作位置与特点。
  开头保留简短导读，重点项目的正文沿一个具体任务充分展开：用户给什么输入，项目在哪一步做什么处理，产出怎样的文件、代码、界面或结果，下一步如何接入工作。把已有示例中的操作与输出写清，解释体现项目特点的机制，让参数与原理落在它实际影响的步骤。
  README、模型卡、功能说明或原始报道中的例子与过程值得保留为创作资料；相关项目说明怎样衔接主任务。篇幅随解释需要分配，不将所有项目压成同样长的简介。底稿和原始材料会共同交给作者，视频的主问题、讲述顺序与篇幅由作者选择。
  将项目、论文或公告的原始链接贴在相应的例子与解释旁，末尾仍保留来源清单，便于后续作者取用对应正文。
  任务：{name}
  领域：{domain}
  关键词：{keywords}
  日期：{date}
  输出语言：{language}

  数据格式：Markdown；条目以「### 2.1 名称」标识，末尾「### 来源清单」记录素材链接。
output: "output/radar/{date}_ai_opensource_radar.md"
