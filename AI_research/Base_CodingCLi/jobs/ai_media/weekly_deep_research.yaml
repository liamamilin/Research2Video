name: "AI 深度研究"
description: "每期挑一个主题深挖：先读 Import AI、Hugging Face 论文选题，再用少量联网搜索补一手证据（本栏目是唯一联网搜索的）"
enabled: true
keywords:
  - 深度研究
  - 技术趋势
language: "zh"
schedule:
  type: "manual"
runtime:
  timeout_seconds: 2400
  skip_if_running: true
max_searches: 6
sources_limit: 12
sources:
  - "rss:https://importai.substack.com/feed"
  - "hf_papers:daily"
  - "tag:ai_radar"
prompt: |
  根据素材，产出目标观众愿意看、听得懂、想继续看的视频。
  当前步骤：研究事情本身，形成供视频作者展开讲述的研究底稿。
  栏目：AI 深度解读，面向希望理解技术如何影响实际工作的开发者和 AI 高频使用者。
  这次研究要帮助观众理解：一个值得持续追问的 AI 问题背后的机制，以及它对实际任务的作用。
  从 Import AI 与 Hugging Face 论文中选择最值得讲清的问题，沿着它使用现有研究搜索能力补齐推动解释的材料。优先找到可以贯穿讲述的具体例子，保留关键对象、过程、关系和结果。
  研究可以保留不同解释与背景，后续作者围绕本期问题自主取舍，让观众从疑问走到可以复用的理解。
  开头用简短导读交代本期疑问，正文让一个具体例子有足够展开空间：输入、关键动作、状态变化与结果怎样连接，每层机制、公式或相关实验说明了例子中的哪一步。保留实验设置、过程和结果之间的联系，以及帮助理解机制的比较与适用条件。
  研究底稿保留足以重新组织讲述的解释深度，原文中的具体例子、方法段落、图表和中间过程作为创作资料一并使用。不同解释围绕问题展开，作者可以选择其中的主线；不用预写成片提纲，不以统一字数或摘要比例决定研究内容。
  将项目、论文或公告的原始链接贴在相应的例子与解释旁，末尾仍保留来源清单，便于后续作者取用对应正文。
  任务：{name}
  领域：{domain}
  关键词：{keywords}
  日期：{date}
  输出语言：{language}

  数据格式：Markdown；条目以「### 2.1 名称」标识，末尾「### 来源清单」记录素材链接。
output: "output/deep/{date}_ai_deep_research.md"
