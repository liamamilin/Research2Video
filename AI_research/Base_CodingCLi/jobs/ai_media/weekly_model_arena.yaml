name: "AI 模型竞技场"
description: "本期模型排行与热门模型：智能指数、价格、速度（读 Artificial Analysis、Hugging Face、The Rundown 抓取的内容，初稿沿用固定材料，选题后按问题补材）"
enabled: true
keywords:
  - 模型排行
  - 模型价格
  - 开源模型
language: "zh"
schedule:
  type: "manual"
runtime:
  timeout_seconds: 1800
  skip_if_running: true
search: false
sources_limit: 20
sources:
  - "aa:models"
  - "hf_models:trending"
  - "rss:https://www.therundown.ai/feed"
  - "tag:ai_radar"
prompt: |
  根据素材，产出目标观众愿意看、听得懂、想继续看的视频。
  当前步骤：研究事情本身，形成供视频作者展开讲述的研究底稿。
  栏目：AI 模型观察，面向需要为实际工作选择模型的开发者和 AI 高频使用者。
  这次研究要帮助观众理解：从现有榜单与模型材料中，哪些差异会影响批量处理、交互响应或长文档等具体任务。
  围绕最值得解释的使用问题组织已有对象与数据，保留相关的价格、速度、能力和上下文信息及其维度说明，让后续作者能讲清不同选择的取舍。当前快照可以支撑静态比较；有已提供的前后材料时再组织变化。
  研究报告保留候选场景与有用的比较细节，后续视频可以选择其中一个问题深入讲述。
  用简短导读概览本期问题，正文围绕有解释价值的任务保留比较过程：任务的输入与预期结果是什么，哪些模型或档位构成关键选择，等待、花费、能力和上下文分别影响任务中的哪一步。保留材料给出的条件、维度说明和具体例子，让作者能讲清差异如何形成取舍。
  表格承载完整读数，正文展开值得理解的关系与过程；已有机制说明和任务例子也保留在底稿中。研究底稿与原始材料会共同交给作者，作者选择一个问题深入讲述，不需要照榜单顺序逐项播报，也不按报告长度固定缩写。
  将项目、论文或公告的原始链接贴在相应的例子与解释旁，末尾仍保留来源清单，便于后续作者取用对应正文。
  任务：{name}
  领域：{domain}
  关键词：{keywords}
  日期：{date}
  输出语言：{language}

  数据格式：Markdown；条目以「### 2.1 名称」标识，末尾「### 来源清单」记录素材链接。
  选题与材料组织：模型比较：围绕使用需求理解模型差异，保留比较条件、实际表现与成本，榜单名次和参数不单独构成观看价值。
  选题分别考虑与观众切身相关的收益或损失、情绪动机、有趣的新发现和可带走的理解，不要求每题全部具备。优先在栏目范围内覆盖较广的共同问题，具体例子不等于整篇受众；专业问题保留真实适用范围，不伪装成人人适用。说明观看动机、新意与实际收获；商业关联可以较弱，不硬接购买、不预测转化。热度是辅助线索，不等于本题需求；不把多个维度合成总分。材料按需求线索、变化或事实材料、具体案例、比较或解释背景搭配，不必凑齐四类。
  本期只选一个主问题，先判断为什么有人值得花时间理解它，再围绕它保留完整解释、原因、过程、案例及条件。不要为了覆盖面拆成新闻列表，也不把商业关联硬写成购买建议。
  原有文稿风格、结构与口播安排交由下游作者；此步骤优化选什么和材料如何组织，不预写新的口播模板。
output: "output/arena/{date}_ai_model_arena.md"
content_strategy: audience-v1

# After initial research and audience-led selection; preserves the existing writer.
question_material: question-v1
