name: "AI 模型竞技场（每周）"
description: "本周模型排行与热门模型：智能指数、价格、速度（读 Artificial Analysis、Hugging Face、The Rundown 抓取的内容，不联网搜索）"
enabled: true
keywords:
  - 模型排行
  - 模型价格
  - 开源模型
language: "zh"
schedule:
  type: "manual"
runtime:
  timeout_seconds: 1800
  skip_if_running: true
search: false
sources_limit: 20
sources:
  - "aa:models"
  - "hf_models:trending"
  - "rss:https://www.therundown.ai/feed"
prompt: |
  根据素材，产出目标观众愿意看、听得懂、想继续看的视频。
  当前步骤：研究事情本身，形成供视频作者展开讲述的研究底稿。
  栏目：AI 模型观察，面向需要为实际工作选择模型的开发者和 AI 高频使用者。
  这次研究要帮助观众理解：从现有榜单与模型材料中，哪些差异会影响批量处理、交互响应或长文档等具体任务。
  围绕最值得解释的使用问题组织已有对象与数据，保留相关的价格、速度、能力和上下文信息及其维度说明，让后续作者能讲清不同选择的取舍。当前快照可以支撑静态比较；有已提供的前后材料时再组织变化。
  研究报告保留候选场景与有用的比较细节，后续视频可以选择其中一个问题深入讲述。
  用简短导读概览本期问题，正文围绕有解释价值的任务保留比较过程：任务的输入与预期结果是什么，哪些模型或档位构成关键选择，等待、花费、能力和上下文分别影响任务中的哪一步。保留材料给出的条件、维度说明和具体例子，让作者能讲清差异如何形成取舍。
  表格承载完整读数，正文展开值得理解的关系与过程；已有机制说明和任务例子也保留在底稿中。研究底稿与原始材料会共同交给作者，作者选择一个问题深入讲述，不需要照榜单顺序逐项播报，也不按报告长度固定缩写。
  将项目、论文或公告的原始链接贴在相应的例子与解释旁，末尾仍保留来源清单，便于后续作者取用对应正文。
  任务：{name}
  领域：{domain}
  关键词：{keywords}
  日期：{date}
  输出语言：{language}

  数据格式：Markdown；条目以「### 2.1 名称」标识，末尾「### 来源清单」记录素材链接。
output: "output/arena/{date}_ai_model_arena.md"
