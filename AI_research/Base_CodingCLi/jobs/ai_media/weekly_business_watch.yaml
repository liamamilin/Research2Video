name: "AI 商业观察"
description: "本期 AI 行业的商业动向：产品、定价、公司动作、政策（读 Import AI、The Rundown、TLDR 抓取的内容，初稿沿用固定材料，选题后按问题补材）"
enabled: true
keywords:
  - AI 商业
  - 定价
  - 公司动态
language: "zh"
schedule:
  type: "manual"
runtime:
  timeout_seconds: 1800
  skip_if_running: true
search: false
sources_limit: 12
sources:
  - "rss:https://www.therundown.ai/feed"
  - "rss:https://importai.substack.com/feed"
  - "tldr:ai"
  - "tag:ai_radar"
prompt: |
  根据素材，产出目标观众愿意看、听得懂、想继续看的视频。
  当前步骤：研究事情本身，形成供视频作者展开讲述的研究底稿。
  栏目：AI 产业观察，面向关心产品与使用生态的开发者、产品从业者和 AI 高频使用者。
  这次研究要帮助观众理解：一件 AI 商业变化会怎样影响具体产品、用户和实际用法。
  从现有报道中优先选择收费、使用方式、分发渠道或竞争关系有明显变化的事件，收集产品、参与者、用户与交易方式的具体联系，以及可展示的页面、套餐或数字。
  沿最有解释价值的事件展开材料，相关公司动态为这一问题服务，让后续作者能把商业变化讲成观众能够理解的产品与使用关系。
  用简短导读提供概览，重点事件保留一次具体采用、交付或付费过程：谁向谁提供什么产品与能力，用户怎样获得和使用，参与者各自承担哪一步，价值或成本在哪一环改变。沿材料中的实际案例展开对象、动作、结果以及关系背后的机制。
  将套餐、渠道、授权、接口和参与者关系中的有用细节留在底稿，页面或数据可以对应到具体交付环节。底稿与原始材料会共同交给作者，研究先把事情讲明白，视频角度、节奏和行业解释的展开方式留给作者决定。
  将项目、论文或公告的原始链接贴在相应的例子与解释旁，末尾仍保留来源清单，便于后续作者取用对应正文。
  任务：{name}
  领域：{domain}
  关键词：{keywords}
  日期：{date}
  输出语言：{language}

  数据格式：Markdown；条目以「### 2.1 名称」标识，末尾「### 来源清单」记录素材链接。
  选题与材料组织：AI商业：围绕产品、工作与消费选择解释商业变化，保留商业机制和案例，不把融资、估值或品牌热度直接当用户需求。
  选题分别考虑与观众切身相关的收益或损失、情绪动机、有趣的新发现和可带走的理解，不要求每题全部具备。优先在栏目范围内覆盖较广的共同问题，具体例子不等于整篇受众；专业问题保留真实适用范围，不伪装成人人适用。说明观看动机、新意与实际收获；商业关联可以较弱，不硬接购买、不预测转化。热度是辅助线索，不等于本题需求；不把多个维度合成总分。材料按需求线索、变化或事实材料、具体案例、比较或解释背景搭配，不必凑齐四类。
  本期只选一个主问题，先判断为什么有人值得花时间理解它，再围绕它保留完整解释、原因、过程、案例及条件。不要为了覆盖面拆成新闻列表，也不把商业关联硬写成购买建议。
  原有文稿风格、结构与口播安排交由下游作者；此步骤优化选什么和材料如何组织，不预写新的口播模板。
output: "output/business/{date}_ai_business_watch.md"
content_strategy: audience-v1

# After initial research and audience-led selection; preserves the existing writer.
question_material: question-v1
