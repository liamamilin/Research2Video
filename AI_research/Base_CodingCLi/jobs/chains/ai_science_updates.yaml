name: AI 科研进展
domain: AI 科研进展
enabled: true
language: zh
keywords:
- AI 科学发现
- 科研方法
- 证据边界
search: false
sources:
- source:chain_source_mwlrtqz9
- source:cg_openai_news
sources_limit: 10
runtime:
  timeout_seconds: 3600
  skip_if_running: true
prompt: |
  跟踪 AI 在科学发现与科研方法上的公开进展。为关注 AI 的中文观众讲清：具体研究问题是什么、AI 在哪一步帮了忙、证据支持到哪里；说明适用范围和尚待验证的部分。
  从已取得的科学博客与相关材料中选择本期最值得讲清的一条（或少数几条）进展；优先有原文链接、能说明方法与结果边界的材料。不要为了凑题材编造未提供的实验细节。
  日期：{date}。根据取得的材料形成可供视频作者使用的研究底稿。保留具体变化、例子、解释及原始链接。使用条目格式：
  ### 1.1 选题标题
  - **一句话**：内容
  - **发布日期**：日期
  - **证据来源**：链接
  正文充分展开，末尾列来源清单。没有可用题材时写“本次暂无新题材”。
  选题与材料组织：AI科研进展：讲清研究问题、AI 介入步骤与证据边界；适合关心科学进展的普通观众与开发者，不把实验室细节伪装成日常操作教程。
  选题分别考虑与观众切身相关的收益或损失、情绪动机、有趣的新发现和可带走的理解，不要求每题全部具备。优先在栏目范围内覆盖较广的共同问题，具体例子不等于整篇受众；专业问题保留真实适用范围，不伪装成人人适用。商业关联可以较弱，不硬接购买、不预测转化。热度是辅助线索，不等于本题需求；不把多个维度合成总分。材料按需求线索、变化或事实材料、具体案例、比较或解释背景搭配，不必凑齐四类。
  候选按本轮值得制作的顺序排列，先说明共同问题，再保存能展开讲述的具体材料。保留原有字段和本栏目需要的操作、测试、实例或比较条件；不为扩大受众泛化专业内容。
  原有文稿风格、结构与口播安排交由下游作者；此步骤优化选什么和材料如何组织，不预写新的口播模板。
output: output/chains/ai_science_updates/{date}.md
audience_channel: ai_science
content_strategy: audience-v1
topics:
  alias: ai_science_updates
  format: flash
  prefix: AAA
  refresh: true
question_material: question-v1
