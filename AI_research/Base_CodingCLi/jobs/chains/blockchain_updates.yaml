name: 区块链动态
domain: 区块链动态
enabled: true
language: zh
keywords:
- 公链与 L2 协议升级
- 稳定币与 RWA 落地
- 监管合规与 ETF 机构动态
- 链上安全事故与漏洞复盘
- 密码学与基础设施突破
search: false
sources:
- source:coindesk
- source:the_block
- source:decrypt
- source:blockworks
- source:ethereum_blog
- source:vitalik_blog
sources_limit: 10
runtime:
  timeout_seconds: 3600
  skip_if_running: true
research_mode: opencode_topic_v1
topic_criteria: |
  聚焦近 48 小时内区块链与 Web3 领域真正有实质进展的硬核动态，重点覆盖 4 个方向：
  1. 公链与基础设施演进：以太坊/Solana/L2 等协议升级、扩容方案、零知识证明、钱包与账户抽象等工程突破；
  2. 稳定币、RWA 与传统金融融合：合规稳定币清算、国债/资产代币化、主流机构/银行/支付网络的真实落地与 ETF 进展；
  3. 全球监管与合规政策：美/欧/港/新加坡等主要司法辖区的立法、牌照与监管框架变化；
  4. 链上安全事件复盘：合约漏洞、跨链桥或协议被攻击的技术根因、资金影响与修复措施。

  严格风控与排除红线（绝不入选）：
  - 严格排除纯币价涨跌播报、K 线走势预测、短期价格喊单与“百倍币/暴富”叙事；
  - 严格排除山寨币/Meme 币炒作、空投撸毛教程、交易所拉新返佣或诱导开户/买卖内容；
  - 严格排除未经证实的社区八卦与无一手来源的二手传闻。

  入选必须满足：有一手官方公告、协议提案（EIP/GitHub）、监管文件、链上安全审计报告或权威主流媒体报道；同一事件多方跟进使用相同 cluster_key 合并。
  Stage 1 除了阅读声明源轻量索引，请主动执行 2–3 次中英文 websearch 补齐当天重要的区块链技术、合规与安全动态。
gather_requirements: |
  每道题必须拿到一手公告、官方博客、监管文件、安全机构复盘报告或权威主流媒体原文链接，并围绕以下 4 块补齐硬信息：
  1. 核心变化与时间节点：具体发布了什么、升级了哪项机制或出台了哪条规则；
  2. 关键数据与技术/业务细节：吞吐量/手续费变化、涉及资产规模、受影响合约或漏洞攻击路径、前后对比口径；
  3. 背后逻辑与影响边界：为什么推进这一步，对开发者、机构或普通用户意味着什么，有哪些前提或限制；
  4. 合规客观表述：只陈述已证实事实、技术机制与公开数据，绝不给出任何买卖建议或价格预测。
prompt: |
  面向对科技与金融基础设施感兴趣的中文观众，梳理近 48 小时内最值得关注的区块链技术演进、合规落地、稳定币/RWA 与链上安全动态（严格遵守内容合规，不涉及任何币价预测、喊单、投资建议或交易诱导）。
  日期：{date}。根据取得的材料形成可供视频作者使用的研究底稿。
  优先将最重磅、最适合独立做 1.5–3 分钟单条快评的 1–3 个大事件排在最前面，其余有价值的当日动态按重要性依次排列（用于组成合集节目）。
  保留具体技术机制、数据对照、适用条件与原始链接，使用条目格式：
  ### 1.1 选题标题
  - **一句话**：内容
  - **发布日期**：日期
  - **证据来源**：链接
  正文充分展开，末尾列来源清单。没有可用题材时写“本次暂无新题材”。
output: output/chains/blockchain_updates/{date}.md
audience_channel: blockchain_updates
topics:
  alias: blockchain_updates
  format: flash
  prefix: BC
  refresh: true
