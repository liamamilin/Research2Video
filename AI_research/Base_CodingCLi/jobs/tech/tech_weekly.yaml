name: 科技周观察
description: 每周挑一个科技主题讲清楚：技术是什么、进展到哪一步、离落地还有多远（读 IEEE Spectrum 各专题、MIT、NASA、Nature 等抓取的内容），初稿沿用固定材料，选题后按问题补材
domain: 科技与未来产业
enabled: true
keywords:
- 科技前沿
- 技术突破
- 未来产业
language: zh
schedule:
  type: manual
runtime:
  timeout_seconds: 1800
  skip_if_running: true
search: false
sources_limit: 10
sources:
- tag:tech
prompt: |
  为「一条技术主线」整理研究底稿。回看本周材料，只选一个值得继续追问的技术问题：它进展到哪一步、怎样工作、离日常或产业落地还有多远。

  围绕同一主问题保留机制、场景、采用条件与对照例子；相关新闻为这一问题服务，不要拆成发布会列表。写清对象、过程、限制和可展示细节，给作者完整解释深度。

  任务：{name}
  领域：{domain}
  关键词：{keywords}
  日期：{date}
  输出语言：{language}

  数据格式：Markdown；条目以「### 2.1 名称」标识，末尾「### 来源清单」记录素材链接。
  选题与材料组织：科技：技术变化让哪些能力成为可能、如何影响日常生活与工作，保留机制、具体场景和采用条件，不只追发布会参数。
  选题分别考虑与观众切身相关的收益或损失、情绪动机、有趣的新发现和可带走的理解，不要求每题全部具备。优先在栏目范围内覆盖较广的共同问题，具体例子不等于整篇受众；专业问题保留真实适用范围，不伪装成人人适用。商业关联可以较弱，不硬接购买、不预测转化。热度是辅助线索，不等于本题需求；不把多个维度合成总分。材料按需求线索、变化或事实材料、具体案例、比较或解释背景搭配，不必凑齐四类。
  本期只选一个主问题，先判断为什么有人值得花时间理解它，再围绕它保留完整解释、原因、过程、案例及条件。不要为了覆盖面拆成新闻列表，也不把商业关联硬写成购买建议。
  原有文稿风格、结构与口播安排交由下游作者；此步骤优化选什么和材料如何组织，不预写新的口播模板。
output: output/tech/{date}_tech_weekly.md
audience_channel: tech_weekly
content_strategy: audience-v1
question_material: question-v1
