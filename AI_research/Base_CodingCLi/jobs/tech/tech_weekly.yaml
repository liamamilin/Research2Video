name: 科技周观察
description: 每周挑一个科技主题讲清楚：技术是什么、进展到哪一步、离落地还有多远（读 IEEE Spectrum 各专题、MIT、NASA、Nature 等抓取的内容），不联网搜索
enabled: true
keywords:
- 科技前沿
- 技术突破
- 未来产业
language: zh
schedule:
  type: manual
runtime:
  timeout_seconds: 1800
  skip_if_running: true
search: false
sources_limit: 10
sources:
- tag:tech
prompt: |
  根据素材，产出目标观众愿意看、听得懂、想继续看的视频。
  当前步骤：研究事情本身，把后续讲述用得上的具体资料写明白。
  这次研究要帮助观众理解：回看这一周的材料，找到值得继续追问的变化和联系。关注新技术怎样工作，以及它可能改变的具体场景，保留能把事情讲生动、讲明白的具体材料。
  任务：{name}
  领域：{domain}
  关键词：{keywords}
  日期：{date}
  输出语言：{language}

  数据格式：Markdown；条目以「### 2.1 名称」标识，末尾「### 来源清单」记录素材链接。
output: output/tech/{date}_tech_weekly.md
