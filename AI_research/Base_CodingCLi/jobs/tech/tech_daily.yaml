name: 科技前沿日报
description: 每天值得关注的几项科技进展（读 IEEE Spectrum、MIT Technology Review、NASA、MIT News、Ars Technica 抓取的内容），初稿沿用固定材料，选题后按问题补材
domain: 科技与未来产业
enabled: true
keywords:
- 科技前沿
- 技术突破
- 未来产业
language: zh
schedule:
  type: manual
runtime:
  timeout_seconds: 1800
  skip_if_running: true
search: false
sources_limit: 8
sources:
- source:ieee_spectrum
- source:mit_tech_review
- source:nasa
- source:mit_news
- source:ars_technica
- source:darpa_news
- source:esa_tech
- source:techmeme
- source:robot_report
- source:spacenews
prompt: |
  为「一项技术怎样用起来」整理研究底稿。观众希望理解一项新技术在具体场景里改变了什么能力、门槛或操作方式，而不只是发布会参数。

  从近期材料保留有清楚对象与场景的候选；写清它原来怎么做、现在多了哪一步或哪项能力、谁在什么条件下用得上。保留机制说明、适用限制、可展示的页面或过程，以及帮助理解的对照例子。

  热度与品牌名只作背景；主要篇幅留给「怎样工作」和「落到哪一件具体事」。取材备忘与讲述材料分开保留，标题与视频节奏由作者组织。

  任务：{name}
  领域：{domain}
  关键词：{keywords}
  日期：{date}
  输出语言：{language}

  数据格式：Markdown；条目以「### 2.1 名称」标识，末尾「### 来源清单」记录素材链接。
  选题与材料组织：科技：技术变化让哪些能力成为可能、如何影响日常生活与工作，保留机制、具体场景和采用条件，不只追发布会参数。
  选题分别考虑与观众切身相关的收益或损失、情绪动机、有趣的新发现和可带走的理解，不要求每题全部具备。优先在栏目范围内覆盖较广的共同问题，具体例子不等于整篇受众；专业问题保留真实适用范围，不伪装成人人适用。商业关联可以较弱，不硬接购买、不预测转化。热度是辅助线索，不等于本题需求；不把多个维度合成总分。材料按需求线索、变化或事实材料、具体案例、比较或解释背景搭配，不必凑齐四类。
  候选按本轮值得制作的顺序排列，先说明共同问题，再保存能展开讲述的具体材料。保留原有字段和本栏目需要的操作、测试、实例或比较条件；不为扩大受众泛化专业内容。
  原有文稿风格、结构与口播安排交由下游作者；此步骤优化选什么和材料如何组织，不预写新的口播模板。
output: output/tech/{date}_tech_daily.md
audience_channel: tech_daily
content_strategy: audience-v1
question_material: question-v1
