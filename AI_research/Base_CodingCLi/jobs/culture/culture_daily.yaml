name: 文化艺术动态
description: 近期值得讲的艺术、音乐和设计动态（读 Hyperallergic、Colossal、Artnet、Pitchfork、Dezeen 等抓取的内容），不联网搜索
enabled: true
keywords:
- 艺术
- 音乐
- 设计
language: zh
schedule:
  type: manual
runtime:
  timeout_seconds: 1800
  skip_if_running: true
search: false
sources_limit: 8
sources:
- source:hyperallergic
- source:colossal
- source:artnet
- source:pitchfork
- source:dezeen
- source:open_culture
prompt: '为「读懂一件作品」整理研究底稿。从现有来源选择一件能沿具体细节持续展开的主作品，围绕一处表达变化保留创作者的动作、构图、材料、形式、声音线索、观看姿态与感受之间的关系。让具体作品与操作建立本期问题，相关背景、年代和参数解释它们怎样影响当前表达；相邻作品的对应细节帮助理解当前一步，再接回主作品。材料清单按其结构、工序或感受作用展开，保留具体例子、推理与过程。


  初次整理后，补充正文继续深化已经选择的作品与主问题，把新取得的细节、创作过程与相邻材料接回原解释。底稿完整保留细节和作者构思所需背景，研究备忘供作者构思，讲述正文直接描述创作动作与观看感受，作者按材料决定标题与节奏。材料已有图像的原始页面链接、作品称呼和可观察细节放在对应小节，供后续画面使用。


  任务：{name}

  领域：{domain}

  关键词：{keywords}

  日期：{date}

  输出语言：{language}


  数据格式：Markdown；候选或解释单元以「### 2.1 名称」标识，内部可用「####」保留完整过程与例子。素材链接放在对应段落，末尾「### 来源清单」继续记录链接。

  '
output: output/culture/{date}_culture_daily.md
