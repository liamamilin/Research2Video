name: 文化艺术动态
description: 近期值得讲的艺术、音乐和设计动态（读 Hyperallergic、Colossal、Artnet、Pitchfork、Dezeen 等抓取的内容），不联网搜索
enabled: true
keywords:
- 艺术
- 音乐
- 设计
language: zh
schedule:
  type: manual
runtime:
  timeout_seconds: 1800
  skip_if_running: true
search: false
sources_limit: 8
sources:
- source:hyperallergic
- source:colossal
- source:artnet
- source:pitchfork
- source:dezeen
- source:open_culture
prompt: |
  根据素材，产出目标观众愿意看、听得懂、想继续看的视频。
  当前步骤：研究事情本身，把后续讲述用得上的具体资料写明白。
  这次研究要帮助观众理解：从近期材料里发现值得讲给观众听的新事情。关注作品、创作者和文化现象背后的故事与感受，保留能把事情讲生动、讲明白的具体材料。
  任务：{name}
  领域：{domain}
  关键词：{keywords}
  日期：{date}
  输出语言：{language}

  数据格式：Markdown；条目以「### 2.1 名称」标识，末尾「### 来源清单」记录素材链接。
output: output/culture/{date}_culture_daily.md
