name: 文化艺术周观察
description: 每周挑一个文化主题讲清楚：作品或流派是什么、怎么形成、评论者怎么看（读艺术、音乐、设计类来源抓取的内容），初稿沿用固定材料，选题后按问题补材
domain: 文化与艺术
enabled: true
keywords:
- 艺术
- 音乐
- 设计
language: zh
schedule:
  type: manual
runtime:
  timeout_seconds: 1800
  skip_if_running: true
search: false
sources_limit: 10
sources:
- source:hyperallergic
- source:colossal
- source:open_culture
- source:artnet
- source:smithsonian_arts
- source:pitchfork
- source:dezeen
- source:jazztimes
- source:three_quarks
- source:art_newspaper
- source:aeon
- source:lithub
- source:indiewire
- source:public_domain_review
- source:marginalian
prompt: |
  为「一个文化现象的来路」整理研究底稿。围绕材料已经有具体过程的一处表达形式、用途或观看关系的变化，可以结合代表作品、参与者行动与具体场合，解释形成、展示、传播或理解上的变化。作品细节与实际行动可帮助解释本期文化问题，保留具体过程、作品细节、观众接触方式和解释中的推理；相关材料按对问题的解释价值组织。相邻案例可用于解释相关过程、差别与结果；人物履历、机构和年代说明它们改变了哪一步。比较围绕同一表达变化与观看条件展开。

  初次整理后，补充正文继续深化已经选定的主问题、代表作品和传播路径，把新取得的细节、阶段与相邻材料接回原解释。底稿完整保留具体例子、过程与作者构思所需背景，研究备忘供作者构思；讲述正文直接描述作品、参与者行动和理解变化，作者按材料组织标题与节奏。材料已有图像的原始页面链接、作品称呼和可观察细节放在对应小节，供后续画面使用。

  任务：{name}
  领域：{domain}
  关键词：{keywords}
  日期：{date}
  输出语言：{language}

  数据格式：Markdown；用「## 本期主问题：具体文化问题」标明本期要展开的同一解释，下面「### 2.1 名称」等小节组织相关关系、阶段与例子，内部用「####」保留完整过程。素材链接放在对应段落，末尾「### 来源清单」继续记录链接。
output: output/culture/{date}_culture_weekly.md
audience_channel: culture_weekly
content_strategy: audience-v1
question_material: question-v1
