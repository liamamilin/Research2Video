name: 文化艺术周观察
description: 每周挑一个文化主题讲清楚：作品或流派是什么、怎么形成、评论者怎么看（读艺术、音乐、设计类来源抓取的内容），不联网搜索
enabled: true
keywords:
- 艺术
- 音乐
- 设计
language: zh
schedule:
  type: manual
runtime:
  timeout_seconds: 1800
  skip_if_running: true
search: false
sources_limit: 10
sources:
- source:hyperallergic
- source:colossal
- source:open_culture
- source:artnet
- source:smithsonian_arts
- source:pitchfork
- source:dezeen
- source:jazztimes
prompt: '为「一个文化现象的来路」整理研究底稿。围绕材料已经有具体过程的一处表达形式、用途或观看关系的变化，用持续的代表作品和参与者在具体场合的行动，解释它怎样形成、展示、转译、传播与被重新理解。尽早把作品、正在发生的动作和本期文化问题接起来，保留具体过程、作品细节、观众接触方式和解释中的推理；本期问题贴着持续展开的变化。相邻案例在解释主过程某一步时进入，讲清该步动作与结果后回到主例子；人物履历、机构和年代说明它们改变了哪一步。比较围绕同一表达变化与观看条件展开。


  初次整理后，补充正文继续深化已经选定的主问题、代表作品和传播路径，把新取得的细节、阶段与相邻材料接回原解释。底稿完整保留具体例子、过程与作者构思所需背景，研究备忘供作者构思；讲述正文直接描述作品、参与者行动和理解变化，作者按材料组织标题与节奏。材料已有图像的原始页面链接、作品称呼和可观察细节放在对应小节，供后续画面使用。


  任务：{name}

  领域：{domain}

  关键词：{keywords}

  日期：{date}

  输出语言：{language}


  数据格式：Markdown；用「## 本期主问题：具体文化问题」标明本期要展开的同一解释，下面「### 2.1 名称」等小节组织相关关系、阶段与例子，内部用「####」保留完整过程。素材链接放在对应段落，末尾「### 来源清单」继续记录链接。

  '
output: output/culture/{date}_culture_weekly.md
