name: 每日软件发现
description: 每天值得看的新软件和开源项目（读 Product Hunt、Show HN、GitHub Blog、Changelog、GitHub 新项目抓取的内容），初稿沿用固定材料，选题后按问题补材
domain: 软件与数字工具
enabled: true
keywords:
- 软件发现
- 开源工具
- 效率工具
language: zh
schedule:
  type: manual
runtime:
  timeout_seconds: 1800
  skip_if_running: true
search: false
sources_limit: 8
sources:
- source:product_hunt
- source:hn_show
- source:github_blog
- source:changelog
- source:gh_new_selfhosted
- source:python_insider
- source:rust_blog
- source:apple_developer
- source:android_developers
- source:hn_front
- source:lobsters
prompt: |
  为「一个工具怎样解决问题」整理研究底稿。观众希望看到：具体任务从什么输入开始、点了哪些步骤、得到什么结果，以及门槛和适用条件。

  从近期材料保留能展开真实使用过程的软件或开源项目；写清它解决什么问题、和相近选择差在哪、什么人在什么条件下适合用。开发专用工具保留专业范围，不伪装成人人零门槛。

  任务：{name}
  领域：{domain}
  关键词：{keywords}
  日期：{date}
  输出语言：{language}

  数据格式：Markdown；条目以「### 2.1 名称」标识，末尾「### 来源清单」记录素材链接。
  选题与材料组织：软件：工作、学习和日常数字生活中的共同需求，保留工具的输入、操作、结果与使用门槛；开发专用工具保留专业范围。
  选题分别考虑与观众切身相关的收益或损失、情绪动机、有趣的新发现和可带走的理解，不要求每题全部具备。优先在栏目范围内覆盖较广的共同问题，具体例子不等于整篇受众；专业问题保留真实适用范围，不伪装成人人适用。商业关联可以较弱，不硬接购买、不预测转化。热度是辅助线索，不等于本题需求；不把多个维度合成总分。材料按需求线索、变化或事实材料、具体案例、比较或解释背景搭配，不必凑齐四类。
  候选按本轮值得制作的顺序排列，先说明共同问题，再保存能展开讲述的具体材料。保留原有字段和本栏目需要的操作、测试、实例或比较条件；不为扩大受众泛化专业内容。
  原有文稿风格、结构与口播安排交由下游作者；此步骤优化选什么和材料如何组织，不预写新的口播模板。
output: output/software/{date}_software_daily.md
audience_channel: software_daily
content_strategy: audience-v1
question_material: question-v1
