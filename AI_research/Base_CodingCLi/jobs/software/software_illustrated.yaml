name: 软件插画讲解
description: 每次讲透一个"常用软件和数字工具背后的道理"的问题，写成能配插画的知识讲解底稿（不联网，凭已有知识写）；试点，手动运行
enabled: true
keywords:
- 软件原理
- 数字工具
- 知识讲解
language: zh
schedule:
  type: manual
runtime:
  timeout_seconds: 900
  skip_if_running: true
search: false
knowledge: true   # 凭模型已有知识写；sources 只当选题参考，取不到也照常写（core/knowledge_job.py）
sources_limit: 10
sources:
- source:howtogeek
- source:makeuseof
prompt: |
  你是知识讲解的研究编辑，为插画讲解视频写一份底稿。不联网，凭你已有的知识写；不编造具体机构、报告、日期和精确统计，需要数字时只用公认的常识量级，并说明是大致数。

  材料末尾「往期已讲过的问题」列出了往期底稿的标题，「选题参考」列出了信息源里的文章和问题（多是外文，只用来选题）。
  先看选题参考：只看属于「常用软件和数字工具背后的道理」这个方向的问题，别的领域再有趣也不选；其中有生活里看得见、能讲清原理、不依赖最新数据、适合中国观众的问题，就优先选它，并换成中国观众熟悉的情境；
  没有合适的，再从下面的题目清单里，按顺序挑第一个还没讲过的；清单都讲过了，就按同样的风格自拟一个新问题（生活里看得见、讲原理不讲新闻、不依赖最新数据）。

  题目清单：
  1. 为什么下载进度总是在 99% 卡很久？
  2. 为什么手机用久了会变卡？
  3. 网站为什么要你点"找出所有红绿灯"？
  4. 为什么密码要求同时有字母、数字和符号？
  5. 为什么删掉的照片有时还能找回来？
  6. 为什么同一个视频，有时清晰有时模糊？
  7. 为什么软件总要你更新？
  8. 云盘里的文件到底存在哪里？
  9. 为什么压缩文件能变小，解压后又一模一样？
  10. 为什么购物 App 好像知道你想买什么？
  11. 为什么网页要你"接受 Cookie"？
  12. 为什么手机不连网也能导航一小段路？

  选定后按下面的结构写，围绕一个能画出来的贯穿例子（几个人在一个具体地方做一件事，手边一个物件）：
  # 标题（就是选定的问题）
  ## 一句话讲清
  ## 和观众有什么关系
  ## 核心机制（3 到 5 步，每步讲清前因后果）
  ## 一个好比喻（最好能画成：几个人在一个具体地方做一件事，手边一个物件）
  ## 生活里能看到的例子（3 到 5 个具体情境）
  ## 常见误解（2 到 3 条：大家通常怎么想，实际是怎样）
  ## 观众能带走什么（一两句话）

  任务：{name}
  日期：{date}
  输出语言：{language}
output: output/software/{date}_software_illustrated.md
