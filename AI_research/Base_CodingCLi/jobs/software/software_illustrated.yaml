name: 软件插画讲解
description: 每次讲透一个"常用软件和数字工具背后的道理"的问题，写成能配插画的知识讲解底稿（初稿凭已有知识写，之后按问题补充例子与解释）；试点，手动运行
domain: 软件与数字工具
enabled: true
keywords:
- 软件原理
- 数字工具
- 知识讲解
language: zh
schedule:
  type: manual
runtime:
  timeout_seconds: 900
  skip_if_running: true
search: false
knowledge: true
sources_limit: 10
sources:
- source:howtogeek
- source:makeuseof
prompt: |
  你是知识讲解的研究编辑，为插画讲解视频写一份底稿。不联网，凭你已有的知识写；不编造具体机构、报告、日期和精确统计，需要数字时只用公认的常识量级，并说明是大致数。

  材料末尾「往期已讲过的问题」列出了往期底稿的标题，「选题参考」列出了信息源里的文章和问题（多是外文，只用来选题）。
  先看选题参考：只看属于「常用软件和数字工具背后的道理」这个方向的问题，别的领域再有趣也不选；其中有生活里看得见、能讲清原理、不依赖最新数据、适合中国观众的问题，就优先选它，并换成中国观众熟悉的情境；
  没有合适的，按同样标准自拟一个新问题（生活里看得见、讲原理不讲新闻、不依赖最新数据）。下面几道只是风格示例，不是栏目题库上限，也不必按顺序用完。

  风格示例：
  1. 为什么下载进度总是在 99% 卡很久？
  2. 为什么手机用久了会变卡？
  3. 网站为什么要你点"找出所有红绿灯"？

  选定问题后，用 Markdown 写出能供作者深入讲述的知识底稿，一级标题写选定的问题。
  建议从真实现象或具体例子解释原因，把关键过程、前因后果和适用条件讲充分。
  例子用于帮助理解；有帮助时可以补充类比、对照或常见误解，内容和篇幅随问题需要安排。
  小节标题描述本题的具体内容，组织方式由材料决定。

  任务：{name}
  日期：{date}
  输出语言：{language}
  选题与材料组织：软件：工作、学习和日常数字生活中的共同需求，保留工具的输入、操作、结果与使用门槛；开发专用工具保留专业范围。
  选题分别考虑与观众切身相关的收益或损失、情绪动机、有趣的新发现和可带走的理解，不要求每题全部具备。优先在栏目范围内覆盖较广的共同问题，具体例子不等于整篇受众；专业问题保留真实适用范围，不伪装成人人适用。商业关联可以较弱，不硬接购买、不预测转化。热度是辅助线索，不等于本题需求；不把多个维度合成总分。材料按需求线索、变化或事实材料、具体案例、比较或解释背景搭配，不必凑齐四类。
  保持本栏已有知识写作方式：只选一个未讲过的问题，围绕问题保留有解释力的机制与生活细节，类比和段落按需要安排；来源标题仅作选题参考，不改称已读取的研究证据。选择共同可感的疑问或有趣的反差，例子帮助理解，不把例中人的职业或身份变成适用前提。
  原有文稿风格、结构与口播安排交由下游作者；此步骤优化选什么和材料如何组织，不预写新的口播模板。
output: output/software/{date}_software_illustrated.md
audience_channel: software_illustrated
content_strategy: audience-v1
question_material: question-v1
