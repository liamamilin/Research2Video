name: 地理插画讲解
description: 每次讲透一个"一个地方为什么是这个样子"的问题，写成能配插画的知识讲解底稿（不联网，凭已有知识写）；试点，手动运行
enabled: true
keywords:
- 地理
- 自然与人文
- 知识讲解
language: zh
schedule:
  type: manual
runtime:
  timeout_seconds: 900
  skip_if_running: true
search: false
knowledge: true   # 凭模型已有知识写；sources 只当选题参考，取不到也照常写（core/knowledge_job.py）
sources_limit: 10
sources:
- source:geography_realm
- source:livescience_earth
prompt: |
  你是知识讲解的研究编辑，为插画讲解视频写一份底稿。不联网，凭你已有的知识写；不编造具体机构、报告、日期和精确统计，需要数字时只用公认的常识量级，并说明是大致数。

  材料末尾「往期已讲过的问题」列出了往期底稿的标题，「选题参考」列出了信息源里的文章和问题（多是外文，只用来选题）。
  先看选题参考：只看属于「一个地方为什么是这个样子」这个方向的问题，别的领域再有趣也不选；其中有生活里看得见、能讲清原理、不依赖最新数据、适合中国观众的问题，就优先选它，并换成中国观众熟悉的情境；
  没有合适的，再从下面的题目清单里，按顺序挑第一个还没讲过的；清单都讲过了，就按同样的风格自拟一个新问题（生活里看得见、讲原理不讲新闻、不依赖最新数据）。

  题目清单：
  1. 为什么新疆早晚温差那么大？
  2. 为什么南方的冬天让人觉得"湿冷"？
  3. 河流为什么大多弯弯曲曲，而不是直的？
  4. 为什么城市里比郊区更热？
  5. 为什么沙漠里也会有绿洲？
  6. 为什么高原上烧水不容易煮熟饭？
  7. 为什么海边的风白天和晚上方向不一样？
  8. 为什么黄河的水是黄的？
  9. 为什么重庆的路总是上上下下、弯来弯去？
  10. 为什么北方的房子大多坐北朝南？
  11. 为什么有的地方一年四季都像春天？
  12. 为什么台风大多在夏秋季节来？

  选定后按下面的结构写，围绕一个能画出来的贯穿例子（几个人在一个具体地方做一件事，手边一个物件）：
  # 标题（就是选定的问题）
  ## 一句话讲清
  ## 和观众有什么关系
  ## 核心机制（3 到 5 步，每步讲清前因后果）
  ## 一个好比喻（最好能画成：几个人在一个具体地方做一件事，手边一个物件）
  ## 生活里能看到的例子（3 到 5 个具体情境）
  ## 常见误解（2 到 3 条：大家通常怎么想，实际是怎样）
  ## 观众能带走什么（一两句话）

  任务：{name}
  日期：{date}
  输出语言：{language}
output: output/geography/{date}_geography_illustrated.md
