name: 世界与地球动态
description: 近期值得讲的地理、生态和世界遗产动态（读 Atlas Obscura、Mongabay、Geographical、UNESCO、USGS 抓取的内容），初稿沿用固定材料，选题后按问题补材
domain: 地理与世界
enabled: true
keywords:
- 地理
- 世界遗产
- 地球
language: zh
schedule:
  type: manual
runtime:
  timeout_seconds: 1800
  skip_if_running: true
search: false
sources_limit: 8
sources:
- source:atlas_obscura
- source:mongabay
- source:geographical
- source:unesco_wh
- source:usgs_quakes
- source:climate_gov
- source:gdacs
- source:cma_news
- source:nhc_atlantic
- source:carbon_brief
prompt: |
  为「一个地方怎样运转」整理研究底稿。从现有来源选择一项可以沿地方活动或设施使用展开的具体空间问题，保留起点、路径、地点之间的关系、参与者行动、尺度和过程。写清人和事物在哪里相遇，道路、土地、水流或设施怎样接起来，生活怎样因此改变。机构新闻、政策和人物反应解释它们在当地改变了哪一步，背景与当前主问题相连。

  初次整理后，补充正文继续深化已经选定的地点、活动和主问题，把新取得的细节、过程与相邻案例接回原空间解释。底稿完整保留路线、推理、过程与生活例子，研究备忘供作者构思；讲述正文围绕具体地方和行动组织，作者按本期材料决定标题与节奏。材料已有的地图、剖面、地点或设施图像页面链接与可观察要点放在对应空间说明小节，供后续画面使用。

  任务：{name}
  领域：{domain}
  关键词：{keywords}
  日期：{date}
  输出语言：{language}

  数据格式：Markdown；候选或解释单元以「### 2.1 名称」标识，内部可用「####」保留完整过程与例子。素材链接放在对应段落，末尾「### 来源清单」继续记录链接。
  选题与材料组织：地理：地方差异、自然现象和人与环境的关系，保留空间、尺度和变化过程，不强写旅行消费。
  选题分别考虑与观众切身相关的收益或损失、情绪动机、有趣的新发现和可带走的理解，不要求每题全部具备。优先在栏目范围内覆盖较广的共同问题，具体例子不等于整篇受众；专业问题保留真实适用范围，不伪装成人人适用。商业关联可以较弱，不硬接购买、不预测转化。热度是辅助线索，不等于本题需求；不把多个维度合成总分。材料按需求线索、变化或事实材料、具体案例、比较或解释背景搭配，不必凑齐四类。
  候选按本轮值得制作的顺序排列，先说明共同问题，再保存能展开讲述的具体材料。保留原有字段和本栏目需要的操作、测试、实例或比较条件；不为扩大受众泛化专业内容。
  原有文稿风格、结构与口播安排交由下游作者；此步骤优化选什么和材料如何组织，不预写新的口播模板。
output: output/geography/{date}_geography_daily.md
audience_channel: geography_daily
content_strategy: audience-v1
question_material: question-v1
