name: 世界与地球动态
description: 近期值得讲的地理、生态和世界遗产动态（读 Atlas Obscura、Mongabay、Geographical、UNESCO、USGS 抓取的内容），不联网搜索
enabled: true
keywords:
- 地理
- 世界遗产
- 地球
language: zh
schedule:
  type: manual
runtime:
  timeout_seconds: 1800
  skip_if_running: true
search: false
sources_limit: 8
sources:
- source:atlas_obscura
- source:mongabay
- source:geographical
- source:unesco_wh
- source:usgs_quakes
prompt: '为「一个地方怎样运转」整理研究底稿。从现有来源选择一项可以沿地方活动或设施使用展开的具体空间问题，保留起点、路径、地点之间的关系、参与者行动、尺度和过程。写清人和事物在哪里相遇，道路、土地、水流或设施怎样接起来，生活怎样因此改变。机构新闻、政策和人物反应解释它们在当地改变了哪一步，背景与当前主问题相连。


  初次整理后，补充正文继续深化已经选定的地点、活动和主问题，把新取得的细节、过程与相邻案例接回原空间解释。底稿完整保留路线、推理、过程与生活例子，研究备忘供作者构思；讲述正文围绕具体地方和行动组织，作者按本期材料决定标题与节奏。材料已有的地图、剖面、地点或设施图像页面链接与可观察要点放在对应空间说明小节，供后续画面使用。


  任务：{name}

  领域：{domain}

  关键词：{keywords}

  日期：{date}

  输出语言：{language}


  数据格式：Markdown；候选或解释单元以「### 2.1 名称」标识，内部可用「####」保留完整过程与例子。素材链接放在对应段落，末尾「### 来源清单」继续记录链接。

  '
output: output/geography/{date}_geography_daily.md
