name: 地理专题周读
description: 每周挑一个地理主题讲清楚：这个地方或现象是什么、数据怎么说、为什么特别（读 Our World in Data、UNESCO、Atlas Obscura、Smithsonian、Mongabay 
  等抓取的内容），初稿沿用固定材料，选题后按问题补材
domain: 地理与世界
enabled: true
keywords:
- 地理
- 世界遗产
- 地球
language: zh
schedule:
  type: manual
runtime:
  timeout_seconds: 1800
  skip_if_running: true
search: false
sources_limit: 10
sources:
- tag:geography
prompt: |
  为「地理如何塑造生活」整理研究底稿。围绕同一个具体空间问题，可以结合具体地点或可比较地点解释空间差异如何通过地形、距离、气候、水流、道路或设施转成生活后果。位置与连接有助于理解人和事物的关系，保留材料中的路线、尺度、推理、过程和具体生活实例；比较对齐同一问题。机构、资本和争论贴着它们实际改变的空间路径或当地活动解释。

  初次整理后，补充正文继续深化已经选定的地点与主问题，把新取得的关系、阶段、细节与相邻例子接回原解释。底稿完整保留主过程与生活例子，研究备忘供作者构思；旁白直接讲当地的人、移动和结果，作者按本期材料组织标题与节奏。材料已有的地图、剖面、地点或设施图像页面链接与可观察要点放在对应空间说明小节，供后续画面使用。

  任务：{name}
  领域：{domain}
  关键词：{keywords}
  日期：{date}
  输出语言：{language}

  数据格式：Markdown；用「## 本期主问题：具体空间问题」标明本期要展开的同一解释，下面「### 2.1 名称」等小节组织相关关系、阶段与例子，内部用「####」保留完整过程。素材链接放在对应段落，末尾「### 来源清单」继续记录链接。
  选题与材料组织：地理：地方差异、自然现象和人与环境的关系，保留空间、尺度和变化过程，不强写旅行消费。
  选题分别考虑与观众切身相关的收益或损失、情绪动机、有趣的新发现和可带走的理解，不要求每题全部具备。优先在栏目范围内覆盖较广的共同问题，具体例子不等于整篇受众；专业问题保留真实适用范围，不伪装成人人适用。商业关联可以较弱，不硬接购买、不预测转化。热度是辅助线索，不等于本题需求；不把多个维度合成总分。材料按需求线索、变化或事实材料、具体案例、比较或解释背景搭配，不必凑齐四类。
  本期只选一个主问题，先判断为什么有人值得花时间理解它，再围绕它保留完整解释、原因、过程、案例及条件。不要为了覆盖面拆成新闻列表，也不把商业关联硬写成购买建议。
  原有文稿风格、结构与口播安排交由下游作者；此步骤优化选什么和材料如何组织，不预写新的口播模板。
output: output/geography/{date}_geography_weekly.md
audience_channel: geography_weekly
content_strategy: audience-v1
question_material: question-v1
