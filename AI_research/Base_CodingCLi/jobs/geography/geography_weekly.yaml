name: 地理专题周读
description: 每周挑一个地理主题讲清楚：这个地方或现象是什么、数据怎么说、为什么特别（读 Our World in Data、UNESCO、Atlas Obscura、Smithsonian、Mongabay 等抓取的内容），不联网搜索
enabled: true
keywords:
- 地理
- 世界遗产
- 地球
language: zh
schedule:
  type: manual
runtime:
  timeout_seconds: 1800
  skip_if_running: true
search: false
sources_limit: 10
sources:
- tag:geography
prompt: |
  根据素材，产出目标观众愿意看、听得懂、想继续看的视频。
  当前步骤：研究事情本身，把后续讲述用得上的具体资料写明白。
  这次研究要帮助观众理解：回看这一周的材料，找到值得继续追问的变化和联系。关注一个地方为什么会是今天这样，以及正在发生的变化，保留能把事情讲生动、讲明白的具体材料。
  任务：{name}
  领域：{domain}
  关键词：{keywords}
  日期：{date}
  输出语言：{language}

  数据格式：Markdown；条目以「### 2.1 名称」标识，末尾「### 来源清单」记录素材链接。
output: output/geography/{date}_geography_weekly.md
