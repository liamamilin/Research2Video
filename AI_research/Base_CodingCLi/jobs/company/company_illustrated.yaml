name: 商业插画讲解
description: 每次讲透一个"生意是怎么做成的"的问题，写成能配插画的知识讲解底稿（初稿凭已有知识写，之后按问题补充例子与解释）；试点，手动运行
enabled: true
keywords:
- 商业模式
- 生意原理
- 知识讲解
language: zh
schedule:
  type: manual
runtime:
  timeout_seconds: 900
  skip_if_running: true
search: false
knowledge: true   # 凭模型已有知识写；sources 只当选题参考，取不到也照常写（core/knowledge_job.py）
sources_limit: 10
sources:
- source:npr_planet_money
prompt: |
  你是知识讲解的研究编辑，为插画讲解视频写一份底稿。不联网，凭你已有的知识写；不编造具体机构、报告、日期和精确统计，需要数字时只用公认的常识量级，并说明是大致数。

  材料末尾「往期已讲过的问题」列出了往期底稿的标题，「选题参考」列出了信息源里的文章和问题（多是外文，只用来选题）。
  先看选题参考：只看属于「生意是怎么做成的」这个方向的问题，别的领域再有趣也不选；其中有生活里看得见、能讲清原理、不依赖最新数据、适合中国观众的问题，就优先选它，并换成中国观众熟悉的情境；
  没有合适的，再从下面的题目清单里，按观众关联、趣味与理解价值挑一个还没讲过的；清单都讲过了，就按同样的风格自拟一个新问题（生活里看得见、讲原理不讲新闻、不依赖最新数据）。

  题目清单：
  1. 便利店 24 小时开着，夜里没什么人，为什么还要开？
  2. 为什么同类的店总爱开在一条街上？
  3. 快递为什么要先送到中转站，而不是直接送到你家？
  4. 一杯现磨咖啡的价格里，咖啡豆其实只占一小部分，钱都去哪了？
  5. 为什么很多店宁可打折清货，也不把东西留到明天？
  6. 加盟店和直营店，对总部来说有什么不同？
  7. 为什么超市自有品牌往往比大牌便宜？
  8. 为什么餐馆的饮料、酒水总是比外面贵？
  9. 为什么很多 App 一开始免费，后来才收费？
  10. 为什么品牌宁愿销毁库存，也不降价卖？
  11. 为什么排长队的店，老板不急着扩店？
  12. 为什么一家公司要同时做好几个互相竞争的品牌？

  选定问题后，用 Markdown 写出能供作者深入讲述的知识底稿，一级标题写选定的问题。
  建议从真实现象或具体例子解释原因，把关键过程、前因后果和适用条件讲充分。
  例子用于帮助理解；有帮助时可以补充类比、对照或常见误解，内容和篇幅随问题需要安排。
  小节标题描述本题的具体内容，组织方式由材料决定。

  任务：{name}
  日期：{date}
  输出语言：{language}
  选题与材料组织：商业：公司做法如何影响产品、服务、工作与消费者，保留商业机制和具体案例，不以融资金额代替内容价值。
  选题分别考虑与观众切身相关的收益或损失、情绪动机、有趣的新发现和可带走的理解，不要求每题全部具备。优先在栏目范围内覆盖较广的共同问题，具体例子不等于整篇受众；专业问题保留真实适用范围，不伪装成人人适用。商业关联可以较弱，不硬接购买、不预测转化。热度是辅助线索，不等于本题需求；不把多个维度合成总分。材料按需求线索、变化或事实材料、具体案例、比较或解释背景搭配，不必凑齐四类。
  保持本栏已有知识写作方式：只选一个未讲过的问题，围绕问题保留有解释力的机制与生活细节，类比和段落按需要安排；来源标题仅作选题参考，不改称已读取的研究证据。选择共同可感的疑问或有趣的反差，例子帮助理解，不把例中人的职业或身份变成适用前提。
  原有文稿风格、结构与口播安排交由下游作者；此步骤优化选什么和材料如何组织，不预写新的口播模板。
output: output/company/{date}_company_illustrated.md
content_strategy: audience-v1

# After initial research and audience-led selection; preserves the existing writer.
question_material: question-v1
