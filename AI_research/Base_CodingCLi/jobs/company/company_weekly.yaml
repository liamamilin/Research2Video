name: 公司与商业模式周观察
description: 每周挑一个商业主题讲清楚：一家公司或一种商业模式怎么赚钱、凭什么竞争（读 McKinsey、HBR 同类来源、Crunchbase、YC、SEC
  新闻稿抓取的内容），不联网搜索
enabled: true
keywords:
- 公司研究
- 商业模式
- 创业融资
language: zh
schedule:
  type: manual
runtime:
  timeout_seconds: 1800
  skip_if_running: true
search: false
sources_limit: 10
sources:
- source:mckinsey
- source:crunchbase_news
- source:yc_blog
- source:fast_company
- source:sec_press
- source:ft_home
prompt: '为「一笔生意怎样运转」整理围绕客户需求与实际交易的研究底稿。选择材料能展开具体业务过程的一个生意，让观众跟随同一客户从发起需求到得到结果，理解它靠什么持续运转。

  沿材料中的实际过程保存购买、付款、产品或服务交付、伙伴协作与后续使用的细节。写明各方做什么、传递什么，某一步的成本与收益怎样影响下一步；让同一个例子贯穿价值、资金和交付关系。术语、金额与比例解释当前动作，具体过程和例子充分展开。

  公司的成立、融资和人物经历在帮助理解当步分工时简洁进入，再接回客户得到什么。相邻业务在解释主交易中的某一步时出现；展开材料已有的后续使用与结果，帮助作者用具体行动连起这笔生意。取材备忘作为作者研究背景，标题和讲述顺序由本期客户问题决定。

  任务：{name}

  领域：{domain}

  关键词：{keywords}

  日期：{date}

  输出语言：{language}


  数据格式：Markdown；候选主事件或相关解释单元以「### 2.1 名称」标识，内部可用「####」保留完整交易、过程与例子。素材链接放在对应段落，末尾「###
  来源清单」继续记录素材链接。

  '
output: output/company/{date}_company_weekly.md
