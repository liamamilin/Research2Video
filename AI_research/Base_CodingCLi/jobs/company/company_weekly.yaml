name: 公司与商业模式周观察
description: 每周挑一个商业主题讲清楚：一家公司或一种商业模式怎么赚钱、凭什么竞争（读 McKinsey、HBR 同类来源、Crunchbase、YC、SEC 新闻稿抓取的内容），不联网搜索
domain: 商业与公司
enabled: true
keywords:
- 公司研究
- 商业模式
- 创业融资
language: zh
schedule:
  type: manual
runtime:
  timeout_seconds: 1800
  skip_if_running: true
search: false
sources_limit: 10
sources:
- source:mckinsey
- source:crunchbase_news
- source:yc_blog
- source:fast_company
- source:sec_press
- source:ft_home
- source:apple_newsroom
- source:samsung_newsroom
- source:amazon_news
- source:nvidia_newsroom
- source:tsmc_pr
- source:techmeme
- source:techcrunch
- source:stratechery
- source:not_boring
- source:economist_world
prompt: |
  为「一笔生意怎样运转」整理围绕客户需求与实际交易的研究底稿。选择材料能展开具体业务过程的一个生意，可以结合客户从发起需求到得到结果的过程，理解它靠什么持续运转。
  沿材料中的实际过程保存购买、付款、产品或服务交付、伙伴协作与后续使用的细节。写明各方做什么、传递什么，某一步的成本与收益怎样影响下一步；具体例子可帮助理解价值、资金和交付关系。术语、金额与比例解释当前动作，具体过程和例子充分展开。
  公司的成立、融资、人物经历与相邻业务可作为理解分工和客户收益的背景；展开材料已有的后续使用与结果，帮助作者用具体行动连起这笔生意。取材备忘作为作者研究背景，标题和讲述顺序由本期客户问题决定。
  任务：{name}
  领域：{domain}
  关键词：{keywords}
  日期：{date}
  输出语言：{language}

  数据格式：Markdown；候选主事件或相关解释单元以「### 2.1 名称」标识，内部可用「####」保留完整交易、过程与例子。素材链接放在对应段落，末尾「### 来源清单」继续记录素材链接。
  选题与材料组织：商业：公司做法如何影响产品、服务、工作与消费者，保留商业机制和具体案例，不以融资金额代替内容价值。
  选题分别考虑与观众切身相关的收益或损失、情绪动机、有趣的新发现和可带走的理解，不要求每题全部具备。优先在栏目范围内覆盖较广的共同问题，具体例子不等于整篇受众；专业问题保留真实适用范围，不伪装成人人适用。商业关联可以较弱，不硬接购买、不预测转化。热度是辅助线索，不等于本题需求；不把多个维度合成总分。材料按需求线索、变化或事实材料、具体案例、比较或解释背景搭配，不必凑齐四类。
  本期只选一个主问题，先判断为什么有人值得花时间理解它，再围绕它保留完整解释、原因、过程、案例及条件。不要为了覆盖面拆成新闻列表，也不把商业关联硬写成购买建议。
  原有文稿风格、结构与口播安排交由下游作者；此步骤优化选什么和材料如何组织，不预写新的口播模板。
output: output/company/{date}_company_weekly.md
audience_channel: company_weekly
content_strategy: audience-v1
question_material: question-v1
