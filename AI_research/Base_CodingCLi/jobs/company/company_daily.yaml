name: 商业动态日报
description: 每天值得关注的几条商业动态：公司动作、融资、创业、监管（读 Crunchbase News、Fast Company、Y Combinator、SEC 新闻稿抓取的内容），不联网搜索
domain: 商业与公司
enabled: true
keywords:
- 公司研究
- 商业模式
- 创业融资
language: zh
schedule:
  type: manual
runtime:
  timeout_seconds: 1800
  skip_if_running: true
search: false
sources_limit: 8
sources:
- source:crunchbase_news
- source:fast_company
- source:yc_blog
- source:sec_press
- source:apple_newsroom
- source:nvidia_newsroom
- source:tsmc_pr
- source:techmeme
- source:techcrunch
prompt: |
  为「公司这一招」保存可供深入讲述的业务案例。观众希望理解公司改变了一个什么具体环节，以及客户、伙伴或对手因此怎样行动。
  保留近期材料中值得讲述的候选。重点候选可以结合当事人的购买、使用、生产或交付场景展开，可以结合产品与参与者解释原有做法、变化、选择依据和实际结果。保留材料已有的具体动作、操作顺序、交接与例子，为作者理解相关案例提供充分细节。
  参与者的名字在他承担的业务步骤出现；融资、估值与行业规模简洁交代它解释的位置或资源，把主要篇幅留给具体业务怎样变化。相关案例可以帮助解释当前关系，取材备忘留作作者背景。作者按主事件的观看收获组织标题与口播节奏。
  任务：{name}
  领域：{domain}
  关键词：{keywords}
  日期：{date}
  输出语言：{language}

  数据格式：Markdown；候选主事件或相关解释单元以「### 2.1 名称」标识，内部可用「####」保留完整交易、过程与例子。素材链接放在对应段落，末尾「### 来源清单」继续记录素材链接。
output: output/company/{date}_company_daily.md
audience_channel: company_daily
content_strategy: audience-v1
question_material: question-v1
