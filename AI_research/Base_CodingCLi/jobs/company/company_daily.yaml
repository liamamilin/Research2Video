name: 商业动态日报
description: 每天值得关注的几条商业动态：公司动作、融资、创业、监管（读 Crunchbase News、Fast Company、Y Combinator、SEC
  新闻稿抓取的内容），不联网搜索
enabled: true
keywords:
- 公司研究
- 商业模式
- 创业融资
language: zh
schedule:
  type: manual
runtime:
  timeout_seconds: 1800
  skip_if_running: true
search: false
sources_limit: 8
sources:
- source:crunchbase_news
- source:fast_company
- source:yc_blog
- source:sec_press
- source:apple_newsroom
- source:nvidia_newsroom
- source:tsmc_pr
- source:techmeme
- source:techcrunch
prompt: |
  为「公司这一招」保存可供深入讲述的业务案例。观众希望理解公司改变了一个什么具体环节，以及客户、伙伴或对手因此怎样行动。
  保留近期材料中值得讲述的候选。重点候选可以结合当事人的购买、使用、生产或交付场景展开，可以结合产品与参与者解释原有做法、变化、选择依据和实际结果。保留材料已有的具体动作、操作顺序、交接与例子，为作者理解相关案例提供充分细节。
  参与者的名字在他承担的业务步骤出现；融资、估值与行业规模简洁交代它解释的位置或资源，把主要篇幅留给具体业务怎样变化。相关案例可以帮助解释当前关系，取材备忘留作作者背景。作者按主事件的观看收获组织标题与口播节奏。
  任务：{name}
  领域：{domain}
  关键词：{keywords}
  日期：{date}
  输出语言：{language}

  数据格式：Markdown；候选主事件或相关解释单元以「### 2.1 名称」标识，内部可用「####」保留完整交易、过程与例子。素材链接放在对应段落，末尾「### 来源清单」继续记录素材链接。
  选题与材料组织：商业：公司做法如何影响产品、服务、工作与消费者，保留商业机制和具体案例，不以融资金额代替内容价值。
  选题分别考虑与观众切身相关的收益或损失、情绪动机、有趣的新发现和可带走的理解，不要求每题全部具备。优先在栏目范围内覆盖较广的共同问题，具体例子不等于整篇受众；专业问题保留真实适用范围，不伪装成人人适用。商业关联可以较弱，不硬接购买、不预测转化。热度是辅助线索，不等于本题需求；不把多个维度合成总分。材料按需求线索、变化或事实材料、具体案例、比较或解释背景搭配，不必凑齐四类。
  候选按本轮值得制作的顺序排列，先说明共同问题，再保存能展开讲述的具体材料。保留原有字段和本栏目需要的操作、测试、实例或比较条件；不为扩大受众泛化专业内容。
  原有文稿风格、结构与口播安排交由下游作者；此步骤优化选什么和材料如何组织，不预写新的口播模板。
output: output/company/{date}_company_daily.md
content_strategy: audience-v1

# After initial research and audience-led selection; preserves the existing writer.
question_material: question-v1
