name: 产业插画讲解
description: 每次讲透一个"一样东西是怎么造出来、送出去的"的问题，写成能配插画的知识讲解底稿（不联网，凭已有知识写）；试点，手动运行
enabled: true
keywords:
- 制造业
- 工艺流程
- 知识讲解
language: zh
schedule:
  type: manual
runtime:
  timeout_seconds: 900
  skip_if_running: true
search: false
knowledge: true   # 凭模型已有知识写；sources 只当选题参考，取不到也照常写（core/knowledge_job.py）
sources_limit: 10
sources:
- source:interesting_engineering
prompt: |
  你是知识讲解的研究编辑，为插画讲解视频写一份底稿。不联网，凭你已有的知识写；不编造具体机构、报告、日期和精确统计，需要数字时只用公认的常识量级，并说明是大致数。

  材料末尾「往期已讲过的问题」列出了往期底稿的标题，「选题参考」列出了信息源里的文章和问题（多是外文，只用来选题）。
  先看选题参考：只看属于「一样东西是怎么造出来、送出去的」这个方向的问题，别的领域再有趣也不选；其中有生活里看得见、能讲清原理、不依赖最新数据、适合中国观众的问题，就优先选它，并换成中国观众熟悉的情境；
  没有合适的，再从下面的题目清单里，按顺序挑第一个还没讲过的；清单都讲过了，就按同样的风格自拟一个新问题（生活里看得见、讲原理不讲新闻、不依赖最新数据）。

  题目清单：
  1. 一瓶矿泉水从水源到货架，要经过哪些步骤？
  2. 为什么集装箱都是统一尺寸？
  3. 为什么芯片要在无尘车间里造？
  4. 一件 T 恤是怎么从棉花变成衣服的？
  5. 为什么汽车工厂要用流水线？
  6. 为什么玻璃杯是透明的，造的时候怎么让它不起泡？
  7. 为什么饼干、薯片的包装里要充气？
  8. 钢铁厂是怎么把铁矿石炼成钢的？
  9. 为什么手机要在不同的工厂造零件，最后再组装？
  10. 冷链运输是怎么让冰淇淋一路不化的？
  11. 为什么造纸要用那么多水？
  12. 为什么工厂里的零件要做成标准尺寸？

  选定后按下面的结构写，围绕一个能画出来的贯穿例子（几个人在一个具体地方做一件事，手边一个物件）：
  # 标题（就是选定的问题）
  ## 一句话讲清
  ## 和观众有什么关系
  ## 核心机制（3 到 5 步，每步讲清前因后果）
  ## 一个好比喻（最好能画成：几个人在一个具体地方做一件事，手边一个物件）
  ## 生活里能看到的例子（3 到 5 个具体情境）
  ## 常见误解（2 到 3 条：大家通常怎么想，实际是怎样）
  ## 观众能带走什么（一两句话）

  任务：{name}
  日期：{date}
  输出语言：{language}
output: output/industry/{date}_industry_illustrated.md
