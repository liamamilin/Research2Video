name: 产业动态日报
description: 近期值得关注的产业和制造业动态（读 Supply Chain Dive、Manufacturing Dive、EE Times、Semiconductor Digest、NIST 抓取的内容），不联网搜索
domain: 产业与制造业
enabled: true
keywords:
- 制造业
- 产业链
- 半导体
language: zh
schedule:
  type: manual
runtime:
  timeout_seconds: 1800
  skip_if_running: true
search: false
sources_limit: 8
sources:
- source:supply_chain_dive
- source:manufacturing_dive
- source:eetimes
- source:semiconductor_digest
- source:nist_manufacturing
- source:tsmc_pr
- source:sia_news
- source:nvidia_newsroom
- source:canary_media
- source:electrek
- source:semiwiki
prompt: |
  为「产业链的一处变化」整理研究底稿。观众要理解一处产业变化落在生产交付的哪一环，以及它怎样改变前后环节。
  从近期材料保留有具体产品、部件、工艺或交付依赖的候选。可以结合产品、工艺或交付实例解释原有做法、变化、上下游依赖与实际结果。保留材料中的结构、工具、操作、条件、产出和实际案例。
  公司动作、价格、产能、融资与争议放回它影响的生产环节，相关伙伴通过产品经过的步骤进入解释。让具体过程帮助作者讲清变化，取材备忘保留为研究背景。
  围绕当前改变保留产品或部件可见的前后状态、作用位置和交接对象，设备作用和伙伴分工可以结合实际动作解释。平台参数与行业规模用于解释当步取舍，背景备注留在底稿，保留有助于理解前后工序的具体材料。

  任务：{name}
  领域：{domain}
  关键词：{keywords}
  日期：{date}
  输出语言：{language}

  数据格式：Markdown；候选或解释单元以「### 2.1 名称」标识，内部以「####」保留完整操作和例子。素材链接放在对应段落，末尾「### 来源清单」继续记录链接。
  选题与材料组织：产业：日常产品背后的制造、供应与成本变化，保留工序和产业链关系，专业环节解释其作用。
  选题分别考虑与观众切身相关的收益或损失、情绪动机、有趣的新发现和可带走的理解，不要求每题全部具备。优先在栏目范围内覆盖较广的共同问题，具体例子不等于整篇受众；专业问题保留真实适用范围，不伪装成人人适用。商业关联可以较弱，不硬接购买、不预测转化。热度是辅助线索，不等于本题需求；不把多个维度合成总分。材料按需求线索、变化或事实材料、具体案例、比较或解释背景搭配，不必凑齐四类。
  候选按本轮值得制作的顺序排列，先说明共同问题，再保存能展开讲述的具体材料。保留原有字段和本栏目需要的操作、测试、实例或比较条件；不为扩大受众泛化专业内容。
  原有文稿风格、结构与口播安排交由下游作者；此步骤优化选什么和材料如何组织，不预写新的口播模板。
output: output/industry/{date}_industry_daily.md
audience_channel: industry_daily
content_strategy: audience-v1
question_material: question-v1
