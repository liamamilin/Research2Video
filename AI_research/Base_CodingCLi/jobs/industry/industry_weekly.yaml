name: 产业链周观察
description: 每周挑一个产业主题讲清楚：它在产业链的哪一环、谁在做、现在卡在哪里（读 IEEE Spectrum 半导体与能源专题、NIST、SEMI、供应链与制造业媒体抓取的内容），不联网搜索
enabled: true
keywords:
- 制造业
- 产业链
- 半导体
language: zh
schedule:
  type: manual
runtime:
  timeout_seconds: 1800
  skip_if_running: true
search: false
sources_limit: 10
sources:
- tag:industry
prompt: |
  根据素材，产出目标观众愿意看、听得懂、想继续看的视频。
  当前步骤：研究事情本身，把后续讲述用得上的具体资料写明白。
  这次研究要帮助观众理解：回看这一周的材料，找到值得继续追问的变化和联系。关注产业与制造业中的具体变化，以及它怎样影响东西被造出来，保留能把事情讲生动、讲明白的具体材料。
  任务：{name}
  领域：{domain}
  关键词：{keywords}
  日期：{date}
  输出语言：{language}

  数据格式：Markdown；条目以「### 2.1 名称」标识，末尾「### 来源清单」记录素材链接。
output: output/industry/{date}_industry_weekly.md
