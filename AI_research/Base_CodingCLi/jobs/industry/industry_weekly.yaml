name: 产业链周观察
description: 每周挑一个产业主题讲清楚：它在产业链的哪一环、谁在做、现在卡在哪里（读 IEEE Spectrum 半导体与能源专题、NIST、SEMI、供应链与制造业媒体抓取的内容），初稿沿用固定材料，选题后按问题补材
enabled: true
keywords:
- 制造业
- 产业链
- 半导体
language: zh
schedule:
  type: manual
runtime:
  timeout_seconds: 1800
  skip_if_running: true
search: false
sources_limit: 10
sources:
- tag:industry
prompt: |
  为「一件东西怎样造」整理研究底稿。选择材料中能展开具体制造或协作过程的一件产品、部件或工艺，让观众理解它怎样形成可重复的交付。
  用途与实际工序可帮助解释输入、工具与操作、结构或状态怎样改变、怎样转交下一环节。保留工艺条件、可见特征、参与者分工、前后对照和实际例子，为作者解释制造过程提供细节。
  厂商、标准与产业关系在它承担的步骤中出现；数字解释当步的尺度和取舍，历史和相邻工艺可用于解释联系与差别。底稿保留完整过程，作者自主组织讲述与节奏。
  建议保留工具作用的位置、材料和结构的前后状态；配套硬件可以结合它影响的动作解释，交接写清前道产出与后道怎样使用。生产时间和规模放在对应步骤里展开，背景备注留作作者取材，具体工序和重复交付过程充分保留。

  任务：{name}
  领域：{domain}
  关键词：{keywords}
  日期：{date}
  输出语言：{language}

  数据格式：Markdown；候选或解释单元以「### 2.1 名称」标识，内部以「####」保留完整操作和例子。素材链接放在对应段落，末尾「### 来源清单」继续记录链接。
  选题与材料组织：产业：日常产品背后的制造、供应与成本变化，保留工序和产业链关系，专业环节解释其作用。
  选题分别考虑与观众切身相关的收益或损失、情绪动机、有趣的新发现和可带走的理解，不要求每题全部具备。优先在栏目范围内覆盖较广的共同问题，具体例子不等于整篇受众；专业问题保留真实适用范围，不伪装成人人适用。商业关联可以较弱，不硬接购买、不预测转化。热度是辅助线索，不等于本题需求；不把多个维度合成总分。材料按需求线索、变化或事实材料、具体案例、比较或解释背景搭配，不必凑齐四类。
  本期只选一个主问题，先判断为什么有人值得花时间理解它，再围绕它保留完整解释、原因、过程、案例及条件。不要为了覆盖面拆成新闻列表，也不把商业关联硬写成购买建议。
  原有文稿风格、结构与口播安排交由下游作者；此步骤优化选什么和材料如何组织，不预写新的口播模板。
output: output/industry/{date}_industry_weekly.md
content_strategy: audience-v1

# After initial research and audience-led selection; preserves the existing writer.
question_material: question-v1
