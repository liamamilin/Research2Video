name: 产业链周观察
description: 每周挑一个产业主题讲清楚：它在产业链的哪一环、谁在做、现在卡在哪里（读 IEEE Spectrum 半导体与能源专题、NIST、SEMI、供应链与制造业媒体抓取的内容），不联网搜索
enabled: true
keywords:
- 制造业
- 产业链
- 半导体
language: zh
schedule:
  type: manual
runtime:
  timeout_seconds: 1800
  skip_if_running: true
search: false
sources_limit: 10
sources:
- tag:industry
prompt: '为「一件东西怎样造」整理研究底稿。选择材料中能展开具体制造或协作过程的一件产品、部件或工艺，让观众理解它怎样形成可重复的交付。

  从这件东西要实现的用途建立主例子，沿原材料中的步骤写清输入、工具与操作、结构或状态怎样改变、怎样转交下一环节。保留工艺条件、可见特征、参与者分工、前后对照和实际例子，使作者能在同一产品上逐步解释。

  厂商、标准与产业关系在它承担的步骤中出现；数字解释当步的尺度和取舍，历史和相邻工艺帮助理解后接回主例子。底稿保留完整过程，作者自主组织讲述与节奏。

  沿同一产品保留工具作用的位置、材料和结构的前后状态；每项配套硬件解释它改变哪个动作，交接写清前道产出与后道怎样使用。生产时间和规模放在对应步骤里展开，背景备注留作作者取材，具体工序和重复交付过程充分保留。


  任务：{name}

  领域：{domain}

  关键词：{keywords}

  日期：{date}

  输出语言：{language}


  数据格式：Markdown；候选或解释单元以「### 2.1 名称」标识，内部以「####」保留完整操作和例子。素材链接放在对应段落，末尾「### 来源清单」继续记录链接。

  '
output: output/industry/{date}_industry_weekly.md
