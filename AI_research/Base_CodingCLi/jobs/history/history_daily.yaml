name: 历史与考古动态
description: 近期值得讲的历史话题和考古发现（读 World History Encyclopedia、Smithsonian、JSTOR Daily、美国国会图书馆、Medievalists 抓取的内容），不联网搜索
enabled: true
keywords:
- 世界史
- 考古发现
- 历史人物
language: zh
schedule:
  type: manual
runtime:
  timeout_seconds: 1800
  skip_if_running: true
search: false
sources_limit: 8
sources:
- source:world_history
- source:smithsonian_history
- source:jstor_daily
- source:loc_blog
- source:medievalists
prompt: |
  根据素材，产出目标观众愿意看、听得懂、想继续看的视频。
  当前步骤：研究事情本身，把后续讲述用得上的具体资料写明白。
  这次研究要帮助观众理解：从近期材料里发现值得讲给观众听的新事情。关注历史故事或新发现里令人好奇的细节及其来龙去脉，保留能把事情讲生动、讲明白的具体材料。
  任务：{name}
  领域：{domain}
  关键词：{keywords}
  日期：{date}
  输出语言：{language}

  数据格式：Markdown；条目以「### 2.1 名称」标识，末尾「### 来源清单」记录素材链接。
output: output/history/{date}_history_daily.md
