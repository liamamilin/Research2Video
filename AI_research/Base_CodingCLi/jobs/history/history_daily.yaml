name: 历史与考古动态
description: 近期值得讲的历史话题和考古发现（读 World History Encyclopedia、Smithsonian、JSTOR Daily、美国国会图书馆、Medievalists 抓取的内容），初稿沿用固定材料，选题后按问题补材
enabled: true
keywords:
- 世界史
- 考古发现
- 历史人物
language: zh
schedule:
  type: manual
runtime:
  timeout_seconds: 1800
  skip_if_running: true
search: false
sources_limit: 8
sources:
- source:world_history
- source:smithsonian_history
- source:jstor_daily
- source:loc_blog
- source:medievalists
- source:archaeology_mag
- source:history_blog
prompt: |
  为「回到那个现场」整理研究底稿。优先从已有材料选择能展开人物活动、带有物件或档案细节的一个历史现场。沿具体行动让普通观众认出人物的身份、目标与处境，保留工具、形制、图案、原话和完整例子。
  围绕材料中一件物件或一次具体行动，完整展开当时人的使用过程、工具、关系与处境。正文先让人物和活动成立，再把需要的背景贴在选择发生之处，沿动作解释用途和结果。新发现、入藏与现代纪念保留为研究背景和图像入口，主体篇幅留给过去的生活如何发生；保留具体例子、原话、物件细节与后续处境，研究备忘供作者构思。
  取材说明和相关背景完整留给作者构思，后续讲述沿人物行动与结果组织，结构和节奏由本期材料决定。
  任务：{name}
  领域：{domain}
  关键词：{keywords}
  日期：{date}
  输出语言：{language}
  数据格式：Markdown；候选或解释单元以「### 2.1 名称」标识，内部用「####」保留完整过程与例子。已有的档案、物件或图像页面链接贴在对应解释小节，供后续画面使用；末尾「### 来源清单」记录链接。
  选题与材料组织：历史：人物处境、制度选择与文明变化中的有趣问题，保留时代环境与事件过程，不强套现代职场或消费结论。
  选题分别考虑与观众切身相关的收益或损失、情绪动机、有趣的新发现和可带走的理解，不要求每题全部具备。优先在栏目范围内覆盖较广的共同问题，具体例子不等于整篇受众；专业问题保留真实适用范围，不伪装成人人适用。说明观看动机、新意与实际收获；商业关联可以较弱，不硬接购买、不预测转化。热度是辅助线索，不等于本题需求；不把多个维度合成总分。材料按需求线索、变化或事实材料、具体案例、比较或解释背景搭配，不必凑齐四类。
  候选按本轮值得制作的顺序排列，先说明共同问题，再保存能展开讲述的具体材料。保留原有字段和本栏目需要的操作、测试、实例或比较条件；不为扩大受众泛化专业内容。
  原有文稿风格、结构与口播安排交由下游作者；此步骤优化选什么和材料如何组织，不预写新的口播模板。
output: output/history/{date}_history_daily.md
content_strategy: audience-v1

# After initial research and audience-led selection; preserves the existing writer.
question_material: question-v1
