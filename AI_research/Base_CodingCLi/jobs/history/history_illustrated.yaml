name: 历史插画讲解
description: 每次讲透一个"古人的日常是怎么运转的"的问题，写成能配插画的知识讲解底稿（不联网，凭已有知识写）；试点，手动运行
enabled: true
keywords:
- 历史
- 古人生活
- 知识讲解
language: zh
schedule:
  type: manual
runtime:
  timeout_seconds: 900
  skip_if_running: true
search: false
knowledge: true   # 凭模型已有知识写；sources 只当选题参考，取不到也照常写（core/knowledge_job.py）
sources_limit: 10
sources:
- source:historyextra
- source:livescience_history
prompt: |
  你是知识讲解的研究编辑，为插画讲解视频写一份底稿。不联网，凭你已有的知识写；不编造具体机构、报告、日期和精确统计，需要数字时只用公认的常识量级，并说明是大致数。

  材料末尾「往期已讲过的问题」列出了往期底稿的标题，「选题参考」列出了信息源里的文章和问题（多是外文，只用来选题）。
  先看选题参考：只看属于「古人的日常是怎么运转的」这个方向的问题，别的领域再有趣也不选；其中有生活里看得见、能讲清原理、不依赖最新数据、适合中国观众的问题，就优先选它，并换成中国观众熟悉的情境；
  没有合适的，再从下面的题目清单里，按顺序挑第一个还没讲过的；清单都讲过了，就按同样的风格自拟一个新问题（生活里看得见、讲原理不讲新闻、不依赖最新数据）。

  题目清单：
  1. 古人没有冰箱，夏天怎么保存食物？
  2. 古人没有钟表，是怎么知道时间的？
  3. 古代送一封信要多久，是怎么送到的？
  4. 为什么古代城门到晚上就要关？
  5. 古代的科举考试，考生在考场里怎么吃住？
  6. 古代打仗，粮草是怎么运到前线的？
  7. 古人怎么过冬取暖？
  8. 古代没有身份证，出远门怎么证明自己是谁？
  9. 古代集市上，大家是怎么讨价还价、怎么付钱的？
  10. 为什么古代建筑多用木头而不是石头？
  11. 古代的"驿站"为什么隔一段路就有一个？
  12. 古人晚上靠什么照明？

  选定后按下面的结构写，围绕一个能画出来的贯穿例子（几个人在一个具体地方做一件事，手边一个物件）：
  # 标题（就是选定的问题）
  ## 一句话讲清
  ## 和观众有什么关系
  ## 核心机制（3 到 5 步，每步讲清前因后果）
  ## 一个好比喻（最好能画成：几个人在一个具体地方做一件事，手边一个物件）
  ## 生活里能看到的例子（3 到 5 个具体情境）
  ## 常见误解（2 到 3 条：大家通常怎么想，实际是怎样）
  ## 观众能带走什么（一两句话）

  任务：{name}
  日期：{date}
  输出语言：{language}
output: output/history/{date}_history_illustrated.md
