name: 历史专题周读
description: 每周挑一个历史主题讲清楚：发生了什么、怎么知道的、学者怎么看（读同上的历史类来源），不联网搜索
enabled: true
keywords:
- 世界史
- 考古发现
- 历史人物
language: zh
schedule:
  type: manual
runtime:
  timeout_seconds: 1800
  skip_if_running: true
search: false
sources_limit: 10
sources:
- source:world_history
- source:smithsonian_history
- source:jstor_daily
- source:loc_blog
- source:medievalists
prompt: '为「一个关键转折」整理研究底稿。围绕一个能展开前因、参与者选择、行动和后续变化的历史问题，从当时的一次具体处境进入。让普通观众认出人物身份和目标，沿相关事件与例子保留完整的解释深度。

  以一个具体历史变化为主问题，从转折前可理解的处境和行动进入，完整保留参与者目标、选择、相互影响与后续新状态。制度、资源、年代和地理关系贴在它影响的步骤，解释每一步怎样把原处境向前推进。现代展览、发现和纪念作为研究入口、图像来源与相关背景保留，历史正文沿当时的过程组织；研究备忘供作者构思，作者可以把深度用在具体推理、例子和变化上。

  取材说明和相关背景完整留给作者构思，后续讲述沿人物行动与结果组织，结构和节奏由本期材料决定。

  任务：{name}

  领域：{domain}

  关键词：{keywords}

  日期：{date}

  输出语言：{language}

  数据格式：Markdown；用「## 本期主问题：具体历史变化」组织本期的同一个解释问题，下面「### 2.1 名称」等单元展开相关处境、行动阶段与例子，内部用「####」保留完整过程。已有的档案、物件或图像页面链接贴在对应解释小节，供后续画面使用；末尾「###
  来源清单」记录链接。

  '
output: output/history/{date}_history_weekly.md
