name: 历史专题周读
description: 每周挑一个历史主题讲清楚：发生了什么、怎么知道的、学者怎么看（读同上的历史类来源），初稿沿用固定材料，选题后按问题补材
enabled: true
keywords:
- 世界史
- 考古发现
- 历史人物
language: zh
schedule:
  type: manual
runtime:
  timeout_seconds: 1800
  skip_if_running: true
search: false
sources_limit: 10
sources:
- source:world_history
- source:smithsonian_history
- source:jstor_daily
- source:loc_blog
- source:medievalists
- source:archaeology_mag
- source:history_blog
- source:public_domain_review
- source:aeon
prompt: |
  为「一个关键转折」整理研究底稿。围绕一个能展开前因、参与者选择、行动和后续变化的历史问题，可以结合当时的具体处境解释。让普通观众认出人物身份和目标，沿相关事件与例子保留完整的解释深度。
  以一个具体历史变化为主问题，可以结合转折前的处境和行动理解，完整保留参与者目标、选择、相互影响与后续新状态。制度、资源、年代和地理关系贴在它影响的步骤，说明相关因素怎样影响变化。现代展览、发现和纪念作为研究入口、图像来源与相关背景保留，历史正文沿当时的过程组织；研究备忘供作者构思，作者可以把深度用在具体推理、例子和变化上。
  取材说明和相关背景完整留给作者构思，人物行动与结果可为后续讲述提供线索，结构和节奏由本期材料决定。
  任务：{name}
  领域：{domain}
  关键词：{keywords}
  日期：{date}
  输出语言：{language}
  数据格式：Markdown；用「## 本期主问题：具体历史变化」组织本期的同一个解释问题，下面「### 2.1 名称」等单元展开相关处境、行动阶段与例子，内部用「####」保留完整过程。已有的档案、物件或图像页面链接贴在对应解释小节，供后续画面使用；末尾「### 来源清单」记录链接。
  选题与材料组织：历史：人物处境、制度选择与文明变化中的有趣问题，保留时代环境与事件过程，不强套现代职场或消费结论。
  选题分别考虑与观众切身相关的收益或损失、情绪动机、有趣的新发现和可带走的理解，不要求每题全部具备。优先在栏目范围内覆盖较广的共同问题，具体例子不等于整篇受众；专业问题保留真实适用范围，不伪装成人人适用。商业关联可以较弱，不硬接购买、不预测转化。热度是辅助线索，不等于本题需求；不把多个维度合成总分。材料按需求线索、变化或事实材料、具体案例、比较或解释背景搭配，不必凑齐四类。
  本期只选一个主问题，先判断为什么有人值得花时间理解它，再围绕它保留完整解释、原因、过程、案例及条件。不要为了覆盖面拆成新闻列表，也不把商业关联硬写成购买建议。
  原有文稿风格、结构与口播安排交由下游作者；此步骤优化选什么和材料如何组织，不预写新的口播模板。
output: output/history/{date}_history_weekly.md
content_strategy: audience-v1

# After initial research and audience-led selection; preserves the existing writer.
question_material: question-v1
