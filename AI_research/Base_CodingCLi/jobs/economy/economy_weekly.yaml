name: 宏观与数据周解读
description: 每周挑一个经济主题，用世界银行的数据和央行、研究机构的材料讲清楚（读世界银行指标、美联储、欧洲央行、BIS、Our World in Data 抓取的内容），不联网搜索
enabled: true
keywords:
- 宏观经济
- 央行政策
- 经济数据
language: zh
schedule:
  type: manual
runtime:
  timeout_seconds: 1800
  skip_if_running: true
search: false
sources_limit: 10
sources:
- source:fed_press
- source:ecb_press
- source:bis
- source:owid
- source:ft_home
- source:wb_gdp_growth
- source:wb_inflation
- source:wb_unemployment
prompt: |
  根据素材，产出目标观众愿意看、听得懂、想继续看的视频。
  当前步骤：研究事情本身，把后续讲述用得上的具体资料写明白。
  这次研究要帮助观众理解：回看这一周的材料，找到值得继续追问的变化和联系。关注经济变化如何传到企业和普通人的实际生活，保留能把事情讲生动、讲明白的具体材料。
  任务：{name}
  领域：{domain}
  关键词：{keywords}
  日期：{date}
  输出语言：{language}

  数据格式：Markdown；条目以「### 2.1 名称」标识，末尾「### 来源清单」记录素材链接。
output: output/economy/{date}_economy_weekly.md
