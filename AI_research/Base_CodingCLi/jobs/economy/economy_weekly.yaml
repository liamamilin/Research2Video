name: 宏观与数据周解读
description: 每周挑一个经济主题，用世界银行的数据和央行、研究机构的材料讲清楚（读世界银行指标、美联储、欧洲央行、BIS、Our World in Data
  抓取的内容），不联网搜索
enabled: true
keywords:
- 宏观经济
- 央行政策
- 经济数据
language: zh
schedule:
  type: manual
runtime:
  timeout_seconds: 1800
  skip_if_running: true
search: false
sources_limit: 10
sources:
- source:fed_press
- source:ecb_press
- source:bis
- source:owid
- source:ft_home
- source:wb_gdp_growth
- source:wb_inflation
- source:wb_unemployment
prompt: '为「一条经济机制」整理研究底稿。选择一个可以沿过程讲深的问题，尽早明确要追踪的同一笔钱、同一张报价或同一次交易，让它成为持续主例子。


  沿实际参与者的接手、付款与选择展开：谁需要得到什么，钱或商品从哪里到哪里，这一步的规则和成本怎样改变下一方的行动。把单据、报价或交易拆解到对应步骤，保留材料中的具体过程、比较条件、数据含义、时间范围和结果，每层机制都让主交易前进一步。


  历史背景、分组调查、相邻渠道与其他国家用于解释主例子当前的一步，再接回这笔钱的去向、承担者与最终选择。保留完整研究解释与原始过程，取材备忘作为作者背景；结尾连起主路径，简洁说明一个相近用途，标题和讲述节奏由作者决定。


  任务：{name}

  领域：{domain}

  关键词：{keywords}

  日期：{date}

  输出语言：{language}


  数据格式：Markdown；候选或相关解释单元以「### 2.1 名称」标识，内部可用「####」保留完整过程与例子。素材链接放在对应段落，末尾「### 来源清单」继续记录链接。

  '
output: output/economy/{date}_economy_weekly.md
