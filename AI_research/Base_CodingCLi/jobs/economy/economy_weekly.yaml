name: 宏观与数据周解读
description: 每周挑一个经济主题，用世界银行的数据和央行、研究机构的材料讲清楚（读世界银行指标、美联储、欧洲央行、BIS、Our World in Data 抓取的内容），不联网搜索
domain: 财经与经济
enabled: true
keywords:
- 宏观经济
- 央行政策
- 经济数据
language: zh
schedule:
  type: manual
runtime:
  timeout_seconds: 1800
  skip_if_running: true
search: false
sources_limit: 10
sources:
- source:fed_press
- source:ecb_press
- source:bis
- source:owid
- source:ft_home
- source:wb_gdp_growth
- source:wb_inflation
- source:wb_unemployment
- source:stats_cn_release
- source:pbc_news
- source:bls_latest
- source:ny_fed_liberty
- source:boe_news
- source:boj_news
- source:mof_cn
- source:economist_world
- source:marginal_revolution
prompt: |
  为「一条经济机制」整理研究底稿。选择一个可以沿过程讲深的问题，具体资金流、报价或交易可用来解释相关机制，按材料选择有帮助的例子。

  沿实际参与者的接手、付款与选择展开：谁需要得到什么，钱或商品从哪里到哪里，这一步的规则和成本怎样改变下一方的行动。把单据、报价或交易拆解到对应步骤，保留材料中的具体过程、比较条件、数据含义、时间范围和结果，具体交易可帮助说明不同机制的作用。

  历史背景、分组调查、相邻渠道与其他国家的情况可帮助解释机制及其差异，可结合钱的去向、承担者与最终选择理解。保留完整研究解释与原始过程，取材备忘作为作者背景；有帮助时可以联系相近用途，标题和讲述节奏由作者决定。

  任务：{name}
  领域：{domain}
  关键词：{keywords}
  日期：{date}
  输出语言：{language}

  数据格式：Markdown；候选或相关解释单元以「### 2.1 名称」标识，内部可用「####」保留完整过程与例子。素材链接放在对应段落，末尾「### 来源清单」继续记录链接。
  选题与材料组织：经济：价格、收入、就业与生活选择背后的机制，保留数据条件和传导过程，不把宏观变化写成个人投资建议。
  选题分别考虑与观众切身相关的收益或损失、情绪动机、有趣的新发现和可带走的理解，不要求每题全部具备。优先在栏目范围内覆盖较广的共同问题，具体例子不等于整篇受众；专业问题保留真实适用范围，不伪装成人人适用。商业关联可以较弱，不硬接购买、不预测转化。热度是辅助线索，不等于本题需求；不把多个维度合成总分。材料按需求线索、变化或事实材料、具体案例、比较或解释背景搭配，不必凑齐四类。
  本期只选一个主问题，先判断为什么有人值得花时间理解它，再围绕它保留完整解释、原因、过程、案例及条件。不要为了覆盖面拆成新闻列表，也不把商业关联硬写成购买建议。
  原有文稿风格、结构与口播安排交由下游作者；此步骤优化选什么和材料如何组织，不预写新的口播模板。
output: output/economy/{date}_economy_weekly.md
audience_channel: economy_weekly
content_strategy: audience-v1
question_material: question-v1
