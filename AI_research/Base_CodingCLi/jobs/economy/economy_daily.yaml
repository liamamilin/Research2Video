name: 全球经济日报
description: 每天值得关注的经济消息：央行、政策、数据与研究（读美联储、欧洲央行、BIS、Our World in Data、FT 抓取的内容），初稿沿用固定材料，选题后按问题补材
domain: 财经与经济
enabled: true
keywords:
- 宏观经济
- 央行政策
- 经济数据
language: zh
schedule:
  type: manual
runtime:
  timeout_seconds: 1800
  skip_if_running: true
search: false
sources_limit: 8
sources:
- source:fed_press
- source:ecb_press
- source:bis
- source:owid
- source:ft_home
- source:stats_cn_release
- source:pbc_news
- source:bls_latest
- source:boe_news
- source:boj_news
- source:marginal_revolution
prompt: |
  为「变化怎样传到你」整理研究底稿。观众希望理解一处经济变化怎样经过具体环节，影响一次生活选择或一笔生意。

  从近期材料保留不同家庭或经营场景的问题候选；同一机构的相近调查可以作为同一个问题的材料，让候选呈现不同的生活或经营收获。解释单元可以结合家庭、企业、账单、订单或资金展开，写清变化先落到谁、他怎样选择、下一方的成本或行动又怎样改变。

  保留材料中的具体对象、操作、时间、数字含义、选择的过程和结果，例子有助于理解时可以充分展开。政策和调查数据贴着它解释的当步关系，背景总量、跨国对照与分组统计在帮助理解当前问题时简洁进入，并结合实际场景理解。取材备忘与相关解释分别保留，给作者完整的过程、例子和解释深度，标题与视频节奏由作者组织。

  任务：{name}
  领域：{domain}
  关键词：{keywords}
  日期：{date}
  输出语言：{language}

  数据格式：Markdown；候选或相关解释单元以「### 2.1 名称」标识，内部可用「####」保留完整过程与例子。素材链接放在对应段落，末尾「### 来源清单」继续记录链接。
  选题与材料组织：经济：价格、收入、就业与生活选择背后的机制，保留数据条件和传导过程，不把宏观变化写成个人投资建议。
  选题分别考虑与观众切身相关的收益或损失、情绪动机、有趣的新发现和可带走的理解，不要求每题全部具备。优先在栏目范围内覆盖较广的共同问题，具体例子不等于整篇受众；专业问题保留真实适用范围，不伪装成人人适用。商业关联可以较弱，不硬接购买、不预测转化。热度是辅助线索，不等于本题需求；不把多个维度合成总分。材料按需求线索、变化或事实材料、具体案例、比较或解释背景搭配，不必凑齐四类。
  候选按本轮值得制作的顺序排列，先说明共同问题，再保存能展开讲述的具体材料。保留原有字段和本栏目需要的操作、测试、实例或比较条件；不为扩大受众泛化专业内容。
  原有文稿风格、结构与口播安排交由下游作者；此步骤优化选什么和材料如何组织，不预写新的口播模板。
output: output/economy/{date}_economy_daily.md
audience_channel: economy_daily
content_strategy: audience-v1
question_material: question-v1
