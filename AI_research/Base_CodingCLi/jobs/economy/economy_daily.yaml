name: 全球经济日报
description: 每天值得关注的经济消息：央行、政策、数据与研究（读美联储、欧洲央行、BIS、Our World in Data、FT 抓取的内容），不联网搜索
enabled: true
keywords:
- 宏观经济
- 央行政策
- 经济数据
language: zh
schedule:
  type: manual
runtime:
  timeout_seconds: 1800
  skip_if_running: true
search: false
sources_limit: 8
sources:
- source:fed_press
- source:ecb_press
- source:bis
- source:owid
- source:ft_home
prompt: '为「变化怎样传到你」整理研究底稿。观众希望理解一处经济变化怎样经过具体环节，影响一次生活选择或一笔生意。


  从近期材料保留不同家庭或经营场景的问题候选；同一机构的相近调查可以作为同一个问题的材料，让候选呈现不同的生活或经营收获。每个解释单元沿一个家庭、一家企业、一张账单、订单或资金展开，写清变化先落到谁、他怎样选择、下一方的成本或行动又怎样改变。


  保留材料中的具体对象、操作、时间、数字含义、选择的过程和结果，主例子逐步推进。政策和调查数据贴着它解释的当步关系，背景总量、跨国对照与分组统计在帮助理解当前问题时简洁进入，再接回原场景。取材备忘与相关解释分别保留，给作者完整的过程、例子和解释深度，标题与视频节奏由作者组织。


  任务：{name}

  领域：{domain}

  关键词：{keywords}

  日期：{date}

  输出语言：{language}


  数据格式：Markdown；候选或相关解释单元以「### 2.1 名称」标识，内部可用「####」保留完整过程与例子。素材链接放在对应段落，末尾「### 来源清单」继续记录链接。

  '
output: output/economy/{date}_economy_daily.md
