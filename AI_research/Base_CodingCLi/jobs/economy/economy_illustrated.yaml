name: 财经插画讲解
description: 每次讲透一个和钱、价格、生意有关的"为什么"，写成能配插画的知识讲解底稿（初稿凭已有知识写，之后按问题补充例子与解释；英国央行知识库和经济学问答只作选题参考）
enabled: true
keywords:
- 生活经济学
- 价格原理
- 知识讲解
language: zh
schedule:
  type: manual
runtime:
  timeout_seconds: 900
  skip_if_running: true
search: false
knowledge: true   # 凭模型已有知识写；sources 只当选题参考，取不到也照常写（core/knowledge_job.py）
sources_limit: 10
sources:
- source:boe_knowledge_bank
- source:economics_se
prompt: |
  你是知识讲解的研究编辑，为插画讲解视频写一份底稿。不联网，凭你已有的知识写；不编造具体机构、报告、日期和精确统计，需要数字时只用公认的常识量级，并说明是大致数。

  材料末尾「往期已讲过的问题」列出了往期底稿的标题，「选题参考」列出了信息源里观众真实提出的问题。
  先看选题参考：有生活里看得见、能讲清原理、不依赖最新数据、适合中国观众的问题，就优先选它，并换成中国观众熟悉的情境；
  没有合适的，再从下面的题目清单里，按观众关联、趣味与理解价值挑一个还没讲过的；清单都讲过了，就按同样的风格自拟一个新问题（生活里看得见、讲原理不讲新闻、不依赖最新数据）。

  题目清单：
  1. 同样一杯奶茶，为什么在不同地方、不同时间价格不一样？
  2. 超市为什么总把鸡蛋、牛奶放在最里面？
  3. 为什么"第二件半价"比直接打七五折更常见？
  4. 外卖平台的满减，钱到底是谁出的？
  5. 为什么机票越临近起飞越贵，有时又突然便宜？
  6. 存款利率降了，为什么房贷利率不一定马上跟着降？
  7. 为什么一家店开在人多的地方反而更容易亏？
  8. 会员卡、储值卡，商家为什么愿意先给你优惠？
  9. 为什么水果丰收了，果农反而可能赚得更少？
  10. 为什么同一款手机，刚上市和半年后价格差这么多？
  11. 分期免息，商家和平台怎么赚钱？
  12. 为什么房租涨了，楼下小店的菜价也会悄悄变？
  13. 为什么大家都说"通胀"，但有的东西反而越来越便宜？
  14. 为什么打车高峰期会加价，加价真的能叫来更多车吗？
  15. 为什么奶茶店、咖啡店总在推新品？
  16. 为什么批发比零售便宜，零售店还活得下去？

  选定后按下面的结构写，围绕一个能画出来的贯穿例子（几个人在一个具体地方做一件事，手边一个物件）：
  # 标题（就是选定的问题）
  ## 一句话讲清
  ## 和观众有什么关系
  ## 核心机制（3 到 5 步，每步讲清前因后果）
  ## 一个好比喻（最好能画成：几个人在一个具体地方做一件事，手边一个物件）
  ## 生活里能看到的例子（3 到 5 个具体情境）
  ## 常见误解（2 到 3 条：大家通常怎么想，实际是怎样）
  ## 观众能带走什么（一两句话）

  任务：{name}
  日期：{date}
  输出语言：{language}
  选题与材料组织：经济：价格、收入、就业与生活选择背后的机制，保留数据条件和传导过程，不把宏观变化写成个人投资建议。
  选题分别考虑与观众切身相关的收益或损失、情绪动机、有趣的新发现和可带走的理解，不要求每题全部具备。优先在栏目范围内覆盖较广的共同问题，具体例子不等于整篇受众；专业问题保留真实适用范围，不伪装成人人适用。说明观看动机、新意与实际收获；商业关联可以较弱，不硬接购买、不预测转化。热度是辅助线索，不等于本题需求；不把多个维度合成总分。材料按需求线索、变化或事实材料、具体案例、比较或解释背景搭配，不必凑齐四类。
  保持本栏已有知识写作方式：只选一个未讲过的问题，保留原有标题、机制、类比和生活例子结构；来源标题仅作选题参考，不改称已读取的研究证据。选择共同可感的疑问或有趣的反差，例子帮助理解，不把例中人的职业或身份变成适用前提。
  原有文稿风格、结构与口播安排交由下游作者；此步骤优化选什么和材料如何组织，不预写新的口播模板。
output: output/economy/{date}_economy_illustrated.md
content_strategy: audience-v1

# After initial research and audience-led selection; preserves the existing writer.
question_material: question-v1
