  # 苹果手机怎么下载chatgpt？

  之前写过一篇完整版教程，感兴趣的可以先看那篇👉

  如何安卓手机使用chatgpt?

  这篇单独把苹果的部分拆出来，写得更细一些，照着做就行。苹果还是比较简单的。

  ## 先确认两个前置条件

  1.是需要稳定的网络环境，ChatGPT 在国内无法直接访问。

  2. 是需要一个 OpenAI 账号，现在注册门槛很低，一个 Gmail 或 Outlook 邮箱就能搞定，不需要手机号验证。

  ## 一、苹果用户怎么装

  苹果用户最常见的问题是：A pp Store 里搜「ChatGPT」，要么搜不到，要么搜到了但显示「不可用」。

  原因很简单，ChatGPT 没有上架中国区 App Store。所以你需要一个非中国区的 Apple ID。

  这个注册也比较简单，如果实在是没有，那就去某鱼或某宝弄一个，价格比较实惠，下载好了之后再登陆自己的账号就行。

  ### 具体步骤

  1. 打开「设置」→ 点击顶部你的头像 → 滑到底部 → 退出当前 Apple ID

  1. 用一个非中国区的 Apple ID 登录（美区、日区、港区都可以）
  2. 打开 App Store，搜索「ChatGPT」
  3. 认准开发者是 OpenAI 的那个（注意别下到山寨版），点击获取
  4. 下载完成后打开，登录你的 OpenAI 账号，搞定

  > 小提示： 如果你没有海外 Apple ID，可以在知乎搜索「注册美区 Apple ID」，有大量详细教程。注册过程免费，也不需要海外手机号。

  我看很多人对ChatGPT升级比较感兴趣，这里补充一下。

  目前主要的是三种方法。

  国内用户订阅的常见障碍是没有国际信用卡，这里说几种可行的方式：

  Apple Gift Card：在电商平台购买苹果礼品卡，充值后在 App 内直接订阅，操作比较简单，因为你已经弄到美区的Apple ID了。

  wildAI：国内最大的第三方订阅平台，支持 ChatGPT Plus 和 Pro，最大的优点是不需要提供 OpenAI 账号密码，安全性比较高，支付方式对国内用户也更友好。

  还有一种方法，就是自己通过google Play去订阅，但是这种方法，苹果用户应该是用不着，所以就没有过多介绍。

