  # 现在的AI工具那么多，你是怎么筛选出适合自己那款的？

  我目前使用的主要有三种。

  1、豆包

  ①用豆包最多是在这个春天里。出门就是拍照，不懂就问豆包，了解清楚开始写，写完再出去拍照。基本上就是流水线作业，闭环拉满，幸福感满满。

  在这个春天里，有豆包，不但看到花花草草，也认识它们是谁，不一样的春天因为有豆包。

  AI这么火，大家都用AI在做什么呢？有什么值得用AI做？

  ②当然用豆包解锁其它功能，以前我想摘抄书里某一段话，我是边看边敲进去，很浪费时间。

  那天无意中发现豆包有提取图中文字的功能，这下子就方便多了。

  目前看一本书，某一段文字很有意思，就在目录上做个笔记。写的时候，查查目录，翻到对应的那一页，拍照提取文字。这不，就很方便了。

  提取图中文字

  ③我尝试用豆包制作视频，目前在试用阶段，就不班门弄斧。

  2、deepseek（深度求索）

  开始写知乎用的很多，会参考他的观点，后来发现会有依赖性，而且写出来的内容思维模式大差不差，没有新的观点。

  有段时间就没有用，会多看看书。

  但是最近发现可以巧用。比如说一些新的名词，还有专业术语我第一次见。我会查deepseek，但是我还是会研究下子，转换自己方式来表达。

  这就如我们读书时候，一些定义性的东西可以借鉴，理解透，最后还是转换自己理解的方式来做题，举一反三，融会贯通。

  3、最后必须是知乎直答

  写的过程中卡壳了，会请教知乎直答；回答结构不紧凑，也会请教知乎直答。在和知乎直答沟通中，自己也知道哪儿不足，当然也有慢慢提升。

  还有知乎直答的妙语连篇，幽默风趣。每一次互动，我都佩服直答脑洞大开，忍俊不禁。

  现在的AI工具那么多，先要去用，用着就会知道哪些适合自己那款，使用起来才会得心应手。

  这种“工具互补”的逻辑，就像“穿新鞋”合脚的标准不是哪一个，而是能否解决当下的具体问题。工具的价值，永远在使用者的主动组合里。当然这一切前提要使用。

