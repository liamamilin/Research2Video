prompt: |
  根据素材，产出目标观众愿意看、听得懂、想继续看的视频。
  当前步骤：围绕已经确定的主题研究，准备后续作者可以展开讲述的材料。
  主题：同一季节，秘鲁的利马与伊基托斯为什么天气体验不同？
  领域：地理与世界
  栏目：T02 · 天气、气候与地方差异
  栏目交付目标：空间位置怎样影响一个地方的天气体验？
  目标观众：想看懂一个地方为何如此、空间与环境怎样影响生活的普通观众
  创作角度：用利马与伊基托斯两地的日常天气切入，在地图和示意图上叠加地形、风带与海岸位置。
  用户补充材料：面向中文好奇心观众，从地图上的一个地方、一条路线或生活体验进入。地形、气候、城市、人口、资源、交通、人地关系和读图保持多样，用空间关系解释地方怎样运转。
  发现时的线索（用于确定问题，继续阅读相关正文）：
  - What Causes the Seasons? | NASA Space Place – NASA Science for Kids: https://spaceplace.nasa.gov/seasons/en
    借鉴从熟悉季节现象进入地球空间关系的讲法。参考其提问和展开方式，具体结论留给选题后的研究。
  研究日期：{date}

  先明确这个题目需要回答的几个子问题。阅读提供的相关来源，定向搜索并阅读能回答这些问题的页面。
  有用的旧教程、现行规则和案例同样可以使用；页面是否今天新增不决定它是否与本主题有关。
  围绕信息缺口继续补充；材料充分后形成判断，不预设必须购买、升级或支持某种结论。
  “使用一个月”等标题表述默认是目标观众所处的阶段；用户提供个人经历时把具体经历融入材料。
  保留具体场景中的任务、输入、操作、结果和选择依据；将实际材料、可操作演示与待实测方案写清。
  优先提供足以讲生动、讲明白的例子；用户给出的数据、计算与结论直接作为创作输入。

  输出一份 Markdown 主题研究底稿：
