prompt: |
  根据素材，产出目标观众愿意看、听得懂、想继续看的视频。
  当前步骤：围绕已经确定的主题研究，准备后续作者可以展开讲述的材料。
  主题：通过 iPhone App Store 订阅了 ChatGPT Plus，怎样取消自动续费并确认状态？
  领域：ChatGPT 产品使用、应用价值与订阅决策
  栏目：T07 · 订阅与支付
  栏目交付目标：想订阅，怎么完成？
  目标观众：已通过 iPhone 订阅 ChatGPT Plus、需要管理续费的中文用户
  创作角度：用同一份会议原始记录，展示纪要和待办清单如何一步步整理出来。
  用户补充材料：以下为本视频专用的虚构演示材料，请明确以示例呈现，用同一份会议记录贯穿输入、操作和结果。
  场景：一个团队周一开会安排产品体验活动。
  原始记录：小林说报名页还缺活动时间和地址，周二18点前补齐；小陈提醒讲师还没确认，先由小周今天联系，周三中午前给答复；预算暂按3000元做方案，场地报价尚未收到，不应写成已经批准。主持人最后说，本周五16点再碰一次，看报名页、讲师和场地三个事项进展。报名人数还没有数据。
  预期成果：先给一段简洁会议纪要，再做一张“任务、负责人、截止时间、当前状态、待确认事项”的表。明确小林负责报名页，小周负责联系讲师；场地负责人和报价均待确认，不替会议补齐未说过的信息。
  讲述重点：为什么原始记录要保留；如何在输入里说明输出格式；逐步展示从杂乱记录到纪要、再到待办表；最后用确认问题处理缺失信息。展示的演示材料已经给定，不必寻找真实公司的会议记录，不编造亲身实测经历。画面应持续使用同一组人物和任务，并逐项突出负责人和截止时间。
  发现时的线索（用于确定问题，继续阅读相关正文）：
  - Canceling your ChatGPT subscription: https://help.openai.com/en/articles/7232927-canceling-your-chatgpt-subscription
    官方帮助按不同购买入口组织取消订阅说明。借鉴先识别入口、再给操作路径的讲述方式。
  研究日期：{date}

  先明确这个题目需要回答的几个子问题。阅读提供的相关来源，定向搜索并阅读能回答这些问题的页面。
  有用的旧教程、现行规则和案例同样可以使用；页面是否今天新增不决定它是否与本主题有关。
  围绕信息缺口继续补充；材料充分后形成判断，不预设必须购买、升级或支持某种结论。
  “使用一个月”等标题表述默认是目标观众所处的阶段；用户提供个人经历时把具体经历融入材料。
  保留具体场景中的任务、输入、操作、结果和选择依据；将实际材料、可操作演示与待实测方案写清。
  优先提供足以讲生动、讲明白的例子；用户给出的数据、计算与结论直接作为创作输入。

  输出一份 Markdown 主题研究底稿：
  # 主题标题
  ## 要回答的问题与主要判断
  ## 观众场景与具体材料
  ## 问题逐项展开（每个问题的具体资料、例子、机制和适用条件）
  ## 可用于讲述的操作与结果
  ## 画面材料（页面链接、展示区域、对应讲述内容、输入与输出的演示建议）
  ## 原始材料中值得保留的细节
  ## 来源清单
  这是一份题目已经确定的研究底稿，不再生成多个候选选题。后续作者可以自主组织讲述顺序。
