prompt: |-
  你是一名技术研究员，为一位制作 AI / 软件类知识视频的创作者做选题调研。你的报告会被写成一篇约 6 分钟的口播文稿，文稿里的每个事实都要能追溯到你引用的网页，所以每个关键判断都要给出原始网址。

  ## 选题
  - 标题：缓存前缀纪律：一个时间戳就能让 90% 的折扣失效
  - 核心角度：**前缀稳定性 > 压缩率 > 模型选择**——这是本期单位经济性变化带来的优先级翻转
  - 目标受众：所有高频调用长系统提示词的开发者；R/Python 用户做的定时批处理流水线
  - 为什么有人在乎：Anthropic 文档明确 prompt caching 按 **tools → system → messages** 顺序对请求前缀做哈希，命中要求前缀与近期请求**逐字节一致**，直到缓存断点（2026-09-22 随 Opus 5.5 开放的会话中途系统消息/工具变更 beta，窗口边界项，https://platform.claude.com/docs/en/build-with-claude/mid-conversation-system-messages ）；OpenAI 同期发布 GPT-6 的提示缓存改进（2026-09-22，窗口边界项，https://openai.com/index/better-prompt-caching-for-gpt-6 ）。而缓存读取 vs 正常输入价的差距达到 10–20 倍（Sonnet 5.5：$0.20 vs $2；Opus 5.5：$0.20 vs $4，https://platform.claude.com/docs/en/models/sonnet-5-5/overview ）。
  - 建议大纲：① 缓存哈希三段结构 → ② 六大前缀污染源（时间戳、随机排序、动态 ID、目录树快照、会话状态、工具列表顺序）→ ③ 重构后账单对照 → ④ 代码片段：缓存断点放置与逐字节一致性自检

  ## 任务
  围绕这个选题做深度调研：先直接回答它要回答的问题，再给出支撑证据、反方证据和仍未确定的部分。证据以 {date_7d_ago} 至 {date} 的信息为主；更早的关键资料可以用，但要注明原始日期。
  输出语言：{language}。

  ## 证据规则
  1. 每个关键判断附来源网址和发布日期。优先官方文档、发布说明、代码仓库、论文、定价页等一手来源；媒体和社区帖子只作补充。
  2. 网址必须是你实际检索到的真实页面，禁止编造、猜测或拼接网址；不确定就不写。
  3. 核心结论尽量由两个相互独立的来源支撑；只有厂商自己的说法时，标注「厂商自述，未独立验证」。
  4. 给出反方证据或失败案例；确实找不到时写明「未找到反方证据」。
  5. 区分「已证实」「有迹象」「推测」，不把推测写成事实。
  6. 数字（价格、版本号、日期、比例）照来源原样写，注明口径。

  ## 输出结构
  ### 1. 直接回答
  ### 2. 关键事实（表格：事实 | 置信度 | 来源编号）
  ### 3. 争议与反方证据
  ### 4. 仍未确定的问题
  ### 5. 适合视频的讲述角度（不超过 3 条）
  ### 6. 来源清单
  编号列表，每行一个来源：编号. 标题 | 一手/二手 | 发布日期 | 完整网址
