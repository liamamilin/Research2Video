  主题：从下单到送达，宜家的一张家具订单要经过什么？
  领域：商业与公司
  栏目：T06 · 运营与交付
  栏目交付目标：公司怎样把一次需求稳定变成一份交付？
  目标观众：关注产品、经营和竞争，希望理解公司为何这样做的普通观众与经营者
  创作角度：用订单时间线展示货物从仓库到顾客家的节点，标注等待和安装环节。
  用户补充材料：面向关注商业的中文观众，从一家公司、一项产品或一次经营动作进入。各分类保持多样，用顾客、收入、成本和协作的具体关系讲清公司怎样运转。
  发现时的线索（用于确定问题，继续阅读相关正文）：
  - Toyota Production System | Vision & Philosophy | Company | Toyota Motor Corporation Official Global Website: https://global.toyota/en/company/vision-and-philosophy/production-system
    围绕生产现场讲清准时化、发现问题与协作方式之间的关系。参考其提问和展开方式，具体结论留给选题后的研究。
  研究日期：{date}

  先明确这个题目需要回答的几个子问题。阅读提供的相关来源，定向搜索并阅读能回答这些问题的页面。
  有用的旧教程、现行规则和案例同样可以使用；页面是否今天新增不决定它是否与本主题有关。
  围绕信息缺口继续补充；材料充分后形成判断，不预设必须购买、升级或支持某种结论。
  “使用一个月”等标题表述默认是目标观众所处的阶段；用户提供个人经历时把具体经历融入材料。
  保留具体场景中的任务、输入、操作、结果和选择依据；将实际材料、可操作演示与待实测方案写清。
  优先提供足以讲生动、讲明白的例子；用户给出的数据、计算与结论直接作为创作输入。

  输出一份 Markdown 主题研究底稿：
