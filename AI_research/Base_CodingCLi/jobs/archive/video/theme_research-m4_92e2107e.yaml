  主题：看懂《货郎图》，为什么可以先看货担上的物件排列？
  领域：文化与艺术
  栏目：T01 · 读懂一件作品
  栏目交付目标：作品的哪些细节让表达变得可见？
  目标观众：愿意走近作品，希望看懂表达、创作与文化来路的普通观众
  创作角度：以货担上的物件为入口，追踪人物视线与画面空间，落到市井交易的表达。
  用户补充材料：面向对作品和文化好奇的中文观众，先让观众看见一件作品、一个动作或一处细节，再展开形式、创作与时代关系。中外材料都可借鉴，题目保持对象和表达方式的多样性。
  发现时的线索（用于确定问题，继续阅读相关正文）：
  - Understanding Formal Analysis (Education at the Getty): https://www.getty.edu/education/teachers/classroom_resources/formal_analysis.html
    从可见细节、构图和视觉元素进入对一件作品的理解。参考其提问和展开方式，具体结论留给选题后的研究。
  - 张择端清明上河图卷 - 故宫博物院: https://www.dpm.org.cn/collection/paint/228226.html
    从长卷的具体人物、场景和空间细节进入作品与日常生活。参考其提问和展开方式，具体结论留给选题后的研究。
