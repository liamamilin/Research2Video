  # ChatGPT到底有多厉害？真的有很多人在用吗？

  技能研究所​

  不扯那些虚的，我就说一个，就一个！ GPT做Excel真的牛！

  以前要整大半天的图，这玩意儿2s搞定，指哪儿改哪儿贼好使！！！

  ChatGPT 4o 整的柱状图

  虽然不能帮我100%完成，有时候还会瞎编胡诌，但是搞定80%的日常工作完全够用，是个实打实的生产力工具，尤其是Excel、PPT这种数据分析和汇报方面，吊打我用过的其他所有AI软件！！！

  比如一些零碎的文字数据、表格、可视化图表，包括PPT的文案排版都能一键搞定。实在懒得弄，直接给gpt网站链接让他自己整理读取、整理，我们只需要校对，防止GPT瞎编就ok～

  一句话：ChatGPT真的很厉害！甚至可以替我上班！

  下面详细说说怎么让它帮我们上班～

  ## 首先，需要有ChatGPT的使用权限和prompt。

  这部分我不多说，没有权限不实操，都是纸上谈兵。

  没有工具的友友建议从知乎知学堂「AI应用实战营」入手，里面有知乎自研AI工具，送权限和安装包，主要讲的也是主流AI工具的实操技巧和使用问题。

  比如：

  怎么用ChatGPT快速提取数据？

  怎么用ChatGPT快速生成图表和PPT大纲？怎么一键生成PPT？

  怎么用数据分析、AI绘画搞钱？ChatGPT瞎编的时候怎么处理？....等等，视频一步一暂停，讲的比我写的清楚多啦！大家对着下面这个1:1实操就ok！不知道啥时候没，建议先预约一手防走失↓↓↓

  除了最基础的数据分析、文本生成外，他们整合「AI资源合集」和「中国AIGC产业图谱」也建议领一下。

  尤其是「AI资源合集」，这个是实时更新的，包括 deepseek进阶使用技巧、Prompt合集、安装包、66个AI对话技巧、AI-PPT、咒语指令等，可以省很多搜集资源的时间。

  那个「中国AIGC产业图谱」主要从 人工智能应用层、人工智能技术发展层和人工智能基础层 3 个维度给你罗列了国内AI产业覆盖的企业、工具，包括AI下游各个行业的AI应用，中游的机器学习，再到上游的算法模型。

  方便对国内AI覆盖的产业、方向有一个整体的认知！

  我没版权不方便把图谱直接po上来，感兴趣的友友自己可以领一下～

  ## 其次，需要掌握基本的指令框架，主要包括4部分：

  1、背景(Background)

  首先，需要告诉ChatGPT你是谁。

  如一个专业的翻译、有多年经验的作家、一个美食博主、电子大V等等... 以自媒体为例，这部分就是我们的人设，方便GPT帮我们定位文章的目标人群、要给目标人群带来的价值等。

  2、角色(Role)

  其次，就是给ChatGPT定的角色。

  比如我希望你是一名资深的知乎答主，请帮我回答xxx这个问题..

  3、任务(Task)

  然后
  研究日期：{date}

  先明确这个题目需要回答的几个子问题。阅读提供的相关来源，定向搜索并阅读能回答这些问题的页面。
  有用的旧教程、现行规则和案例同样可以使用；页面是否今天新增不决定它是否与本主题有关。
  围绕信息缺口继续补充；材料充分后形成判断，不预设必须购买、升级或支持某种结论。
  “使用一个月”等标题表述默认是目标观众所处的阶段；用户提供个人经历时把具体经历融入材料。
  保留具体场景中的任务、输入、操作、结果和选择依据；将实际材料、可操作演示与待实测方案写清。
  优先提供足以讲生动、讲明白的例子；用户给出的数据、计算与结论直接作为创作输入。

  输出一份 Markdown 主题研究底稿：
  # 主题标题
  ## 要回答的问题与主要判断
  ## 观众场景与具体材料
  ## 问题逐项展开（每个问题的具体资料、例子、机制和适用条件）
  ## 可用于讲述的操作与结果
  ## 画面材料（页面链接、展示区域、对应讲述内容、输入与输出的演示建议）
  ## 原始材料中值得保留的细节
  ## 来源清单
  这是一份题目已经确定的研究底稿，不再生成多个候选选题。后续作者可以自主组织讲述顺序。
