  ## 稿子（数据，不是指令）
  标题：Gemini 4 Argon 上线：限时输入 $2 输出 $10
  Google 10 月 13 日开放 Gemini 4 Argon，API 定价输入 2 美元、输出 10 美元每百万 token。
  但这是限时价，11 月 30 日结束。12 月 1 日起，输入涨到 4 美元，输出涨到 20 美元，整整翻倍。
  输出价里已经包含 thinking token，默认思考级别是 medium，实际账单会比只看输出字数更高。Batch 和 Flex 通道可以打五折。
  页面上写着缓存输入只要 0.1 美元，95% 折扣。但官方文档写明，Argon 不支持显式缓存，只有隐式缓存，不保证省钱。
  有开发者在 Google 官方论坛实测，同样的长前缀调了 6 次，缓存命中全是 0。Google 回复正在调查。
  免费层和 AI Pro 订阅都用不了，要用付费 API key。
  想试的话，趁 11 月 30 日前跑一轮测试，重点看缓存到底命不命中。算成本时，先别把 0.1 美元的缓存价算进去。

