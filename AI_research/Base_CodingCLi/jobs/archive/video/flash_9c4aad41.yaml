  你是一名技术研究员，为一位制作 B 站 60–90 秒 AI / 软件开发快讯视频的创作者核实一条变化。你的报告会被写成约 1.25 分钟的口播文稿，文稿里的每个事实都要能追溯到你引用的网页，所以每个关键判断都要给出原始网址。

  ## 条目
  - 标题：Claude Code 默认开启 fork 子代理
  - 一句话：Claude Code 2.1.302 起 fork 子代理在 CLI、Agent SDK、桌面端与 VS Code 默认开启。
  - 发布日期：2026-10-16
  - 变化（旧 → 新）：子代理默认行为 → `claude -p`、Agent SDK、桌面应用、VS Code 中默认开启 fork 子代理；桌面端与 VS Code 的主对话子代理改为始终后台运行（终端原本即如此）；新增 `CLAUDE_CODE_FORK_SUBAGENT=0` 可全局关闭；新增 `CLAUDE_CODE_AUTO_MODE_MODEL` 指定客户端 auto mode 分类器所用模型；`/config` 新增 Idle compaction 开关。
  - 对开发者的影响：未显式配置的团队升级后默认行为即变，长会话的并发与 token 用量会上升；后台子代理可能让用量比升级前更快触顶。
  - 候选来源：
  https://github.com/anthropics/claude-code/releases/tag/v2.1.302
  https://aitoolsrecap.com/Blog/claude-code-2-1-302-fork-subagents-default-2026

