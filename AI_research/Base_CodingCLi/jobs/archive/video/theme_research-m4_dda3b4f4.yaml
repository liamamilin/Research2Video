  主题：ChatGPT 的“Work 模式”和普通聊天有什么不同？从整理本地文件到生成文档，普通人该在哪个入口用
  领域：ChatGPT 产品使用、应用价值与订阅决策
  栏目：T09 · 产品动态与热点
  栏目交付目标：ChatGPT 最近有什么变化？
  目标观众：中文 ChatGPT 新用户、职场与学习人群、潜在付费用户
  创作角度：展示网页、桌面和手机入口差异，用一个整理资料并生成文档的任务演示；说明本地文件访问权限主要在桌面端，套餐与开放范围以官方页面为准。
  用户补充材料：
  发现时的线索（用于确定问题，继续阅读相关正文）：
  - OpenAI 大更新: 一隻視頻看懂 ChatGPT Work + GPT-5.6 所有核心功能，Claude 最大對手來了！: https://www.youtube.com/watch?v=aZgvDDJmUCs
    OpenAI最近推出了它們有史以來 最大的更新之一 叫做ChatGPT Work工作助手 同時還發布了三個新模型 Sol、Terra和Luna 這次更新把ChatGPT從一個回答問題的助手 變成了一個能自主完成任務的智能代理 而且它是專門給AI新手設計的 你可以用大白話告訴它 你想完成的工作 給它一個目標 它就能連接各種工具 給我們創建文檔 搭建網站 或者生成最終成品 甚至還能幫我們把這個任務自動化 而且我們可以在不同的平台調用它 不管是網頁 桌面應用 還是手機App上都可以 對於絕大多數ChatGPT用戶來說 這是個非常重要的升級 所以今天這期视频 我會通過幾個實際案例演示 詳細給你介紹ChatGPT Work的所有核心功能 教你怎麼把ChatGPT Work 和它的模型組合起來做事 還有怎麼把Claude Cowork裡的Skills 轉移到ChatGPT Work 所以如果你平時是ChatGPT 或者Claude的用戶 但你擔心遇到Claude封號問題的話 今天這期视频對你肯定非常有用 那我們話不多說馬上開始 首先什麼是ChatGPT Work呢？ 簡單來說 ChatGPT Work就是把ChatGPT和Codex 這兩個工具的功能結合起來 方便非技術用戶也能上手的一個AI工具 它除了能和我們聊天 給我們創建內容外 它其實還能做很多其它事情 比如訪問我們電腦上的文件 在後台進行思考 獲取所有需要的上下文 然後直接幫我們做完一個任務 它在整理信息 處理數據 生成網頁端應用上 表現得特別出色 甚至你現在還可以直接用它託管網站了 你可以把它理解成是OpenAI推出來 用來對標Claude Cowork的工具 我們現在可以在三個平台上調用ChatGPT Work 分別是網頁 桌面應用和手機App 網頁和手機都是在雲端進行的 也就是ChatGPT Work沒法訪問我們本地的文件夾 在我錄製這期视频的時候 暫時只有桌面端App 才有訪問本地文件夾的權限 這也意味著 只要在我們允許的情況下 ChatGPT Work可以幫你整理和創建本地文件 操作你的電腦和瀏覽器 不過雖然桌面應用端的功能最強大 但我今天也會把網頁和手機端 給大家介紹一下怎麼用 方便你選擇適合自己的工作方式 那我們先來看看網頁端 現在當你打開ChatGPT 最上面你能看到左邊是聊天 右邊就是Work工作按鈕 當你選擇它後我們能看到 這裡有我們平時用的對話框 然後它允許我們在特定项目裡工作 我們還能看到所有的插件、連接器 也就是我們想要連接的各種應用 然後在模型這裡 我們可以選擇 它們當前最強大的模型Sol 5.6 具體這幾個模型有什麼區別 我一會就告訴你 接下來我們還能在手機App裡用這個功能 就像你現在看到的一樣 當我們打開ChatGPT的時候 頂部會顯示聊天模式 點擊它就可以切換到工作模式 你在這
  研究日期：{date}

  先明确这个题目需要回答的几个子问题。阅读提供的相关来源，定向搜索并阅读能回答这些问题的页面。
  有用的旧教程、现行规则和案例同样可以使用；页面是否今天新增不决定它是否与本主题有关。
  围绕信息缺口继续补充；材料充分后形成判断，不预设必须购买、升级或支持某种结论。
  “使用一个月”等标题表述默认是目标观众所处的阶段；用户提供个人经历时把具体经历融入材料。
  保留具体场景中的任务、输入、操作、结果和选择依据；将实际材料、可操作演示与待实测方案写清。
  优先提供足以讲生动、讲明白的例子；用户给出的数据、计算与结论直接作为创作输入。

