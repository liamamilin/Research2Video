      const snap=cp(c), id='run-'+(++db.seq), prior=db.runs.find(x=>x.id===data.reportRun)||db.runs.find(x=>x.id==='real-1117');const rr={id,chain:c.id,name:c.name,origin:'原型模拟',label:'演练批次 '+(db.runs.filter(x=>x.chain===c.id).length+1),phase:'queued',scenario:data.scenario,revision:c.version,snap,researchCount:data.reuse||data.scenario==='duplicate'?0:1,researchAttempts:0,report:data.reuse?prior.report:'demo-report-'+id,window:data.reuse?prior.window:windowText(c),products:[],cancelled:false,reuse:data.reuse,allowPaused:c.paused,flowVersion:data.flowVersion||1};db.runs.unshift(rr);ui.run=id;ui.page='run';}
    if(op==='advance'){

        active(r.snap).filter(o=>o.enabled).forEach(o=>{const live=current?.outputs.find(x=>x.id===o.id);if(!live||live.removed||!live.enabled||current.deleted||(current.paused&&!r.allowPaused))return;const count=o.kind==='episode'?1:r.snap.kind==='flash'?Math.min(5,o.limit):Math.min(2,o.limit);for(let n=0;n<count;n++){const index=r.snap.kind==='flash'?(o.kind==='episode'?0:n+1):ix;const e=effective(r.snap,o);r.products.push({id:r.id+'-p'+ix++,branch:o.id,index,stage:r.flowVersion===2?'写稿中':'制作中',attempts:[{v:o.version,...e,status:r.flowVersion===2?'写稿中':'制作中',mode:'本批设置'}]});}});r.phase=r.products.length?(r.flowVersion===2?'writing':'render'):'done';
      }else if(r.phase==='writing'){r.products.forEach(p=>{p.stage='制作中';p.attempts.at(-1).status='制作中';});r.phase='render';}else if(r.phase==='render'){r.products.forEach((p,i)=>{p.stage=r.scenario==='mixed'&&i===r.products.length-1?'失败':'完成';p.attempts.at(-1).status=p.stage;});r.phase='done';}

  function runView(){const r=run();if(!r)return empty('未找到批次');const c=db.chains.find(x=>x.id===r.chain);const done=r.products.filter(p=>p.stage==='完成').length;return `<div class="pc-stack"><div class="pc-between"><div class="pc-heading"><p class="pc-kicker">${esc(r.origin)} · ${esc(r.label)}</p><h1>${esc(r.name)}</h1><p>${status(r)} · ${done}/${r.products.length} 条视频完成</p></div><div class="pc-row">${c&&!c.deleted?btn('返回链路','open-chain',c.id):btn('全部运行记录','nav','history')}${running(r)&&r.phase!=='cancelling'?btn('取消本次','cancel-dialog'):''}</div></div>${notice(r.origin==='真实记录快照'?'以下是实际批次的记录快照；重试或新版本仅在原型中演练。':'原型演练结果，不调用外部研究、补材或视频服务。')}${meta([['本批规则','链路 v'+r.revision+' · 启动时冻结；当前链路'+(c?.deleted?'已删除':' v'+c?.version)],['材料窗口',r.window],['研究执行',r.researchCount===0?(r.scenario==='duplicate'?'去重跳过；本批未研究或制作':'复用已有报告；本批未重新研究'):r.researchCount+' 次研究 / '+r.researchAttempts+' 次尝试'],['报告身份',(['queued','research','failed','empty'].includes(r.phase)||(['cancelled','cancelling'].includes(r.phase)&&!r.products.length))&&!r.reuse?'尚无报告':esc(r.report)],['独立服务','共享来源发现与积累不随本批取消']])}${running(r)?`<div class="pc-notice pc-between"><span>${{queued:'等待调度接收',research:'读取材料并研究',planning:'报告就绪，准备接续启用输出',writing:'为每条产物分别写稿；完成后自动进入视频制作',render:'每条视频独立制作',cancelling:'等待执行器返回取消结果'}[r.phase]}</span>${btn(r.phase==='cancelling'?'接收取消结果':'推进模拟执行','advance','',true)}</div>`:''}${r.phase==='failed'?`<div class="pc-notice pc-warning">研究中止：补材搜索服务额度不足（HTTP 402）。没有创建视频。<p>先在服务设置中处理额度；原型可模拟恢复后继续。</p></div>${btn('模拟服务恢复并重试研究','retry-research','',true)}`:''}${r.phase==='empty'?notice('本时段没有可用的新内容。研究已结束，没有创建空白视频，等待下一时段。'):''}${r.phase==='skipped'?notice('同一报告与输出已处理，本次去重跳过；不重复研究或制作。'):''}${['planning','writing','render','done'].includes(r.phase)?details('查看材料与输出分配',allocation(r)):''}${r.phase==='done'&&r.products.length===0?notice('报告已保留。当前没有可接续的输出（可能暂停或移除）；不会重复提交。'):''}<div class="pc-stack">${r.products.map(p=>productCard(r,p,c)).join('')}</div></div>`;}

  function productCard(r,p,c){const a=p.attempts.at(-1),o=r.snap.outputs.find(x=>x.id===p.branch),live=c?.outputs.find(x=>x.id===p.branch&&!x.removed);return `<section class="pc-output" aria-label="${esc(productTitle(r,p))}"><div class="pc-between"><div><p class="pc-kicker">${esc(o?.name||'视频输出')} · ${p.stage}</p><h3>${esc(productTitle(r,p))}</h3></div>${tag('尝试 '+p.attempts.length)}</div><p class="pc-muted">研究报告 → ${p.stage==='写稿中'?'讲稿编写中':'讲稿已就绪'} → ${esc(p.stage)} · ${o?.duration==='content'?'按内容定时长':'目标约 '+(o?.duration||'—')+' 分钟'}</p><p class="pc-muted">输出设置 v${a.v} · ${a.speed} 倍 · ${esc(a.voice)} · ${esc(a.form)}</p>${p.stage==='失败'?notice('视频制作失败（模拟服务异常），讲稿已保留。只重试此视频，不重跑研究。'):''}<div class="pc-row">${p.stage==='失败'?btn('按原请求重试此视频','retry-product',p.id,true):''}${p.stage==='完成'&&live&&!c.deleted?btn('按当前设置生成新版本','new-version',p.id):''}</div>${details('版本与执行记录',p.attempts.map((v,i)=>`<p>尝试 ${i+1} · ${v.status} · 输出规则 v${v.v} · ${v.speed} 倍 · ${esc(v.mode)}</p>`).join(''))}</section>`;}

  function render(){root.innerHTML=`<header class="pc-top"><div class="pc-brand"><span class="pc-logo">研</span>研映</div><nav class="pc-topnav" aria-label="主导航">${[['list','我的链路'],['history','作品与运行记录'],['resources','共享来源与研究']].map(([k,s])=>`<button class="cursor-interaction" data-action="nav" data-id="${k}" aria-current="${ui.page===k?'page':'false'}">${s}</button>`).join('')}</nav><span class="pc-muted">可交互原型 · 模拟数据</span></header><main class="pc-main pc-stack"><div role="status" class="pc-toast">${esc(toast)}</div>${error?`<div role="alert" class="pc-error">${esc(error)}</div>`:''}${ui.dialog?dialog():ui.page==='list'?list():ui.page==='detail'?detail():ui.page==='wizard'?wizard():ui.page==='run'?runView():ui.page==='history'?history():resources()}</main><footer class="pc-footer"><span>信息源 → 共享研究 → 视频输出 → 每条作品</span><span>实际配置快照：2026-11-17 · 所有操作仅作用于原型</span></footer>`;}
  function read(){return Object.fromEntries([...root.querySelectorAll('[name]')].map(el=>[el.name,el.type==='checkbox'?el.checked:el.value]));}

    if(a==='edit-output'){ui.edit=cp(c.outputs.find(o=>o.id===id));ui.dialog={type:'output',output:id};}
    if(a==='save-output'){const f=read(),patch={name:f.outputName.trim(),speed:f.speed==='inherit'?null:+f.speed,voice:f.voice==='inherit'?null:f.voice,form:f.form==='inherit'?null:f.form,duration:f.duration};if(!patch.name)error='请填写输出名称。';if('limit'in f){Object.assign(patch,{limit:+f.limit,heat:+f.heat,angle:+f.angle});if(!Number.isInteger(patch.limit)||patch.limit<1||patch.limit>20||patch.heat<0||patch.angle<0)error='单条上限需为 1–20 的整数，阈值不能为负。';}if(!error){dispatch('output',{chain:c.id,output:ui.dialog.output,patch});ui.dialog=null;toast='仅此输出已更新；另一输出与旧批次不变。';}}
    if(a==='toggle-output'){const o=c.outputs.find(x=>x.id===id);dispatch('output',{chain:c.id,output:id,patch:{enabled:!o.enabled}});toast=o.enabled?'此输出恢复接续新报告；不自动补做旧批次。':'此输出已暂停；研究及其他输出继续，已提交视频继续。';}
    if(a==='run-dialog')ui.dialog={type:'run'};
    if(a==='start'){const f=read();if(f.startMode.startsWith('report:')&&['research-fail','empty'].includes(f.scenario)){error='复用报告不执行研究，请选择视频成功或失败场景。';}else{dispatch('start',{chain:c.id,scenario:f.scenario,reuse:f.startMode.startsWith('report:'),reportRun:f.startMode.slice(7),flowVersion:2});ui.dialog=null;}}
    if(a==='open-run'){ui.run=id;ui.chain=db.runs.find(x=>x.id===id).chain;ui.page='run';ui.dialog=null;}
    if(a==='advance')dispatch('advance',{run:r.id});
    if(a==='retry-research')dispatch('retry-research',{run:r.id});
    if(a==='retry-product'){dispatch('retry-product',{run:r.id,product:id,latest:false});toast='仅失败视频已按原请求重试；研究和其他作品未重跑。';}
    if(a==='new-version')ui.dialog={type:'new-version',product:id};
    if(a==='confirm-version'){dispatch('retry-product',{run:r.id,product:ui.dialog.product,latest:true});ui.dialog=null;toast='此视频新增版本，旧版本保留。';}
    if(a==='pause-dialog')ui.dialog={type:'pause'};
    if(a==='confirm-pause'){dispatch('pause',{chain:c.id,paused:!c.paused});ui.dialog=null;toast=c.paused?'本链已暂停；共享服务和已提交任务继续。':'已恢复；按计划的错过时段策略执行。';}
    if(a==='cancel-dialog')ui.dialog={type:'cancel'};
    if(a==='confirm-cancel'){dispatch('cancel',{run:r.id});ui.dialog=null;}
    if(a==='delete-output')ui.dialog={type:'delete-output',output:id};
    if(a==='delete-chain')ui.dialog={type:'delete-chain'};
    if(a==='confirm-delete'){if(ui.dialog.type==='delete-chain')dispatch('delete',{chain:c.id});else{dispatch('output',{chain:c.id,output:ui.dialog.output,patch:{removed:true,enabled:false}});ui.tab='overview';}ui.dialog=null;toast='配置已移除，历史与共享资源保留。';}
    if(a==='add-output')ui.dialog={type:'add-output'};
    if(a==='confirm-add-output'){dispatch('add-output',{chain:c.id,kind:id});ui.dialog=null;ui.tab='overview';}
    if(a==='close-dialog'){ui.dialog=null;ui.edit=null;}
    render();save();
  });
  function restore(state){if(![6,7].includes(state?.privateContent?.schema))return;const p=state.privateContent.schema===7?JSON.parse(unpack(state.privateContent.data)):state.privateContent;db=seed();events=[];for(const event of p.events||[]){dispatch(event.op,event.data,false);events.push(event);}ui={...ui,...p.ui};if(ui.page==='wizard'&&!ui.draft)ui.page='list';}
  restore(window.openai?.widgetState);render();
  window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState&&JSON.stringify(e.detail.globals.widgetState.privateContent)!==savedSignature){restore(e.detail.globals.widgetState);render();}});
})();
</script>
