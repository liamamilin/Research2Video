&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {

  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;

   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {

      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {

          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))

      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);

      modelContent: null,
      privateContent: null,
      ...parsedState,

      const files = parse(fileElement.textContent);
      fileElement.remove();
      const blobs = new Map();
      const urls = [];
      for (const [name, binding] of Object.entries(bindings)) {

      get bindings() {
        return bindings;
      },
      /** @param {string} name @param {(value: unknown) =&gt; void} callback */
      onData(name, callback) {
        if (typeof callback !== &quot;function&quot;) {

        return () =&gt; {};

  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      ...connectorGlobals,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {

      }),

  };

    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);

              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */

              if (typeof id !== &quot;number&quot;) {

              }

  function branchView(c){const o=c.outputs.find(x=&gt;x.id===ui.branch&amp;&amp;!x.removed);if(!o)return empty(&#x27;该输出已移除&#x27;);const e=effective(c,o);return `&lt;div class=&quot;pc-between&quot;&gt;&lt;div&gt;&lt;h2&gt;${esc(o.name)}&lt;/h2&gt;&lt;p class=&quot;pc-muted&quot;&gt;${esc(o.id)} · 规则 v${o.version} · ${o.enabled?&#x27;自动接续&#x27;:&#x27;暂停接续&#x27;}&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;pc-row&quot;&gt;${btn(&#x27;修改此输出&#x27;,&#x27;edit-output&#x27;,o.id)}${btn(o.enabled?&#x27;暂停此输出&#x27;:&#x27;恢复此输出&#x27;,&#x27;toggle-output&#x27;,o.id)}&lt;/div&gt;&lt;/div&gt;${meta([[&#x27;使用的研究&#x27;,esc(c.research)],[&#x27;内容分配&#x27;,o.kind===&#x27;episode&#x27;?&#x27;报告候选与报告外材料 → 1 条合集&#x27;:`候选中按选题策略选取，最多 ${o.limit} 条独立视频`],[&#x27;视频速度&#x27;,e.speed+&#x27; 倍 · &#x27;+(o.speed===null?&#x27;继承矩阵默认&#x27;:&#x27;本输出覆盖&#x27;)],[&#x27;声音&#x27;,esc(e.voice)+&#x27; · &#x27;+(o.voice===null?&#x27;继承配方&#x27;:&#x27;本输出覆盖&#x27;)],[&#x27;画面形式&#x27;,esc(e.form)+&#x27; · &#x27;+(o.form===null?&#x27;继承配方&#x27;:&#x27;本输出覆盖&#x27;)],[&#x27;时长&#x27;,o.duration===&#x27;content&#x27;?&#x27;由内容决定&#x27;:&#x27;约 &#x27;+o.duration+&#x27; 分钟&#x27;],[&#x27;生效范围&#x27;,&#x27;新批次采用当前值；既有批次保持启动快照&#x27;]])}${details(&#x27;配置来源与分配规则&#x27;,meta([[&#x27;矩阵默认速度&#x27;,c.defaults.speed+&#x27; 倍&#x27;],[&#x27;栏目&#x27;,o.kind===&#x27;episode&#x27;&amp;&amp;c.kind===&#x27;flash&#x27;?&#x27;AI Flash（合集模式）&#x27;:&#x27;无独立栏目覆盖&#x27;],[&#x27;配方&#x27;,&#x27;flash-nr · information_motion · voxcpm_anchor&#x27;],[&#x27;生产覆盖&#x27;,o.speed===null&amp;&amp;o.voice===null&amp;&amp;o.form===null?&#x27;无&#x27;:JSON.stringify({speed:o.speed,voice:o.voice,form:o.form})],[&#x27;选题阈值&#x27;,o.kind===&#x27;each&#x27;?`热度 ${o.heat} / 角度 ${o.angle}`:&#x27;合集整体安排&#x27;],[&#x27;关联清理&#x27;,&#x27;移除此输出时解除栏目/联合规划引用；保留另一输出和研究。&#x27;]]))}${btn(&#x27;删除此输出&#x27;,&#x27;delete-output&#x27;,o.id)}`;}
  function scheduleForm(c){return `&lt;div class=&quot;pc-stack&quot;&gt;${select(&#x27;运行方式&#x27;,&#x27;mode&#x27;,c.schedule.mode,[[&#x27;manual&#x27;,&#x27;仅手动&#x27;],[&#x27;daily&#x27;,&#x27;每天&#x27;],[&#x27;weekly&#x27;,&#x27;每周&#x27;]])}${c.schedule.mode===&#x27;weekly&#x27;?select(&#x27;星期&#x27;,&#x27;day&#x27;,c.schedule.day,[[1,&#x27;星期一&#x27;],[2,&#x27;星期二&#x27;],[3,&#x27;星期三&#x27;],[4,&#x27;星期四&#x27;],[5,&#x27;星期五&#x27;],[6,&#x27;星期六&#x27;],[0,&#x27;星期日&#x27;]]):&#x27;&#x27;}${c.schedule.mode!==&#x27;manual&#x27;?`&lt;div class=&quot;pc-stack-sm&quot;&gt;${c.schedule.times.map((t,i)=&gt;`&lt;div class=&quot;pc-time-row&quot;&gt;${field(&#x27;时间 &#x27;+(i+1),&#x27;time&#x27;+i,t,&#x27;time&#x27;)}${btn(&#x27;移除时间&#x27;,&#x27;remove-time&#x27;,i,false,c.schedule.times.length===1)}&lt;/div&gt;`).join(&#x27;&#x27;)}${btn(&#x27;添加运行时间&#x27;,&#x27;add-time&#x27;)}&lt;p class=&quot;pc-muted&quot;&gt;Asia/Shanghai · 无需填写 cron&lt;/p&gt;&lt;/div&gt;`:&#x27;&#x27;}${select(&#x27;采集窗口&#x27;,&#x27;window&#x27;,c.schedule.window,[[&#x27;previous_slot&#x27;,&#x27;相邻计划时段（首次手动默认最近 24 小时）&#x27;],[&#x27;24h&#x27;,&#x27;最近 24 小时&#x27;],[&#x27;7d&#x27;,&#x27;最近 7 天&#x27;]])}${details(&#x27;错过时段与失败处理&#x27;,`${select(&#x27;错过时段&#x27;,&#x27;missed&#x27;,c.schedule.missed,[[&#x27;skip&#x27;,&#x27;跳过，等下一时段&#x27;],[&#x27;latest&#x27;,&#x27;仅补最近一时段&#x27;]])}${select(&#x27;研究失败自动重试次数&#x27;,&#x27;retries&#x27;,c.schedule.retries,[[0,&#x27;不自动重试&#x27;],[1,&#x27;1 次&#x27;],[2,&#x27;2 次&#x27;]])}`)}&lt;/div&gt;`;}

  function runViewBase(){const r=run();if(!r)return empty(&#x27;未找到批次&#x27;);const c=db.chains.find(x=&gt;x.id===r.chain);const done=r.products.filter(p=&gt;p.stage===&#x27;完成&#x27;).length;return `&lt;div class=&quot;pc-stack&quot;&gt;&lt;div class=&quot;pc-between&quot;&gt;&lt;div class=&quot;pc-heading&quot;&gt;&lt;p class=&quot;pc-kicker&quot;&gt;${esc(r.origin)} · ${esc(r.label)}&lt;/p&gt;&lt;h1&gt;${esc(r.name)}&lt;/h1&gt;&lt;p&gt;${status(r)} · ${done}/${r.products.length} 条视频完成&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;pc-row&quot;&gt;${c&amp;&amp;!c.deleted?btn(&#x27;返回链路&#x27;,&#x27;open-chain&#x27;,c.id):btn(&#x27;全部运行记录&#x27;,&#x27;nav&#x27;,&#x27;history&#x27;)}${running(r)&amp;&amp;r.phase!==&#x27;cancelling&#x27;?btn(&#x27;取消本次&#x27;,&#x27;cancel-dialog&#x27;):&#x27;&#x27;}&lt;/div&gt;&lt;/div&gt;${notice(r.origin===&#x27;真实记录快照&#x27;?&#x27;以下是实际批次的记录快照；重试或新版本仅在原型中演练。&#x27;:&#x27;原型演练结果，不调用外部研究、补材或视频服务。&#x27;)}${meta([[&#x27;本批规则&#x27;,&#x27;链路 v&#x27;+r.revision+&#x27; · 启动时冻结；当前链路&#x27;+(c?.deleted?&#x27;已删除&#x27;:&#x27; v&#x27;+c?.version)],[&#x27;材料窗口&#x27;,r.window],[&#x27;研究执行&#x27;,r.researchCount===0?(r.scenario===&#x27;duplicate&#x27;?&#x27;去重跳过；本批未研究或制作&#x27;:&#x27;复用已有报告；本批未重新研究&#x27;):r.researchCount+&#x27; 次研究 / &#x27;+r.researchAttempts+&#x27; 次尝试&#x27;],[&#x27;报告身份&#x27;,([&#x27;queued&#x27;,&#x27;research&#x27;,&#x27;failed&#x27;,&#x27;empty&#x27;].includes(r.phase)||([&#x27;cancelled&#x27;,&#x27;cancelling&#x27;].includes(r.phase)&amp;&amp;!r.products.length))&amp;&amp;!r.reuse?&#x27;尚无报告&#x27;:esc(r.report)],[&#x27;独立服务&#x27;,&#x27;共享来源发现与积累不随本批取消&#x27;]])}${running(r)?`&lt;div class=&quot;pc-notice pc-between&quot;&gt;&lt;span&gt;${{queued:&#x27;等待调度接收&#x27;,research:&#x27;读取材料并研究&#x27;,planning:&#x27;报告就绪，准备接续启用输出&#x27;,writing:&#x27;为每条产物分别写稿；完成后自动进入视频制作&#x27;,render:&#x27;每条视频独立制作&#x27;,cancelling:&#x27;等待执行器返回取消结果&#x27;}[r.phase]}&lt;/span&gt;${btn(r.phase===&#x27;cancelling&#x27;?&#x27;接收取消结果&#x27;:&#x27;推进模拟执行&#x27;,&#x27;advan   function allocation(r){if(r.snap.kind!==&#x27;flash&#x27;)return `&lt;p&gt;示例材料包 → 2 个候选 → 启用的合集 / 单条。数量仅用于演练分支与恢复，不代表来源真实产量。&lt;/p&gt;`;return `&lt;div class=&quot;pc-stack-sm&quot;&gt;${notice(&#x27;11/17 参考批次：报告 10 个候选 → 合集 16 项（含 6 项报告外原材料）＋5 条重点单条。以下保留参考分配；本次提交数量以本批视频记录为准，暂停或移除的输出不提交。&#x27;)}${F.items.map(it=&gt;`&lt;div class=&quot;pc-source&quot;&gt;&lt;div class=&quot;pc-data&quot;&gt;&lt;strong&gt;${esc(it.title.replace(/^\[([^\]]+)\]\([^)]+\)/,&#x27;$1&#x27;))}&lt;/strong&gt;&lt;p class=&quot;pc-muted&quot;&gt;${it.id.includes(&#x27;flash-raw&#x27;)?&#x27;报告外原材料&#x27;:&#x27;报告候选&#x27;} · 进入合集${F.outputs.some(o=&gt;o.from===it.id)?&#x27;＋独立单条&#x27;:&#x27;&#x27;}&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}${details(&#x27;本批 65 个来源回执（历史快照，不随设置修改）&#x27;,`&lt;p class=&quot;pc-muted&quot;&gt;涉及不等于全部成功。部分来源读取失败时，研究仍可能完成。&lt;/p&gt;${F.receipt.map(s=&gt;`&lt;div class=&quot;pc-source pc-data&quot;&gt;&lt;div&gt;&lt;span&gt;${esc(s.spec)}&lt;/span&gt;&lt;p class=&quot;pc-muted&quot;&gt;${esc(s.coverage||&#x27;声明 / 自动来源&#x27;)} · 交付 ${s.delivered} 条${s.error?&#x27; · 部分读取失败&#x27;:&#x27;&#x27;}&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}`)}&lt;/div&gt;`;}
  function productCardBase(r,p,c){const a=p.attempts.at(-1),o=r.snap.outputs.find(x=&gt;x.id===p.branch),live=c?.outputs.find(x=&gt;x.id===p.branch&amp;&amp;!x.removed);return `&lt;section class=&quot;pc-output&quot; aria-label=&quot;${esc(productTitle(r,p))}&quot;&gt;&lt;div class=&quot;pc-between&quot;&gt;&lt;div&gt;&lt;p class=&quot;pc-kicker&quot;&gt;${esc(o?.name||&#x27;视频输出&#x27;)} · ${p.stage}&lt;/p&gt;&lt;h3&gt;${esc(productTitle(r,p))}&lt;/h3&gt;&lt;/div&gt;${tag(&#x27;尝试 &#x27;+p.attempts.length)}&lt;/div&gt;&lt;p class=&quot;pc-muted&quot;&gt;研究报告 → ${p.stage===&#x27;写稿中&#x27;?&#x27;讲稿编写中&#x27;:&#x27;讲稿已就绪&#x27;} → ${esc(p.stage)} · ${o?.duration===&#x27;content&#x27;?&#x27;按内容定时长&#x27;:&#x27;目标约 &#x27;+(o?.duration||&#x27;—&#x27;)+&#x27; 分钟&#x27;}&lt;/p&gt;&lt;p class=&quot;pc-muted&quot;&gt;输出设置 v${a.v} · ${a.speed} 倍 · ${esc(a.voice)} · ${esc(a.form)}&lt;/p&gt;${p.stage===&#x27;失败&#x27;?notice(&#x27;视频制作失败（模拟服务异常），讲稿已保留。只重试此视频，不重跑研究。&#x27;):&#x27;&#x27;}&lt;div class=&quot;pc-row&quot;&gt;${p.stage===&#x27;失败&#x27;?btn(&#x27;按原请求重试此视频&#x27;,&#x27;retry-product&#x27;,p.id,true):&#x27;&#x27;}${p.stage===&#x27;完成&#x27;&amp;&amp;live&amp;&amp;!c.deleted?btn(&#x27;按当前设置生成新版本&#x27;,&#x27;new-version&#x27;,p.id):&#x27;&#x27;}&lt;/div&gt;${details(&#x27;版本与执行记录&#x27;,p.attempts.map((v,i)=&gt;`&lt;p&gt;尝试 ${i+1} · ${v.status} · 输出规则 v${v.v} · ${v.speed} 倍 · ${esc(v.mode)}&lt;/p&gt;`).join(&#x27;&#x27;))}&lt;/section&gt;`;}

        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height !== "number" ||
        !Number.isFinite(height) ||
        height < 0
      ) {
        return;
      }
      if (height <= 10_000) {
        const width = isShare && storage != null ? frame.clientWidth : null;
        frame.style.height = Math.ceil(height) + "px";
        if (isShare && storage != null) {
          const size = JSON.stringify({
            fingerprint: sizeFingerprint,
            width,
            viewportHeight: globalThis.innerHeight,
            dark: globalThis.matchMedia("(prefers-color-scheme: dark)").matches,
            scale: globalThis.devicePixelRatio,
            height: Math.ceil(height),
          });
          if (size !== lastSize) {
            lastSize = size;
            pendingSize = size;
            globalThis.clearTimeout(sizeWriteTimeout);
            sizeWriteTimeout = globalThis.setTimeout(persistSize, 100);
          }
        }
      }
      if (isShare) {
        // Keep unusually tall content accessible without accepting an unbounded height.
        if (height > 10_000 && Number.parseFloat(frame.style.height) === 0) {
          frame.style.removeProperty("height");
        }
        frame.scrolling = height > 10_000 ? "auto" : "no";
        document.documentElement.classList.add("visualization-share-ready");
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!isShare && (!Number.isFinite(height) || height <= viewportHeight)) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  const frameHtml = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  if (isShare && storage != null) {
    // Fingerprint the rendered document, including restored widget state, without
    // storing its content. This is a layout cache, not a security identity.
    let hash = 5381;
    for (let index = 0; index < frameHtml.length; index += 1) {
      hash = (hash * 33 + frameHtml.charCodeAt(index)) % 4_294_967_296;
    }
    sizeFingerprint = hash.toString(36);
    try {
      const size = JSON.parse(storage.getItem(sizeStorageKey) ?? "null");
      if (
        size?.fingerprint === sizeFingerprint &&
        size.width === frame.clientWidth &&
        size.viewportHeight === globalThis.innerHeight &&
        size.dark ===
          globalThis.matchMedia("(prefers-color-scheme: dark)").matches &&
        size.scale === globalThis.devicePixelRatio &&
        typeof size.height === "number" &&
        Number.isFinite(size.height) &&
        size.height >= 0 &&
        size.height <= 10_000
      ) {
        frame.style.height = size.height + "px";
      }
    } catch {
      // Ignore missing or invalid cache entries and measure the live frame.
    }
  }
  frame.srcdoc = frameHtml;
  delete frame.dataset.srcdoc;
})();
