<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>真实链路 · 隔离检查</title>
<style>body{margin:0;background:#f5f6f8;color:#1b2737;font:15px/1.65 system-ui,sans-serif}main{max-width:1080px;margin:40px auto;padding:0 24px}h1{font-size:30px;margin:8px 0}h2{font-size:20px}p{color:#566170}.tag{color:#216756;font-weight:650}.banner{background:#fff5dc;border:1px solid #edddba;padding:16px;border-radius:12px}nav{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}button,a{font:inherit}button{background:white;border:1px solid #cdd6e1;padding:9px 16px;border-radius:8px;cursor:pointer}button[aria-pressed=true]{background:#173e69;color:white}a{color:#1c5d99}section{background:white;border:1px solid #e0e5ed;border-radius:12px;padding:22px;margin:18px 0}table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:10px;text-align:left;border-bottom:1px solid #edf0f4}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.6 ui-monospace,monospace;background:#f4f6f8;padding:12px;border-radius:8px}small{color:#637080}.row{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}.metrics{display:flex;gap:30px;flex-wrap:wrap}.metrics b{font-size:27px;display:block}.error{color:#9c3d27}details{margin:16px 0}summary{cursor:pointer;font-weight:600}@media(max-width:600px){main{margin:20px auto;padding:0 14px}section{padding:14px}table{display:block;overflow:auto}}
</style><main><span class="tag">REAL API / ISOLATED SNAPSHOT</span><h1>真实链路，逐项对照检查</h1><p>现有 Flash 链路与新建科研链路 · 2026-11-17</p><div class="banner">真实业务接口＋独立数据库副本。配置检查已结束并还原副本；未启动研究、写稿、渲染或发布。这里是检查工具，v9 交互原型仍未改为调用真实 API。</div><nav><button data-tab="existing" aria-pressed="true">现有链路</button><button data-tab="new">新链路创建</button><button data-tab="findings">跨页问题与证据</button><a href="/jobs">打开隔离应用</a></nav><div id="view" aria-live="polite">正在读取检查记录…</div></main>
<script>
let report,active='existing';const v=document.querySelector('#view');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const code=x=>'<pre>'+esc(JSON.stringify(x,null,2))+'</pre>';
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tab===active)));const s=report.summary;
if(active==='existing'){v.innerHTML=`<section><div class="row"><h2>AI Flash Discovery → 合集 / 单条</h2><button id="refresh">读取副本当前配置</button></div><small>${esc(s.job)} · ${esc(s.matrix)}</small><div class="metrics"><div><b>${s.productions.length}</b>共享 Job 的生产配置</div><div><b>${s.history.scripts}</b>讲稿记录</div><div><b>${s.history.renders}</b>渲染记录（不等于成功成片数）</div></div><p>研究周期：每天 07:30 / 18:30，Asia/Shanghai。停用两个输出不会同时停用共享研究计划。</p><table><thead><tr><th>输出</th><th>自动生产</th><th>内容模式</th></tr></thead><tbody>${s.productions.map(x=>`<tr><td>${esc(x.key)}<br><small>${esc(x.name)}</small></td><td>${x.auto?'开启':'关闭'}</td><td>${esc(x.content_mode)} / ${esc(x.split)}</td></tr>`).join('')}</tbody></table><div id="live"></div></section><section><h2>已经验证的修改</h2><p>来源保存与版本冲突、周期读写与版本冲突、输出与研究分别停用、矩阵默认值与输出覆盖、讲稿产生新版本并保留渲染记录。</p><p>检查后已恢复副本，以上不是生产环境变更。</p></section>`;document.querySelector('#refresh').onclick=async()=>{const area=document.querySelector('#live');area.textContent='读取真实副本接口…';try{const r=await fetch('/api/production?job=monitoring/ai_flash_discovery');const d=await r.json();area.innerHTML=r.ok?'<h3>实时读取成功 · HTTP '+r.status+'</h3><p>来自独立副本的真实 /api/production，读取 '+d.length+' 个生产配置。</p>'+code(d.map(x=>({key:x.key,auto:x.auto,content_mode:x.content_mode,errors:x.errors}))):'<p class="error">需要先在隔离应用登录。</p>';}catch(e){area.textContent=e.message;}};}
if(active==='new'){v.innerHTML=`<section><h2>科研链路：配置已创建，自动生产未验证</h2><p>真实接口返回 201：Job＋周期、矩阵、单条输出、合集输出、合集栏目。检查结束后这些测试对象已清理。</p>${code(s.new_chain)}<p>现有“复制矩阵”已能自动分配编号和创建 Job，但复制后视频输出为 0；这部分能力可以复用。</p><h3>创建过程中实际被卡住的地方</h3><ol><li>基础 Job 没有选题列表契约，写稿输出创建返回 422。</li><li>默认选题编号 F 与 Flash 冲突，需要独立编号 SCI。</li><li>Flash 配方只接受 flash 选题来源，科研 alias 不匹配；需另建绑定正确来源的配方。</li><li>输出叫“合集”仍是 individual，绑定内容栏目后才成为 episode。</li><li>两个输出不会自动组成联合规划，新矩阵也未纳入现有生产策略。</li></ol><p class="error">没有生成科研报告、文稿或视频，也没有证明新链路可自动运行到底。</p></section>`;}
if(active==='findings'){v.innerHTML=`<section><h2>${report.findings.length} 项差异 · ${report.requests} 次真实接口请求</h2><p>下列内容记录已复现结果，未修改正式代码。删除检查仅作用于副本。</p>${report.findings.map(f=>`<details><summary>${esc(f.id)} · ${esc(f.title)}</summary><p>${esc(f.impact)}</p>${code(f.evidence)}</details>`).join('')}</section><section><h2>边界</h2><p>生成与发布未执行；运行中状态来自历史数据库快照。为检查空闲时删除，曾在副本中将一条 running 记录置为 failed，随后还原；这不代表实际任务已结束。</p></section>`;}}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{active=b.dataset.tab;render()});fetch('/api/isolation/results').then(r=>r.json()).then(d=>{report=d;render()}).catch(e=>{v.textContent='服务不可用：'+e.message});
</script></html>
