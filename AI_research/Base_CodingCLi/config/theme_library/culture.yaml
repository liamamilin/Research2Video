# 2026-10-28：参考公开原始内容归纳问题结构；题型与讲述步骤为本矩阵编辑整理。
patterns:
- category: culture_works
  name: 从一处细节进入
  title_pattern: 看懂{作品}，为什么可以先看{具体细节}？
  outline:
  - 展示作品和具体细节
  - 引导视线沿画面移动
  - 连接形式与表达
  - 回到整件作品的观看
  examples: &id001
  - title: Understanding Formal Analysis (Education at the Getty)
    url: https://www.getty.edu/education/teachers/classroom_resources/formal_analysis.html
    summary: 从可见细节、构图和视觉元素进入对一件作品的理解。参考其提问和展开方式，具体结论留给选题后的研究。
  - &id009
    title: 张择端清明上河图卷 - 故宫博物院
    url: https://www.dpm.org.cn/collection/paint/228226.html
    summary: 从长卷的具体人物、场景和空间细节进入作品与日常生活。参考其提问和展开方式，具体结论留给选题后的研究。
- category: culture_works
  name: 观看路线
  title_pattern: 第一次看{作品}，沿什么顺序能读出画面关系？
  outline:
  - 展示作品和具体细节
  - 对照同一问题中的对象与选择
  - 引导视线沿画面移动
  - 连接形式与表达
  - 回到整件作品的观看
  examples: *id001
- category: culture_works
  name: 同一主题不同表达
  title_pattern: 同样表现{主题}，{作品A}和{作品B}怎样让人有不同感受？
  outline:
  - 展示作品和具体细节
  - 引导视线沿画面移动
  - 沿一个具体案例推进解释
  - 连接形式与表达
  - 回到整件作品的观看
  examples: *id001
- category: culture_techniques
  name: 一个技法的作用
  title_pattern: '{技法}在{作品}里实际改变了什么？'
  outline:
  - 聚焦一个可见效果
  - 展示材料与创作动作
  - 解释技法的具体作用
  - 放回作品整体表达
  examples: &id002
  - title: Vocabulary for Describing an Artwork
    url: https://www.getty.edu/education/k-12-learning/describe-listen-draw/vocabulary-for-describing-an-artwork
    summary: 用颜色、线条和形状等可见对象连接作品形式与观看感受。参考其提问和展开方式，具体结论留给选题后的研究。
  - &id007
    title: “后母戊”青铜方鼎_中国国家博物馆官方网站
    url: https://www.chnmuseum.cn/zp/zpml/kgfjp/202008/t20200824_247255.shtml
    summary: 从一件具体青铜器的形制、用途和制作理解文物表达。参考其提问和展开方式，具体结论留给选题后的研究。
- category: culture_techniques
  name: 材料影响表达
  title_pattern: 把{主题}交给{材料A}与{材料B}，表现方式怎样不同？
  outline:
