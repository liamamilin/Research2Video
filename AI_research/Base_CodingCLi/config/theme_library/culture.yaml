- category: culture_exchange
  name: 形式的旅行
  title_pattern: '{艺术形式}来到{地区}之后，哪些细节变了？'
  outline:
  - 选一个可见形式或符号
  - 沿地点与时代追踪
  - 对照保留和改变的细节
  - 解释交流中的新表达
  examples: &id004
  - title: Central and North Asia, 1000–1400 A.D. | Chronology | Heilbrunn Timeline of Art History | The Metropolitan
      Museum of Art
    url: https://www.metmuseum.org/it/toah/ht/07/nc
    summary: 结合时代与地区的作品线索观察文化相遇和形式流动。参考其提问和展开方式，具体结论留给选题后的研究。
  - title: About the Silk Roads | UNESCO
    url: https://www.unesco.org/en/silk-roads/about-silk-roads
    summary: 沿路线、商品和交流过程理解不同社会如何连接。参考其提问和展开方式，具体结论留给选题后的研究。
