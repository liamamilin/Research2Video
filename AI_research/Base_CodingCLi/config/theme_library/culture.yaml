  - 解释技法的具体作用
  - 放回作品整体表达
  examples: *id002
- category: culture_creators
  name: 创作的一次选择
  title_pattern: 创作{作品}时，{作者}为什么采用{表达选择}？
  outline:
  - 从一件具体作品进入
  - 还原创作处境和材料
  - 跟随表达选择
  - 回到作品给观众的感受
  examples: &id003
  - title: Vincent van Gogh. The Starry Night. Saint Rémy, June 1889 | MoMA
    url: https://www.moma.org/collection/works/79802
    summary: 从一件具体作品进入创作者的选择与画面表达。参考其提问和展开方式，具体结论留给选题后的研究。
- category: culture_creators
  name: 同一作者的变化
  title_pattern: 从{作品A}到{作品B}，{作者}的表达方式怎样变化？
  outline:
  - 从一件具体作品进入
  - 对照同一问题中的对象与选择
