# 2026-10-28：参考公开原始内容归纳问题结构；题型与讲述步骤为本矩阵编辑整理。
patterns:
- category: ai_flash
  name: 变化进入任务
  title_pattern: '{已发生的能力变化}之后，完成{任务}的哪一步不同了？'
  outline:
  - 说明已发生的具体变化
  - 还原原有用户任务
  - 对照新的操作和结果
  - 回到受影响的用户
  examples: &id001
  - title: Introducing the Model Context Protocol \ Anthropic
    url: https://www.anthropic.com/news/model-context-protocol
    summary: 从已发布的连接能力说明用户原有任务的哪一步发生变化；样本不是今天的新动态。参考其提问和展开方式，具体结论留给选题后的研究。
- category: ai_flash
  name: 新能力的入口
  title_pattern: '{新能力}接进原有{流程}，需要怎样使用？'
  outline:
  - 说明已发生的具体变化
  - 对照同一问题中的对象与选择
  - 还原原有用户任务
  - 对照新的操作和结果
  - 回到受影响的用户
  examples: *id001
- category: ai_flash
  name: 受影响的是谁
  title_pattern: 面对{已确认变化}，{使用者A}与{使用者B}需要分别注意哪种用法？
  outline:
  - 说明已发生的具体变化
  - 还原原有用户任务
  - 沿一个具体案例推进解释
  - 对照新的操作和结果
  - 回到受影响的用户
  examples: *id001
- category: ai_opensource
  name: 项目放进任务
  title_pattern: 用{开源项目}完成{具体任务}，输入到输出怎样走？
  outline:
  - 从一个实际输入进入
  - 展示项目处理的位置
  - 跟随关键操作与输出
  - 说明接进现有工作的方式
  examples: &id002
  - &id008
    title: 'GitHub - ml-explore/mlx-lm: Run LLMs with MLX · GitHub'
    url: https://github.com/ml-explore/mlx-lm
    summary: 从开源项目的实际输入、运行与输出理解它在本地任务中的作用。参考其提问和展开方式，具体结论留给选题后的研究。
- category: ai_opensource
  name: 替换一处环节
  title_pattern: 把现有流程的{步骤}换成{项目}，实际有什么不同？
  outline:
  - 从一个实际输入进入
