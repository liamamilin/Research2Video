- category: ai_model_review
  name: 任务决定选择
  title_pattern: 主要做{任务}，怎样比较{模型或档位}？
  outline:
  - 明确任务与相同输入
  - 选择影响决策的观察维度
  - 对照实际结果和使用过程
  - 按需求说明取舍
  examples: &id003
  - title: Leaderboards and Evaluations · Hugging Face
    url: https://huggingface.co/docs/leaderboards/index
    summary: 借鉴将模型表现放回任务和评估维度中比较的方式。参考其提问和展开方式，具体结论留给选题后的研究。
