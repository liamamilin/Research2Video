# 2026-10-28：参考公开原始内容归纳问题结构；题型与讲述步骤为本矩阵编辑整理。
patterns:
- category: history_turns
  name: 转折发生在哪一步
  title_pattern: 从{局面A}走到{局面B}，哪个具体行动改变了走向？
  outline:
  - 从一个具体历史场景进入
  - 认识当时的处境和参与者
  - 跟随连续行动和变化
  - 连接后续影响
  examples: &id001
  - title: 'The Declaration of Independence: A History | National Archives'
    url: https://www.archives.gov/founding-docs/declaration-history
    summary: 沿历史文件的形成过程理解参与者的处境、选择和转折。参考其提问和展开方式，具体结论留给选题后的研究。
- category: history_turns
  name: 沿事件过程走
  title_pattern: '{历史事件}发生前后，参与者依次做了什么？'
  outline:
  - 从一个具体历史场景进入
  - 对照同一问题中的对象与选择
  - 认识当时的处境和参与者
  - 跟随连续行动和变化
  - 连接后续影响
  examples: *id001
- category: history_turns
  name: 远因与近因
  title_pattern: 理解{转折}，怎样把长期条件和当时行动连起来？
  outline:
  - 从一个具体历史场景进入
  - 认识当时的处境和参与者
  - 沿一个具体案例推进解释
