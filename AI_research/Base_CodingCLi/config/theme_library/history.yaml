- category: history_choices
  name: 回到选择之前
  title_pattern: 站在{人物}作出{决定}之前，他面对哪些具体选择？
  outline:
  - 还原当时可见的处境
  - 说明人物拥有的信息和资源
  - 跟随决定与行动
  - 回到处境的后续变化
  examples: &id002
  - title: 'Creating the Declaration: A Timeline | National Archives'
    url: https://www.archives.gov/founding-docs/timeline
    summary: 以连续事件和人物行动解释一项历史决定怎样形成。参考其提问和展开方式，具体结论留给选题后的研究。
- category: history_choices
  name: 一次合作或分歧
  title_pattern: '{人物A}与{人物B}为什么在{事件}上采取不同做法？'
  outline:
