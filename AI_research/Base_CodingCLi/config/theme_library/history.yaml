  - 选一件具体社会事务
  - 认识参与者和规则
  - 沿办理或执行过程展开
  - 说明制度与生活的关系
  examples: &id003
  - title: 宫廷典制 - 故宫博物院
    url: https://www.dpm.org.cn/court/systems.html
    summary: 从宫廷典制和具体角色进入历史制度如何运转。参考其提问和展开方式，具体结论留给选题后的研究。
