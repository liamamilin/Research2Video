# 2026-10-28：参考公开原始内容归纳问题结构；题型与讲述步骤为本矩阵编辑整理。
patterns:
- category: science_physics
  name: 熟悉现象的机制
  title_pattern: 为什么{日常物体}在{具体条件}下会{现象}？
  outline:
  - 呈现可辨认的生活现象
  - 标出物体与变化条件
  - 沿作用过程解释机制
  - 回到一个新的生活场景
  examples: &id001
  - title: Heat Flow | Building Science Education
    url: https://bsesc.energy.gov/energy-basics/heat-flow
    summary: 从具体建筑场景展示热量如何沿不同路径移动。参考其提问和展开方式，具体结论留给选题后的研究。
- category: science_physics
  name: 只改一个条件
  title_pattern: 同样的{物理过程}，换了{条件}结果为什么不同？
  outline:
  - 呈现可辨认的生活现象
  - 对照同一问题中的对象与选择
  - 标出物体与变化条件
  - 沿作用过程解释机制
  - 回到一个新的生活场景
  examples: *id001
