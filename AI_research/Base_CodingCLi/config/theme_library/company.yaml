- category: company_financials
  name: 利润与现金
  title_pattern: '{公司}看起来有利润，为什么现金流会{变化}？'
  outline:
  - 选一笔具体经营活动
  - 展示收入支出和收付款时间
  - 连接相关报表或指标
  - 用业务过程解释读数
  examples: &id003
  - title: SEC.gov | Beginners' Guide to Financial Statements
    url: https://www.sec.gov/about/reports-publications/beginners-guide-financial-statements
    summary: 用不同报表回答公司收入、资产和现金流分别发生什么。参考其提问和展开方式，具体结论留给选题后的研究。
