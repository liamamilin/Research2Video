# 2026-10-28：参考公开原始内容归纳问题结构；题型与讲述步骤为本矩阵编辑整理。
patterns:
- category: company_models
  name: 沿收入追问
  title_pattern: '{公司}卖的是{产品}，主要靠哪一笔收入赚钱？'
  outline:
  - 从顾客的一次购买进入
  - 画出产品与付费关系
  - 展开主要收入和成本
  - 回到这种模式适合的需求
  examples: &id001
  - title: Jeff Bezos' Original 1997 Letter to Amazon Shareholders
    url: https://www.aboutamazon.com/news/company-news/amazons-original-1997-letter-to-shareholders
    summary: 从用户体验、投入和长期经营关系理解公司的收入逻辑。参考其提问和展开方式，具体结论留给选题后的研究。
- category: company_models
  name: 拆开一次交易
  title_pattern: 买一次{产品}的钱，怎样流到{商业模式}里的不同角色？
  outline:
  - 从顾客的一次购买进入
  - 对照同一问题中的对象与选择
  - 画出产品与付费关系
  - 展开主要收入和成本
  - 回到这种模式适合的需求
  examples: *id001
- category: company_models
  name: 模式对照
  title_pattern: 同样满足{需求}，{模式A}与{模式B}为什么赚钱方式不同？
  outline:
  - 从顾客的一次购买进入
  - 画出产品与付费关系
  - 沿一个具体案例推进解释
  - 展开主要收入和成本
  - 回到这种模式适合的需求
  examples: *id001
- category: company_competition
  name: 顾客选择
  title_pattern: 同样提供{产品}，顾客为什么选择{公司}？
  outline:
  - 还原顾客要完成的事
  - 对照两个具体选择
  - 解释差异怎样产生
  - 追到顾客和竞争者的下一步
  examples: &id002
  - title: Jeff Bezos' 2016 Letter to Amazon Shareholders
    url: https://www.aboutamazon.com/news/company-news/2016-letter-to-shareholders
    summary: 从具体组织决策和客户问题切入公司如何维持竞争力。参考其提问和展开方式，具体结论留给选题后的研究。
- category: company_competition
  name: 竞争动作
  title_pattern: '{公司}做了{具体动作}，改变了哪一项竞争关系？'
