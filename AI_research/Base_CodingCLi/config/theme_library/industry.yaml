# 2026-10-28：参考公开原始内容归纳问题结构；题型与讲述步骤为本矩阵编辑整理。
patterns:
- category: industry_processes
  name: 跟随一个部件
  title_pattern: 一块{原料}变成{部件}，要经过哪些关键工序？
  outline:
  - 拿出一件具体实物
  - 跟随原料流过关键工序
  - 解释每一步改变了什么
  - 展示最终部件的用途
  examples: &id001
  - title: How microchips are made | ASML Description
    url: https://www.asml.com/en/technology/all-about-microchips/how-microchips-are-made
    summary: 跟随芯片制造的具体工序理解材料如何逐步变成可用部件。参考其提问和展开方式，具体结论留给选题后的研究。
- category: industry_processes
  name: 关键工序的作用
  title_pattern: 制造{产品}时，为什么必须完成{关键步骤}？
  outline:
  - 拿出一件具体实物
  - 对照同一问题中的对象与选择
  - 跟随原料流过关键工序
  - 解释每一步改变了什么
  - 展示最终部件的用途
  examples: *id001
- category: industry_processes
  name: 两种制造路线
  title_pattern: 同样做{产品}，{工艺A}与{工艺B}的过程怎样不同？
  outline:
  - 拿出一件具体实物
  - 跟随原料流过关键工序
  - 沿一个具体案例推进解释
  - 解释每一步改变了什么
  - 展示最终部件的用途
  examples: *id001
- category: industry_materials
  name: 材料选择
  title_pattern: 制造{产品}时，为什么选{材料}而不是{另一材料}？
  outline:
  - 展示产品里的具体部件
  - 连接材料性质与用途
  - 解释制造中的取舍
  - 回到整体产品的结果
  examples: &id002
  - title: Raw materials - worldsteel.org
    url: https://worldsteel.org/about-steel/raw-materials
    summary: 从原料组成和生产用途理解材料选择怎样影响后续工艺。参考其提问和展开方式，具体结论留给选题后的研究。
  - title: “后母戊”青铜方鼎_中国国家博物馆官方网站
    url: https://www.chnmuseum.cn/zp/zpml/kgfjp/202008/t20200824_247255.shtml
    summary: 从一件具体青铜器的形制、用途和制作理解文物表达。参考其提问和展开方式，具体结论留给选题后的研究。
