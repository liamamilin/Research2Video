  - 从现有设备和需求进入
  - 列出买入维护和使用成本
  - 对照实际可用的方案
  - 按使用阶段理解价值
  examples: &id004
  - title: Apple Service and Repair for iPhone Battery - Apple Support
    url: https://support.apple.com/iphone/repair/battery-replacement
    summary: 从电池维修这一具体选择理解购入、维护和后续使用的总成本。参考其提问和展开方式，具体结论留给选题后的研究。
