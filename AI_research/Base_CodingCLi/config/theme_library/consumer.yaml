# 2026-10-28：参考公开原始内容归纳问题结构；题型与讲述步骤为本矩阵编辑整理。
patterns:
- category: consumer_choices
  name: 先问用途
  title_pattern: 主要用来{任务}，选{产品}之前先确定什么？
  outline:
  - 说明具体使用者和环境
  - 列出真正要完成的任务
  - 比较影响任务的差异
  - 给出按需求选择的路径
  examples: &id001
  - title: 'How We Test Dozens of TVs Each Year: Transforming Mountains of Data Into Objective Reviews - RTINGS.com'
    url: https://www.rtings.com/tv/learn/how-we-test
    summary: 从实际使用场景和评测维度组织产品选择问题。参考其提问和展开方式，具体结论留给选题后的研究。
- category: consumer_choices
  name: 需求对应差异
  title_pattern: 面对{候选产品}，哪些差异会真正影响{使用场景}？
  outline:
  - 说明具体使用者和环境
  - 对照同一问题中的对象与选择
  - 列出真正要完成的任务
  - 比较影响任务的差异
  - 给出按需求选择的路径
  examples: *id001
- category: consumer_choices
  name: 放回实际环境
  title_pattern: 同样买{产品}，{环境A}与{环境B}为什么适合不同选择？
  outline:
  - 说明具体使用者和环境
  - 列出真正要完成的任务
  - 沿一个具体案例推进解释
  - 比较影响任务的差异
  - 给出按需求选择的路径
  examples: *id001
- category: consumer_experience
  name: 跟随一天使用
  title_pattern: 在{日常场景}里连续使用{产品}，哪些细节最影响体验？
  outline:
  - 跟随一次实际使用
  - 标出与任务有关的细节
  - 对照动作和结果
  - 回到适合的人和场景
  examples: &id002
  - title: 'How We Test Headphones: Transforming Data Into Objective Reviews - RTINGS.com'
    url: https://www.rtings.com/headphones/learn/how-we-test
    summary: 将耳机的测量维度对应到佩戴、通话和聆听等具体体验。参考其提问和展开方式，具体结论留给选题后的研究。
- category: consumer_experience
  name: 一个细节的差异
  title_pattern: '{产品细节}不同，完成{任务}时会有什么可见区别？'
  outline:
  - 跟随一次实际使用
  - 对照同一问题中的对象与选择
  - 标出与任务有关的细节
  - 对照动作和结果
  - 回到适合的人和场景
  examples: *id002
- category: consumer_experience
  name: 场景变化后
  title_pattern: 从{场景A}换到{场景B}，对{产品}的需求怎样变化？
  outline:
  - 跟随一次实际使用
  - 标出与任务有关的细节
  - 沿一个具体案例推进解释
  - 对照动作和结果
  - 回到适合的人和场景
  examples: *id002
- category: consumer_specs
  name: 参数对应什么
  title_pattern: '{参数}影响{产品}完成哪一步任务？'
  outline:
  - 给出一项具体任务
  - 展示与它有关的参数
  - 连接测试和可见体验
  - 解释实际选择的取舍
  examples: &id003
  - title: 'How We Test Monitors: Transforming Data Into Objective Reviews - RTINGS.com'
    url: https://www.rtings.com/monitor/learn/how-we-test
    summary: 借鉴把显示器参数和测试结果放回具体使用任务的方式。参考其提问和展开方式，具体结论留给选题后的研究。
- category: consumer_specs
  name: 数字相近体验不同
  title_pattern: '{产品A}和{产品B}的{参数}相近，实际使用为什么还不同？'
