# 2026-10-28：参考公开原始内容归纳问题结构；题型与讲述步骤为本矩阵编辑整理。
patterns:
- category: education_concepts
  name: 从例子进入概念
  title_pattern: 第一次接触{概念}，怎样用一个具体例子理解它？
  outline:
  - 呈现一个具体学习疑问
  - 用例子说明关键关系
  - 对照相近概念
  - 让观众试着迁移解释
  examples: &id001
  - title: Concept Mapping – Learning Strategies Center
    url: https://lsc.cornell.edu/how-to-study/concept-maps
    summary: 用概念图展示知识点怎样连接，借鉴从零散事实到关系理解的讲法。参考其提问和展开方式，具体结论留给选题后的研究。
- category: education_concepts
  name: 把知识连起来
  title_pattern: '{几个知识点}怎样连成一张能用的关系图？'
  outline:
  - 呈现一个具体学习疑问
  - 对照同一问题中的对象与选择
  - 用例子说明关键关系
  - 对照相近概念
  - 让观众试着迁移解释
  examples: *id001
