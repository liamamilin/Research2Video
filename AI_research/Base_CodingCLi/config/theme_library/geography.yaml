# 2026-10-28：参考公开原始内容归纳问题结构；题型与讲述步骤为本矩阵编辑整理。
patterns:
- category: geography_landforms
  name: 沿一滴水旅行
  title_pattern: 一滴水经过{流域}，怎样连接山地、河流和生活？
  outline:
  - 在地图上确定具体地方
  - 跟随水和地形的路线
  - 解释相互作用的过程
  - 回到沿途生活和利用
  examples: &id001
  - title: Water Cycle Diagrams | U.S. Geological Survey
    url: https://www.usgs.gov/water-science-school/science/water-cycle-diagrams
    summary: 用示意图沿水的运动解释地形、水系与人类用水的位置关系。参考其提问和展开方式，具体结论留给选题后的研究。
