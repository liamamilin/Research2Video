- category: economy_labor
  name: 工资为什么不同
  title_pattern: 同样做{工作}，{环境A}与{环境B}的收入为什么不同？
  outline:
  - 刻画一个具体岗位
  - 展示任务与产出的关系
  - 连接企业和劳动者的选择
  - 回到机会与收入分配
  examples: &id004
  - title: Decoupling of wages from productivity | OECD
    url: https://www.oecd.org/en/publications/decoupling-of-wages-from-productivity_d4764493-en.html
    summary: 借鉴从生产率和工资的关系提出劳动收入分配问题。参考其提问和展开方式，具体结论留给选题后的研究。
