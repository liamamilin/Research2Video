# 2026-10-28：参考公开原始内容归纳问题结构；题型与讲述步骤为本矩阵编辑整理。
patterns:
- category: economy_prices
  name: 账单里的变化
  title_pattern: 同样买{日常商品}，为什么这一笔支出会变化？
  outline:
  - 展示一份具体账单
  - 区分商品和总体价格
  - 追踪需求或成本传导
  - 回到不同人群的实际支出
  examples: &id001
  - title: 'Inflation: Prices on the Rise'
    url: https://www.imf.org/en/publications/fandd/issues/series/back-to-basics/inflation
    summary: 从一篮子商品价格进入通胀的度量、原因与具体影响。参考其提问和展开方式，具体结论留给选题后的研究。
- category: economy_prices
  name: 一篮子与一个人
  title_pattern: '{价格指标}反映的变化，为什么和{人群}的感受不同？'
  outline:
  - 展示一份具体账单
  - 对照同一问题中的对象与选择
  - 区分商品和总体价格
  - 追踪需求或成本传导
  - 回到不同人群的实际支出
  examples: *id001
- category: economy_prices
  name: 顺着成本走
  title_pattern: '{原料价格}改变之后，怎样传到{终端商品}？'
  outline:
  - 展示一份具体账单
  - 区分商品和总体价格
  - 沿一个具体案例推进解释
  - 追踪需求或成本传导
  - 回到不同人群的实际支出
  examples: *id001
- category: economy_money
  name: 利率传到哪里
  title_pattern: '{利率}变化后，怎样一步步影响{具体支出}？'
  outline:
  - 从一笔借贷或支出进入
  - 连接银行和使用者
  - 顺着传导环节展开
  - 说明不同对象的反应
  examples: &id002
  - title: 'Monetary Policy: Stabilizing Prices and Output'
    url: https://www.imf.org/en/publications/fandd/issues/series/back-to-basics/monetary-policy
    summary: 沿利率、信贷与支出等环节解释货币政策怎样传导。参考其提问和展开方式，具体结论留给选题后的研究。
- category: economy_money
  name: 沿一笔贷款
  title_pattern: 一笔{贷款}从申请到偿还，连接了哪些经济活动？
  outline:
  - 从一笔借贷或支出进入
  - 对照同一问题中的对象与选择
  - 连接银行和使用者
  - 顺着传导环节展开
  - 说明不同对象的反应
  examples: *id002
- category: economy_money
  name: 同一政策不同感受
  title_pattern: 同样的{货币变化}，为什么对{人群A}和{人群B}影响不同？
  outline:
  - 从一笔借贷或支出进入
