- category: economy_growth
  name: 从订单看增长
  title_pattern: '{行业}多了一批订单，怎样体现在经济增长中？'
  outline:
  - 从一项生产或支出进入
  - 解释总量怎样构成
  - 对照价格数量和人均情况
  - 连接行业与观众感受
  examples: &id003
  - title: 'Gross Domestic Product: An Economy’s All'
    url: https://www.imf.org/en/publications/fandd/issues/series/back-to-basics/gross-domestic-product-gdp
    summary: 通过生产和支出的具体例子区分经济总量、实际变化与人均情况。参考其提问和展开方式，具体结论留给选题后的研究。
