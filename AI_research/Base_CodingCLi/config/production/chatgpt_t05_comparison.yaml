# 生产配置：这个 Job 的报告怎么写成视频（spec/production.md）。拆不拆、要不要再核实由配方定，给谁看在 audience 里选，多长在配方允许的范围里用 minutes 改，要不要重新调研用 reverify 改，auto 只控制自动制作开关，开启后处理全部不重复选题。
name: T05 · AI 产品横向选择
job: chatgpt_acquisition/t05_comparison
recipe: chatgpt_acquisition
# 11-10 主打片拉长：对比和付费价值要讲透，按 5 分钟写（配方允许 2–6 分钟；我们的 1.9 万爆款是 7 分钟的算账片）。
