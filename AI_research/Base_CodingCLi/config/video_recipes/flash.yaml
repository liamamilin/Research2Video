# 文稿配方：一份文件就是一种文稿的完整做法（调研 → 写稿 → 出片），字段说明见 spec/video-recipes.md。
# research.template 是 jobs/_templates/video_research/ 下的调研模板，output.use 是 config/video_parts/output/ 下的出片部件。
# 改完在「文稿配方」页保存会先校验；新配方从现有配方复制。

name: 快讯
description: 让{{audience}}抓住一个新变化最值得关注的地方，听完就明白发生了什么，为什么值得自己关心。
status: enabled
tags:
  domain:
    key: ai
    name: AI 与软件
  type:
    key: quick_take
    name: 快讯
  format:
    key: short
    name: B 站横屏短
audiences: [developer, non_tech]
target_minutes: 1.25
topic:
  kind: single
  sources: [flash, ai_science_updates, hot_trends, blockchain_updates]
  fields: [核心角度, 目标受众, 条目数, 条目, 对比对象, 对比维度]
research:
  template: quick_take
  optional: true
writing:
  pipeline: single
  default_style:
    depth: '{{audience.depth}}'
    tone: news
  style: |
    不要写成通讯社电稿，也不要在开头念“这条只回答三件事”的提纲。
    第一句直接甩出最反直觉的变化、核心冲突或直接后果；正文紧扣三件事讲透：
    1. 真正变了什么（剥掉公关词，材料里若有缺失基线、隐藏前提或未披露边界顺手点破）；
    2. 到底咬到谁的利益（明确谁立刻受影响、谁不用慌）；
    3. 下一步能立刻查/做的动作，或事件悬而未决时接下来盯紧的唯一关键信号（不要用“有待观察”草草收尾）。
    这是给耳朵听的口播：严禁念具体 IP 地址、邮箱、Git PR 路径、长串隐藏文件名或大写环境变量全名，用一句大白话概括机制，具体文件名和命令留给画面；同一事实或财报数字全篇只在一个位置讲透，前后段落绝不车轱辘重复。
output:
  use: motion
  packaging:
    use: common
    label: 快讯
    intro:
      subtitle: '{date}'
      seconds: 1.5
    outro:
      lines:
      - 面向{{audience}}的 快讯
      seconds: 3
  recheck: true
