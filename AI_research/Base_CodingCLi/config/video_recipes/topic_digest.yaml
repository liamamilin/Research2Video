# 文稿配方：一份文件就是一种文稿的完整做法（调研 → 写稿 → 出片），字段说明见 spec/video-recipes.md。
# 这一份是「整份报告」配方：不挑条目、不再调研，直接从 Job 的整份报告写（topic.whole_report: true）。
# 它和「报告速览」的做法一样，只是不绑 AI 这个领域：给十个非 AI 矩阵（科技、商业、财经……）用，观众是大众观众。
# 改完在「文稿配方」页保存会先校验；新配方从现有配方复制。

name: 专题速览
description: 带{{audience}}看见这个领域里有意思的新事情，把相关的发现串成一次好听的讲述，听过后对这个世界多懂一点。
status: enabled
tags:
  domain:
    key: topics
    name: 综合专题
  type:
    key: digest
    name: 专题速览
  format:
    key: long
    name: B 站横屏长
audiences: [general, developer, non_tech]
target_minutes: 3
minutes_range: [3, 6]
topic:
  kind: single
  whole_report: true
  fields: [核心角度, 目标受众]
research:
  mode: none
writing:
  pipeline: single
  default_style:
    depth: '{{audience.depth}}'
    tone: concise
  style: |
    带{{audience}}从具体反常识现象、真实动作或现场切口进入，不要写教科书定义或百科词条，也不要在同一段堆砌五六个专业术语。
    每节只推进一步核心因果（具体现象或动作 → 背后起作用的一层机制或取舍 → 实际结果与边界），术语只在解释眼前例子时出场。
    整期有多个议题时标题主菜必须排在第一个 item；opening 只用 1 到 2 句抛出核心反差或问题，绝不提前复述第一节的数字与结论；不同案例无共同机制时不强行用宏大口号串场。
    同一事实或数字全篇只在一个位置讲透、保留原小数位，收尾留一个可转述的判断标尺或可借用的具体动作。
output:
  use: motion
  packaging:
    use: common
    label: 专题速览
    outro:
      lines:
      - 主要来源见简介
      seconds: 3
