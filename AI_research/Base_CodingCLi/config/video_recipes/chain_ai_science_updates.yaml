name: AI 科研进展讲稿
description: 让{{audience}}听清一项 AI 科研进展：研究问题、AI 帮到哪一步、证据到哪里、还能不能推广。
status: enabled
tags:
  domain:
    key: chain_ai_science_updates
    name: AI 科研进展
  type:
    key: quick_take
    name: 科研短讲
  format:
    key: short
    name: B 站横屏短
audiences:
- non_tech
- developer
target_minutes: 1.25
topic:
  kind: single
  sources:
  - ai_science_updates
  fields:
  - 核心角度
  - 目标受众
  - 条目数
  - 条目
  - 对比对象
  - 对比维度
research:
  template: quick_take
  optional: true
writing:
  pipeline: single
  default_style:
    depth: '{{audience.depth}}'
    tone: news
  style: |
    面向本条选题的目标观众，讲清这项科研进展的问题、方法边界与可带走的理解。
output:
  use: motion
  packaging:
    use: common
    label: 科研进展
    intro:
      subtitle: '{date}'
      seconds: 1.5
    outro:
      lines:
      - 面向{{audience}}的 AI 科研进展
      seconds: 3
  recheck: true
minutes_range:
- 1
- 10

