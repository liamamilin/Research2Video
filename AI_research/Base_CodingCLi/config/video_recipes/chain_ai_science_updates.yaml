name: AI 科研进展讲稿
description: 让{{audience}}抓住一个新变化最值得关注的地方，听完就明白发生了什么，为什么值得自己关心。
status: enabled
tags:
  domain:
    key: chain_ai_science_updates
    name: AI 科研进展
  type:
    key: quick_take
    name: 快讯
  format:
    key: short
    name: B 站横屏短
audiences:
- non_tech
- developer
target_minutes: 1.25
topic:
  kind: single
  sources:
  - ai_science_updates
  fields:
  - 核心角度
  - 目标受众
  - 条目数
  - 条目
  - 对比对象
  - 对比维度
research:
  template: quick_take
  optional: true
writing:
  pipeline: single
  default_style:
    depth: '{{audience.depth}}'
    tone: news
  style: '面向本条选题的目标观众，讲清这件新事。

    '
output:
  use: motion
  packaging:
    use: common
    label: 快讯
    intro:
      subtitle: '{date}'
      seconds: 1.5
    outro:
      lines:
      - 面向{{audience}}的 快讯
      seconds: 3
  recheck: true
minutes_range:
- 1
- 10
