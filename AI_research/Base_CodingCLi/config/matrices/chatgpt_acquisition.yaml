  premise: 国内用户使用 ChatGPT 的现实：国内应用商店下载不到，要有海外账号（海外手机号或海外区 Apple ID、Google Play）和能访问海外服务的网络，付费方式也和国内 App 不同；真正在用的人大多在电脑网页端使用。讲到 ChatGPT 时按这个前提：把使用门槛当作选择的一部分讲清楚，不把它当成手机上和国产 App 并列、能直接下载的选项；和国产产品比较时，先说清各自在国内能不能直接用。
