schema_version: 1
name: 一个文化现象的来路
matrix: culture
type: explainer
audience: 愿意走近作品，希望看懂表达、创作与文化来路的普通观众
promise: 通过代表作品与持续的行动，理解一个文化现象如何形成、传播和改变理解
production_ids:
- culture_weekly
render_inheritance: source_compatible
render:
  packaging:
    label: 一个文化现象的来路
presentation:
  preferred_visuals:
  - 作品图片
  - 细节聚焦
  strategy: 沿同一代表作品的整体和关键细节，结合已有图像与现有关系图解释谁在创作、展示、转译或传播，观众如何接触和理解。当前交接的对象、双方与结果随当步旁白推进，比较保持同一问题和作品称呼；局部强调保留必要上下文。数字与日期贴当前媒介条件及动作，进入下一步时画面跟随。图像说明简短指向可见对象，合流关系与当前结果保持清楚，结尾回到主作品的新位置或新的观看理解。
status: configured
notes: 以材料已经展开的一件代表作品或具体场景，尽早让观众知道本期要理解哪一处表达、用途或观看关系的变化，标题与开场贴着正文持续展开的具体变化。沿同一文化问题的创作、展示、转译、传播与使用过程，跟随参与者在具体场合的动作和观众理解持续推进，保留过程、细节、例子与解释深度。相邻案例对应主过程中的一步，直接讲该步的动作与结果，在相关处接回主例子。人物履历、机构和年代贴着它们改变的当前行动进入，比较对齐同一表达变化与观看条件。收束跟随代表作品传播后的新位置或理解变化，让回顾帮助形成新的观察。研究备忘供作者构思，旁白直接讲作品、参与者与变化，作者按材料组织标题、段落、篇幅和节奏。
