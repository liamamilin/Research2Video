schema_version: 1
name: T04 · 实测与能力验证
matrix: chatgpt_acquisition
type: comparison
audience: 中文 ChatGPT 新用户、职场与学习人群、潜在付费用户
promise: ChatGPT 实际表现怎么样？
production_ids:
- chatgpt_t04_testing
render_inheritance: content_matrix
render:
  packaging:
    label: 实测与能力验证
presentation:
  strategy: 围绕一个具体任务持续展示同一组输入、操作和结果；用真实页面、局部放大和变化前后对照，让旁白与操作同步。沿同一个任务呈现操作、看到的结果和有用的比较。
  preferred_visuals:
  - 产品真实截图
  - 操作步骤
  - 结果展示
  - 变化前后对比
status: configured
notes: 不要写端水的优缺点总结。从观众真会遇到的问题切入，明确划清两类边界：什么任务可以直接放心交给它（给出看得见的结果），以及什么任务或条件下最容易翻车（挖出材料里最隐蔽的错例或限制），结尾一句话拍板。
