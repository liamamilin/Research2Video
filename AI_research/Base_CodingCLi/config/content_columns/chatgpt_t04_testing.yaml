presentation:
  strategy: 围绕一个具体任务持续展示同一组输入、操作和结果；用真实页面、局部放大和变化前后对照，让旁白与操作同步。围绕一个具体任务提炼可复现的测试输入、步骤、比较维度和预期观察点。来源已有实测就说明是谁测的；尚未执行的部分写成待实测方案，保留后续拍摄可用的操作和画面。
  preferred_visuals:
  - 产品真实截图
  - 操作步骤
  - 结果展示
  - 变化前后对比
status: configured
notes: 题材编号 T04；获客作用：建立信任。围绕一个具体任务提炼可复现的测试输入、步骤、比较维度和预期观察点。来源已有实测就说明是谁测的；尚未执行的部分写成待实测方案，保留后续拍摄可用的操作和画面。
