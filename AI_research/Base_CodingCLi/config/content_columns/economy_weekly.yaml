schema_version: 1
name: 一条经济机制
matrix: economy
type: explainer
audience: 关心钱与生活、希望理解经济变化怎样影响具体选择的普通观众
promise: 通过一个持续的例子，理解经济关系为什么这样运转，并认识一个相近用途
production_ids:
- economy_weekly
render_inheritance: source_compatible
render:
  packaging:
    label: 一条经济机制
presentation:
  preferred_visuals:
  - 趋势图
  - 对比图
  - 传导流程
  strategy: 保持主交易的参与者名称、位置和资金方向连贯，先交代可读路径，再随旁白突出当前交接的双方。讲一笔账或报价的组成时，沿同一张账逐项展示当前解释的那部分，让成本、承担者和下一步选择对应。多项数字按正在解释的关系出现，图表的比较对象与时间范围清楚；背景总量与旁支保持简洁。局部聚焦仍保留关系方向，最终在可读整体中连起主交易的来处、去向与结果。
status: configured
notes: 从值得理解的具体经济问题进入，尽早明确本期追踪哪一笔钱、哪张报价或哪次交易，让它贯穿全片。参与者在接手、付钱或改变选择的那一步进入，随后解释其动机、成本和关系，每一层机制让主交易继续推进。沿同一张账或同一条资金路径展开细节与取舍，相关监管、背景和相邻渠道用于解释当前一步，再接回主例子。结尾回到开场对象怎样得到钱、承担成本或完成选择，连起路径后简洁带到一个相近用途。取材备忘留作作者背景，标题、段落与节奏由材料决定。
