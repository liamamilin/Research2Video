presentation:
  strategy: 围绕一个具体任务持续展示同一组输入、操作和结果；用真实页面、局部放大和变化前后对照，让旁白与操作同步。按购买前准备、网页与应用内订阅、支付失败、账单与取消等真实问题整理可操作的官方步骤。区分缺少付款方式与身处未支持地区，区分
    ChatGPT 与 API 账单。保留每个入口、所需条件与排查分支。
  preferred_visuals:
  - 产品真实截图
  - 操作步骤
  - 结果展示
  - 变化前后对比
status: configured
notes: 题材编号 T07；获客作用：捕获需求。按购买前准备、网页与应用内订阅、支付失败、账单与取消等真实问题整理可操作的官方步骤。区分缺少付款方式与身处未支持地区，区分 ChatGPT 与 API 账单。保留每个入口、所需条件与排查分支。
