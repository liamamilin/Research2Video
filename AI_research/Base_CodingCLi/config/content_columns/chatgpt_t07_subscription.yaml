schema_version: 1
name: T07 · 订阅与支付
matrix: chatgpt_acquisition
type: tutorial
audience: 中文 ChatGPT 新用户、职场与学习人群、潜在付费用户
promise: 想订阅，怎么完成？
production_ids:
- chatgpt_t07_subscription
render_inheritance: content_matrix
render:
  packaging:
    label: 订阅与支付
presentation:
  strategy: 围绕一个具体任务持续展示同一组输入、操作和结果；用真实页面、局部放大和变化前后对照，让旁白与操作同步。按购买前准备、网页与应用内订阅、支付失败、账单与取消等真实问题整理可操作的官方步骤。区分缺少付款方式与身处未支持地区，区分
    ChatGPT 与 API 账单。保留每个入口、所需条件与排查分支。
  preferred_visuals:
  - 产品真实截图
  - 操作步骤
  - 结果展示
  - 变化前后对比
status: configured
notes: 按真实订阅/账单路径（确认账号与渠道 → 选档与结账前核对 → 发票确认与后续管理）一条主线走到底，明确区分网页、Apple、Google 与 API 账单，不把与普通观众无关的各国本地支付枚举或免税细则堆进主线。每步给清红绿灯分岔（什么状态先停下来别重复付款、什么状态找对应平台），不连念四层英文菜单路径，同一入口和前提全篇只说一次。
