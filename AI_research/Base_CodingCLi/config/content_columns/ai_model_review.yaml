schema_version: 1
name: AI 模型观察
matrix: ai_media
type: comparison
audience: 需要理解不同 AI 模型能力、成本与适用情形的中文用户
promise: 帮观众围绕一个使用场景看懂模型差异，理解选择背后的取舍
production_ids:
- ai_media_arena_digest
render_inheritance: source_compatible
render:
  packaging:
    label: AI 模型观察
presentation:
  strategy: 先呈现本期任务与最有解释力的差异，让足以改变选择的主要对象留在同一个比较中。主比较沿用一致的对象名、单位和坐标维度，价格、等待或能力读数在解释当前取舍时逐步加入；同一对象保持配色。切换任务时讲清比较维度为什么改变，把任务条件与选择一起呈现。收束回顾本期形成的比较方法，静态数据用静态比较表达。
  preferred_visuals:
  - 对比图
  - 性能图
  - 价格卡
  - 真实截图
status: configured
notes: "建议围绕观众实际关心的模型差异，结合可比的任务和条件解释能力、速度、价格与上下文读数。比较维度、对象与展开顺序由本题材料决定。"
