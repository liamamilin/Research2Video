schema_version: 1
name: AI 模型观察
matrix: ai_media
type: comparison
audience: 需要为实际工作选择模型的开发者和 AI 高频使用者
promise: 帮观众围绕一个使用场景看懂模型差异，理解选择背后的取舍
production_ids:
- ai_media_arena_digest
render_inheritance: source_compatible
render:
  packaging:
    label: AI 模型观察
presentation:
  strategy: 先呈现本期任务与最有解释力的差异，再逐步加入支持取舍的对象和数据；价格、速度和能力用对比图或散点图表达，主比较留在画面中，其他参数按讲述需要补入。完整对象名、单位和当前读数一起呈现，随旁白切换高亮，同一对象保持配色。结尾用任务与选择的对应关系回顾本期取舍，静态数据用静态比较呈现。
  preferred_visuals:
  - 对比图
  - 性能图
  - 价格卡
  - 真实截图
status: configured
notes: 从整期材料选择一个值得解释的使用场景或比较问题，如批量处理、交互响应或长文档。让本期收获能用一句具体的话概括，围绕它选择模型、档位与最有解释力的维度，把读数讲成该任务里的等待、花费或能力取舍。其他参数随解释需要展开，部署与生态补充也落回同一任务。收束时回答这个场景下怎样理解选择，以及换一种任务时哪项取舍会改变，让观众带走一种比较方法。对象数量、展开顺序与标题由本期问题决定。
