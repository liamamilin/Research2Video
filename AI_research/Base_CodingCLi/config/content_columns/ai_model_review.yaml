schema_version: 1
name: AI 模型观察
matrix: ai_media
type: comparison
audience: 需要理解不同 AI 模型能力、成本与适用情形的中文用户
promise: 帮观众围绕一个使用场景看懂模型差异，理解选择背后的取舍
production_ids:
- ai_media_arena_digest
render_inheritance: source_compatible
render:
  packaging:
    label: AI 模型观察
presentation:
  strategy: 先用关键数字或任务结果点破选型分水岭，让足以改变选择的主要对象留在同一比较中并保持一致配色；随后聚焦不同工作流的人群分流，并用独立图表或要点卡单独捅破最隐蔽的成本、阈值或延迟陷阱，收束给出一句话拍板口诀，避免连续平铺参数表。
  preferred_visuals:
  - 对比图
  - 性能图
  - 价格卡
  - 真实截图
status: configured
notes: "不要写端水的优缺点列表或逐个报菜名式念价目表。按「核心分水岭 → 什么具体任务和用量直接选谁 → 各自最隐蔽的坑（如账面单价低但总账单反超、超阈值加价/缓存失效、静默降级等材料里已有的真坑，不强求对称、不编造）→ 一句话拍板与改选条件」展开。"
