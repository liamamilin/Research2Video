schema_version: 1
name: T09 · 产品动态与热点
matrix: chatgpt_acquisition
type: news
audience: 中文 ChatGPT 新用户、职场与学习人群、潜在付费用户
promise: ChatGPT 最近有什么变化？
production_ids:
