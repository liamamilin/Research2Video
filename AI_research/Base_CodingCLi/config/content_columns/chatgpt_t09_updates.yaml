render_inheritance: content_matrix
render:
  packaging:
    label: 产品动态与热点
    preset: common
presentation:
  strategy: 以公开产品页、官方说明截图和原生步骤、关系图展示变化：先出现功能入口，再随旁白突出使用变化与数据、订阅边界。已有材料不足时使用图解，不把个人账号登录、双账号录屏或额外实测作为制作前提。
  preferred_visuals:
  - 公开产品截图
  - 变化前后对比
  - 入口路径图解
  - 重点标记
status: configured
notes: 第一句直接抛出普通用户会立刻感受到的具体变化或陷阱，不铺背景不念提纲；多条更新时标题主菜放第一节且 opening 不复读第一节细节。每条讲清变化实质、谁能用（入口/套餐/地区门槛贴在对应变化里讲）以及下一步立刻可查或该改的动作。
content_mode: episode
