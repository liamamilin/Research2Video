schema_version: 1
name: 一笔生意怎样运转
matrix: company
type: explainer
audience: 关注产品、经营和竞争，希望理解公司为何这样做的普通观众与经营者
promise: 理解一个具体生意如何提供价值、完成交付并形成持续运转的关系
production_ids:
- company_weekly
render_inheritance: source_compatible
render:
  packaging:
    label: 一笔生意怎样运转
presentation:
  preferred_visuals:
  - 财务图表
  - 业务结构
  - 产品画面
  strategy: 先建立主交易的客户、产品和服务关系，随旁白沿价值、付款与交付的方向推进。参与者名称、位置和颜色保持连贯；讲付款时让付款方与收款方同时可读，讲交付时突出当前的交接双方。当前动作与下一方结果用现有流程和关系图连接，数字在对应环节解释一次。图片帮助认识实际产品与场景，讲到后续使用时沿同一客户的下一步动作呈现新的状态与结果，在清晰整体中收束业务联系；背景人物、融资和行业统计保持简洁。
status: configured
notes: 从客户要获得的具体结果和一次实际交易展开，沿使用、付钱、服务交付与后续使用，让同一例子贯穿这笔生意的运转。产品、收费、成本和伙伴在它承担的那一步出现，每层解释让主交易继续推进。公司的成立、融资与人物经历在帮助理解当前分工时简洁进入，再接回客户得到什么。用同一需求的具体过程呈现经营取舍，结尾回到主交易的结果与材料已有的后续使用，让关系在具体行动中连起来。取材备忘作为作者背景，适用条件贴着对应关系讲清；标题与节奏由作者按材料组织。
