schema_version: 1
name: 一个地方怎样运转
matrix: geography
type: news
audience: 想看懂一个地方为何如此、空间与环境怎样影响生活的普通观众
promise: 通过一条路线或一次日常活动，看懂一个地方的空间关系与运转方式
production_ids:
- geography_daily
render_inheritance: source_compatible
render:
  packaging:
    label: 一个地方怎样运转
presentation:
  preferred_visuals:
  - 地图
  - 空间变化
  - 统计图
  strategy: 优先利用材料已有的地点、建筑或设施图像与可读的关系图认识本期地方，起点、路径、交接与结果随当前讲述推进。局部强调仍保留必要的相邻位置，图片用地名或当前动作的简短说明，把注意力带到正在讲的建筑、人物、道路、水流或设施特征。数字与日期贴它解释的尺度和当步变化，进入下一项行动时画面跟随；结尾沿主地点或设施的新状态连起运转关系。
status: configured
notes: 以一个具体地方中的活动或设施使用建立本期问题，尽早让观众辨认参与者、所在位置与要完成的事。沿材料中的道路、地形、水流、用地或设施连接，解释人和事物在哪里相遇、为什么这样移动或改变用途，保留具体过程、空间尺度与生活例子。机构、政策和人物反应贴着它们改变的当地步骤出现。旁白直接讲动作与结果，研究备忘供作者构思；回顾跟随主地点或主设施的新状态，作者按材料组织标题、段落和节奏。
