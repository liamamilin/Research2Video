schema_version: 1
name: 公司这一招
matrix: company
type: news
audience: 关注产品、经营和竞争，希望理解公司为何这样做的普通观众与经营者
promise: 理解公司的一次具体动作，以及它怎样改变一笔交易、一次交付或某一方的选择
production_ids:
- company_daily
render_inheritance: source_compatible
render:
  packaging:
    label: 公司这一招
presentation:
  preferred_visuals:
  - 财务图表
  - 业务结构
  - 产品画面
  strategy: 保持同一组参与者、产品和交付方向，先看清业务场景，再随旁白突出正在改变的那一步。前后比较沿用相同对象、位置与标识，比较围绕同一时间或范围维度；金额或比例贴着它解释的成本、供给或结果出现，背景行业规模保持简洁。相关图片帮助认识具体对象，流程和关系图讲清行动怎样影响下一方，收束把主动作和结果接成可读整体。
status: configured
notes: 从一个具体业务场景里发生的改变进入，让同一位客户、伙伴或交付者的行动贯穿本期。重点讲清公司改了哪一步，下一方为什么改变选择，以及实际结果怎样回到原场景。沿材料中的购买、操作与交付过程逐步讲深；融资和估值承担简洁背景，相关公司或行业数字用于解释当步关系。取材备忘留给作者组织材料，口播把篇幅用在已经取得的过程、例子与解释；条件随对应步骤出现。结尾回到开场动作带来的变化，标题、段落和节奏按本期材料组织。
