notes: 不要写成新闻通稿。标题里最重磅的技术变化排在正文第一个 item；opening 只用 1 到 2 句点题，不提前复述第一节的数字与结论。每条先甩出最反直觉的技术突破或代价，讲清真正变了哪一环（点破未公开基线或成立条件）、影响哪类工作或日常生活，以及接下来盯紧的关键验证信号；口播不念长串代码路径或环境变量名。
