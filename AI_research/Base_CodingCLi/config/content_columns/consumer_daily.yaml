schema_version: 1
name: 一处体验变化
matrix: consumer
type: news
audience: 想理解产品体验差别、为自己的日常需求做选择的普通观众
promise: 理解一个产品或服务变化，在具体使用中带来什么不同
production_ids:
- consumer_daily
render_inheritance: source_compatible
render:
  packaging:
    label: 一处体验变化
presentation:
  preferred_visuals:
  - 实物图片
  - 对比卡
  - 使用场景
  strategy: 沿同一对象与用户动作推进，前后对比保持相同任务和尺度。已有图片帮助认出当前对象，图解与数字贴着正在解释的操作和结果；局部聚焦仍能辨认动作的位置和下一步。讲完当前比较后继续使用者的新动作，收束连起体验变化、投入和后续使用。
status: configured
notes: "建议通过实际操作和结果解释产品或服务的体验变化。准备、耗时、使用条件、维护及后续影响在相关时展开，参数尽量与具体体验相连。"
