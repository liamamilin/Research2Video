schema_version: 1
name: T02 · 应用场景与成果
matrix: chatgpt_acquisition
type: explainer
audience: 中文 ChatGPT 新用户、职场与学习人群、潜在付费用户
promise: ChatGPT 能帮我做什么？
production_ids:
- chatgpt_t02_scenarios
render_inheritance: content_matrix
render:
  packaging:
    label: 应用场景与成果
presentation:
  strategy: 围绕一个具体任务持续展示同一组输入、操作和结果；用真实页面、局部放大和变化前后对照，让旁白与操作同步。围绕办公、学习、创作或小企业中的一个任务，保留任务起点、输入材料、操作过程和产物。优先官方教程与客户案例，提炼观众可迁移的用法。
  preferred_visuals:
  - 产品真实截图
  - 操作步骤
  - 结果展示
  - 变化前后对比
status: configured
notes: 从案例中的人被什么具体工作卡住、手里有什么现成材料切入，不要写成泛泛的效率吹捧。多案例合集时标题主打案例排在第一个 item，opening 只用 1 到 2 句点出卡点反差、不提前复述第一节的细节与数字，也不用空洞功能名把不同案例硬绑在一起。顺着真实动作讲清「哪一步把旧做法变成了可交付结果、什么仍由人决定、成果数字在原任务里对应什么口径」，收尾明确指出观众把哪份材料换成自己的就能直接借用哪一步。
