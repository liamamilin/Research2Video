schema_version: 1
name: 一个关键转折
matrix: history
type: explainer
audience: 喜欢历史故事，希望理解当时的人为何那样生活和行动的普通观众
promise: 理解一个历史转折怎样在具体处境、行动与后续变化中形成
production_ids:
- history_weekly
render_inheritance: source_compatible
render:
  packaging:
    label: 一个关键转折
presentation:
  preferred_visuals:
  - 档案图片
  - 地图
  - 时间轴
  strategy: 围绕同一历史问题建立可读的时代、空间与参与者关系，时间线随行动推进，材料已有的档案、物件和图像帮助认识当前对象。解释论证或行动链时保留清晰可读的前因、当前动作与后果，强调当步仍能看清相邻节点；比较保持相同对象和时间范围，两侧内容贴当前旁白。结尾沿主人物或文本的新状态连起变化过程，画面继续结果。
status: configured
notes: 尽早让普通观众认出谁面对怎样的处境与选择，围绕同一个历史主问题沿人物行动、他人回应和后续变化推进。前因、制度、资源与地理关系在影响当前选择时进入，保留材料中的具体过程、推理和例子，让转折从原处境中形成。人物称呼与关系保持连贯，每次解释让主场景向前一步；结尾追到人物、文本或活动改变后的新状态。研究备忘供作者构思，旁白直接讲人物、行动与结果，现代入口服务这个历史变化，标题、篇幅和节奏由材料组织。
