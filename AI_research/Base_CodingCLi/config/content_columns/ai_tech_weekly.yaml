name: 科技周解读
matrix: ai_media
type: explainer
audience: 希望理解技术原理、发展变化和实际用途的中文观众
promise: 理解一周变化之间的联系与实际用途
production_ids:
- tech_weekly
render_inheritance: source_compatible
render: {}
presentation:
  preferred_visuals:
  - 真实截图
  - 图表
  - 流程
status: configured
notes: 从本周最反直觉的技术现象、工程难题或实测反差切入，不要一上来背诵教科书定义，也不要在同一段堆砌五六个底层术语。多议题合集时标题主菜必须排在第一个 item，opening 只用 1 到 2 句抛出核心追问，不提前复述第一节的数字与拆解。每节只推进一步核心因果（实际设计或动作 → 背后真正起作用的一层机制 → 可观察的结果与成立条件），收尾留给观众一个看懂同类技术变化的判断标尺。
