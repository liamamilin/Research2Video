schema_version: 1
name: AI 开源发现
matrix: ai_media
type: explainer
audience: 想把开源工具用于实际工作的开发者和 AI 高频使用者
promise: 帮观众理解一个开源项目解决什么问题，以及它在实际任务中的位置与特点
production_ids:
- ai_media_opensource_digest
render_inheritance: source_compatible
render:
  packaging:
    label: AI 开源发现
presentation:
  strategy: 用项目页面或任务示意建立对象感，让同一份文件、代码或任务卡从输入经过项目处理走到输出，主项目持续处于这条关系中。材料里的输入与输出例子值得停下来展示，参数与原理说明贴在它实际改变的那一步。相关工具作为流程相应位置的简短补充，随后回到主项目；结尾用同一任务的结果收束。Stars、下载量、发布时间和团队背景作为辅助信息。
  preferred_visuals:
  - 项目截图
  - 产品画面
  - 输入输出对照
  - 任务流程
  - 重点卡
status: configured
notes: 从这批材料中选择最值得观众认识的一个项目，尽早把它放进一个具体任务。沿同一份输入讲清项目处理哪一环、输出是什么，以及最有辨识度的动作或能力。参数、原理和相关项目各自帮助解释这条任务线中的一个作用，说明后让主项目继续推进；材料里的输入与输出例子成为讲述的抓手。结尾回到主项目带来的任务结果与适用场合，让观众记住这个项目能接在自己工作中的哪个位置。项目热度与开发背景作为补充，作者自主决定切入点和展开方式。
