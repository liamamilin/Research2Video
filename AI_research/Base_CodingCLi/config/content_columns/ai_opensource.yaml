schema_version: 1
name: AI 开源发现
matrix: ai_media
type: explainer
audience: 想把开源工具用于实际工作的开发者和 AI 高频使用者
promise: 帮观众理解一个开源项目解决什么问题，以及它在实际任务中的位置与特点
production_ids:
- ai_media_opensource_digest
render_inheritance: source_compatible
render:
  packaging:
    label: AI 开源发现
presentation:
  strategy: 用项目页面建立对象感，画面重点放在它解决的任务与工作位置。讲用途时并列呈现输入与输出，讲衔接时用流程图串起项目与其他工具；先给出可读的整体关系，再随着旁白聚焦当前步骤，让正在解释的对象与相邻关系清楚可见，同一项目保持视觉连续。Stars、下载量与发布时间作为辅助标签，主要画面留给项目的作用与特点。
  preferred_visuals:
  - 项目截图
  - 产品画面
  - 输入输出对照
  - 任务流程
  - 重点卡
status: configured
notes: 从这批材料中选择最值得观众认识的一个项目，用具体任务组织一次有重点的讲述。让观众理解输入什么、项目处理哪一环、得到什么结果，以及最有辨识度的能力；相关项目只在帮助理解这个用途时引入。项目名称与热度作为背景，主要篇幅用于解释它与观众工作场景的联系。标题点出项目能帮助解决的问题，作者自主决定切入点和展开方式。
