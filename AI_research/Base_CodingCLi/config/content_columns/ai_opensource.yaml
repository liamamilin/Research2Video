schema_version: 1
name: AI 开源发现
matrix: ai_media
type: explainer
audience: 关注开源 AI 用途的中文工作、学习与技术观众；开发与部署题按实际前置知识说明受众
promise: 帮观众理解一个开源项目解决什么问题，以及它在实际任务中的位置与特点
production_ids:
- ai_media_opensource_digest
render_inheritance: source_compatible
render:
  packaging:
    label: AI 开源发现
presentation:
  strategy: 用项目页面或任务示意建立对象感，让同一份文件、代码或任务卡从输入经过项目处理走到输出，主项目持续处于这条关系中。材料里的输入与输出例子值得停下来展示，参数与原理说明贴在它实际改变的那一步。相关工具作为流程相应位置的简短补充，随后回到主项目；结尾用同一任务的结果收束。Stars、下载量、发布时间和团队背景作为辅助信息。
  preferred_visuals:
  - 项目截图
  - 产品画面
  - 输入输出对照
  - 任务流程
  - 重点卡
status: configured
notes: "不要写成 README 功能列表朗读。从开发者手头的一个具体卡点切入，多项目合集时标题主打项目排在第一个 item，opening 不提前复述第一节的细节。每个项目沿着「喂给它什么实际输入 → 它在工作流哪一步靠什么核心机制处理 → 交出什么可见结果与硬件/依赖门槛」一条线讲透，不堆砌无关参数，收尾明确指出哪类任务值得先试哪一步、看到什么结果再继续。"
