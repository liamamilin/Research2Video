schema_version: 1
name: AI 开源发现
matrix: ai_media
type: explainer
audience: 想把开源工具用于实际工作的开发者和 AI 高频使用者
promise: 帮观众理解一个开源项目解决什么问题，以及它在实际任务中的位置与特点
production_ids:
- ai_media_opensource_digest
render_inheritance: source_compatible
render:
  packaging:
    label: AI 开源发现
presentation:
  strategy: 用项目页面建立对象感，围绕同一个任务呈现输入、项目处理和输出；同一份文件、代码或任务在画面中连续出现，让观众看到项目改变了哪一环。先给出可读的整体关系，再随旁白聚焦步骤与结果。相关工具放在这条流程中的相应位置，结尾回到任务结果。Stars、下载量与发布时间作为辅助标签，主要画面留给项目的作用与特点。
  preferred_visuals:
  - 项目截图
  - 产品画面
  - 输入输出对照
  - 任务流程
  - 重点卡
status: configured
notes: 从这批材料中选择最值得观众认识的一个项目，用具体任务组织一次有重点的讲述。尽早让项目进入这个任务，沿同一份输入解释它处理哪一环、得到什么结果，以及最有辨识度的能力。概念介绍和相关项目都回到这条任务线，帮助观众理解主项目的作用；结尾回到使用前后的任务结果与适用场合。项目名称与热度作为背景，标题点出项目能帮助解决的问题，作者自主决定切入点和展开方式。
