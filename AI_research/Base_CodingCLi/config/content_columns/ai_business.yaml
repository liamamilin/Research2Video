schema_version: 1
name: AI 产业观察
matrix: ai_media
type: explainer
audience: 关心 AI 产品与使用生态的开发者、产品从业者和高频使用者
promise: 帮观众理解一件 AI 商业变化如何影响产品、用户与实际用法
production_ids:
- ai_media_business_digest
render_inheritance: source_compatible
render:
  packaging:
    label: AI 产业观察
presentation:
  strategy: 从具体产品、套餐或采用场景切入，用参与者、产品、使用方之间的关系承载本期商业问题；把材料里的收费、交付、分发或使用关系画成可读整体，再随旁白突出当前变化。事件持续时间等数字放回关系中解释。前后对照展示谁承担成本、获得什么价值或改变哪种用法，结尾回到同一关系画面。
  preferred_visuals:
  - 产品与套餐截图
  - 价格对比
  - 业务结构
  - 流程
status: configured
notes: 从材料中选择一个最值得解释的产品或商业变化，围绕收费、产品采用、分发渠道或竞争关系找到本期主线。沿具体产品的提供方、使用方和交付方式讲清已有联系，让观众理解变化怎样影响成本、价值或使用选择。技术事件和公司动态作为解释这条关系的材料；涉及安全或效率时，落到产品采用、交付或参与者分工的实际变化。结尾回到开场的产品与用户，留下本期商业关系怎样变化的认识。作者自主选择具体例子与讲述顺序。
