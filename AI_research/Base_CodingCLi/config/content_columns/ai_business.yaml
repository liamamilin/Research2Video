schema_version: 1
name: AI 产业观察
matrix: ai_media
type: explainer
audience: 关注 AI 如何影响产品、服务、工作与消费选择的中文观众
promise: 帮观众理解一件 AI 商业变化如何影响产品、用户与实际用法
production_ids:
- ai_media_business_digest
render_inheritance: source_compatible
render:
  packaging:
    label: AI 产业观察
presentation:
  strategy: 从具体产品和采用动作切入，先给出提供方、接入方或使用方之间可读的整体关系，再聚焦当前变化。参与者使用稳定的具体名称，箭头用简短动作说明谁向谁提供什么；收费、交付和分发信息落在对应关系上。概念解释后恢复同一关系图，让观众看到谁的工作、成本或价值发生变化。收束回到这条产品关系，行业判断也由其中的具体变化承载。
  preferred_visuals:
  - 产品与套餐截图
  - 价格对比
  - 业务结构
  - 流程
status: configured
notes: "从一个用户或团队会亲自碰上的账单、默认设置或交付动作变化切入，不要写成宏观行业评论或空洞趋势报告。多条消息时标题主菜排在第一个 item，opening 只用 1 到 2 句抛出核心反差，不提前复述第一节的数字和结论；每个 item 控制在 3 到 5 段以内。每节扣住一条利益与成本转移链（表面动作变化 → 提供方为什么有动力这么做、成本与选择权怎样转移 → 谁获益谁买单），口播不念带下划线或驼峰的英文配置键名/API参数名（改用自然中文说明，键名留给画面），不同消息无共同机制时不强行用宏大口号串场，收尾留一个可验证的商业判断标尺。"
