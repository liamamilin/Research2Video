schema_version: 1
name: AI 产业观察
matrix: ai_media
type: explainer
audience: 关心 AI 产品与使用生态的开发者、产品从业者和高频使用者
promise: 帮观众理解一件 AI 商业变化如何影响产品、用户与实际用法
production_ids:
- ai_media_business_digest
render_inheritance: source_compatible
render:
  packaging:
    label: AI 产业观察
presentation:
  strategy: 从具体产品和采用动作切入，先给出提供方、接入方或使用方之间可读的整体关系，再聚焦当前变化。参与者使用稳定的具体名称，箭头用简短动作说明谁向谁提供什么；收费、交付和分发信息落在对应关系上。概念解释后恢复同一关系图，让观众看到谁的工作、成本或价值发生变化。收束回到这条产品关系，行业判断也由其中的具体变化承载。
  preferred_visuals:
  - 产品与套餐截图
  - 价格对比
  - 业务结构
  - 流程
status: configured
notes: 从材料中选择一个值得解释的产品或商业变化，用一次具体采用、交付或使用动作串起提供方与使用方，讲清谁向谁提供什么、哪一环的价值或选择发生了变化。收费、分发、授权与竞争等概念在解释这条产品关系时展开，让每个角色承担一项具体作用。其他公司动态作为理解这条关系的对照，行业判断从具体产品与参与者的变化自然展开。结尾回到开场的产品和用户，留下这件变化为何值得持续关注的认识。作者自主选择例子与讲述顺序。
