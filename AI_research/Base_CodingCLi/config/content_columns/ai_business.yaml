schema_version: 1
name: AI 产业观察
matrix: ai_media
type: explainer
audience: 关注 AI 如何影响产品、服务、工作与消费选择的中文观众
promise: 帮观众理解一件 AI 商业变化如何影响产品、用户与实际用法
production_ids:
- ai_media_business_digest
render_inheritance: source_compatible
render:
  packaging:
    label: AI 产业观察
presentation:
  strategy: 从具体产品和采用动作切入，先给出提供方、接入方或使用方之间可读的整体关系，再聚焦当前变化。参与者使用稳定的具体名称，箭头用简短动作说明谁向谁提供什么；收费、交付和分发信息落在对应关系上。概念解释后恢复同一关系图，让观众看到谁的工作、成本或价值发生变化。收束回到这条产品关系，行业判断也由其中的具体变化承载。
  preferred_visuals:
  - 产品与套餐截图
  - 价格对比
  - 业务结构
  - 流程
status: configured
notes: "建议从具体产品、采用或交付案例理解商业变化，关注提供方、使用方、收费、授权及竞争关系怎样影响实际价值。例子、背景和行业解释可以按材料组织。"
