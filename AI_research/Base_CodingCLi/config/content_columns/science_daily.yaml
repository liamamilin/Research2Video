schema_version: 1
name: 科学新理解
matrix: science
type: news
audience: 对世界如何运转感到好奇，希望听懂新研究具体意义的普通观众
promise: 看懂一项研究做了什么，以及它让我们对一个具体问题多理解了什么
production_ids:
- science_daily
render_inheritance: source_compatible
render:
  packaging:
    label: 科学新理解
presentation:
  strategy: 从本期研究的具体对象、位置和操作建立画面，同一实验的对象称呼、颜色与左右位置保持连贯。对照先同时呈现两侧以及改变的变量，后续用结果和关系的变化推进；需要过程图时围绕当前相邻步骤展开，在小结回放完整关系。实际图片帮助认识对象，图解帮助解释作用；画面上先让观众看清整体，再跟随旁白聚焦当前一步。关键数字连着对应对象和尺度，收束回到主现象。
    强调能解释本期变化的关键数字，背景距离和日期保持简洁；结尾让主关系回到可读整体。
  preferred_visuals:
  - 原理动画
  - 实验图
  - 图表
status: configured
notes: 每期围绕一个值得好奇的研究问题，从观众能想象的现象或对象进入。沿同一个实验或观测展开，让具体操作、发生的变化和新增理解逐步出现；后面的段落在这个过程上继续向前，术语贴着它解释的那一步。研究底稿中的材料缺失清单与取材备忘只作作者背景，口播主要讲已经取得的过程、例子和结果。影响理解当前结果的适用条件随该步骤讲清，随后接回主现象。收束让观众用这次理解重新看开场的问题；作者自行组织标题、段落和节奏。
