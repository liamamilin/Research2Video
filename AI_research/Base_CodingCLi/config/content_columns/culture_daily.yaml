schema_version: 1
name: 读懂一件作品
matrix: culture
type: news
audience: 愿意走近作品，希望看懂表达、创作与文化来路的普通观众
promise: 从一件作品的具体细节，理解创作者怎样表达以及它为何打动人
production_ids:
- culture_daily
render_inheritance: source_compatible
render:
  packaging:
    label: 读懂一件作品
presentation:
  preferred_visuals:
  - 作品图片
  - 细节聚焦
  strategy: 优先用材料已有的作品图像建立整体，再随当前讲述聚焦构图、材料表面、形态或声音对应的可见细节。现有对比和关系图围绕本期作品的具体创作动作与感受展开，当前两侧及结果可读，局部强调保留作品整体方向和相邻关系。数字与日期贴正在解释的尺度、媒介条件和过程，随下一步观看动作推进。图像和图解说明简短指向当前对象，回看主作品同一细节形成新的理解。
status: configured
notes: 优先沿底稿已经展开的主作品，从一个可观察细节或创作动作尽早让观众认识本期的表达变化。围绕同一作品的构图、材料、形式、声音线索和观看姿态持续深入，解释创作者怎样操作、感受怎样随之变化，保留具体例子、过程与推理。背景、年代和参数在改变当前细节的作用时进入，材料按对应的创作动作和感受组织。相邻作品用于看清当下的表达差别，再接回主作品；收束跟随同一细节带来的新理解。研究备忘供作者构思，旁白直接讲作品、动作与观看感受，作者按材料决定标题、段落、篇幅和节奏。
