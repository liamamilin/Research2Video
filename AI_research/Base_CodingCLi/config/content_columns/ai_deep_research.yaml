schema_version: 1
name: AI 深度解读
matrix: ai_media
type: deep_research
audience: 希望理解 AI 原理及其工作、学习和生活影响的中文观众；专业主题保留实际理解门槛
promise: 陪观众从一个 AI 疑问走到机制理解，并能用于认识类似问题
production_ids:
- ai_media_deep_dive
render_inheritance: source_compatible
render:
  packaging:
    label: AI 深度解读
presentation:
  strategy: 用贯穿本期的任务卡和具体对象呈现输入、过程与结果，让主例子在中段也持续得到更新。每解释一个机制、公式或相关实验，就回到这个任务展示新增关系、状态或选择；同一量的基准与对象名称保持连贯。先给可读整体，再聚焦当前一步，用这一步形成的认识作小标题。结尾回放主例子的关键变化，让观众看到整套解释怎样回答开场。
  preferred_visuals:
  - 多章节混合画面
  - 图表
  - 真实截图
  - 视觉回顾
status: configured
notes: "从真实实验反差、工程故障或硬核矛盾切入，按「实验/现象 → 因果机制 → 口径与适用边界 → 可执行决策」逐章讲透。严禁在口播里逐行念多列跑分表、延迟表或价目表（只拎出最能翻转判断的拐点数字，完整表格留给画面）；单节控制在 3 到 5 段以内，不念英文配置键名或代码路径，前后不车轱辘复读。"
