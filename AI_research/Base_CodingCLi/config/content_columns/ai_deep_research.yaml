schema_version: 1
name: AI 深度解读
matrix: ai_media
type: deep_research
audience: 希望理解 AI 技术如何影响实际工作的开发者和高频使用者
promise: 陪观众从一个 AI 疑问走到机制理解，并能用于认识类似问题
production_ids:
- ai_media_deep_dive
render_inheritance: source_compatible
render:
  packaging:
    label: AI 深度解读
presentation:
  strategy: 尽早把贯穿本期的具体例子放上画面，用同一组对象持续呈现输入、过程和结果；每推进一层解释，就回到例子展示新增关系或状态。先建立可读整体，再聚焦当前对象。背景事件和数字围绕它补充，用本步形成的认识作小标题；结尾回放例子的关键变化，让观众看到机制怎样解释结果。
  preferred_visuals:
  - 多章节混合画面
  - 图表
  - 真实截图
  - 视觉回顾
status: configured
notes: 围绕材料中一个值得持续理解的问题深入展开，尽早用具体例子建立观众的疑问，再沿例子解释机制、作用与实际含义。历史与背景在需要解释当前问题时引入，每增加一层认识，就回到例子说明现在能理解什么；相关案例作为对照帮助看懂同一机制。讲述深度由问题需要决定，收束时用这套理解重新回答开场的问题，并联系一个相近工作场景。作者自主组织段落与节奏，标题体现本期真正要回答的疑问。
