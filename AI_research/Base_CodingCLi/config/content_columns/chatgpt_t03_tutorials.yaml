schema_version: 1
name: T03 · 使用方法与教程
matrix: chatgpt_acquisition
type: tutorial
audience: 中文 ChatGPT 新用户、职场与学习人群、潜在付费用户
promise: 怎样才能用好 ChatGPT？
production_ids:
- chatgpt_t03_tutorials
render_inheritance: content_matrix
render:
  packaging:
    label: 使用方法与教程
presentation:
  strategy: 围绕一个具体任务持续展示同一组输入、操作和结果；用真实页面、局部放大和变化前后对照，让旁白与操作同步。优先 ChatGPT Learn 的任务式演示，其次参考优质创作者。提炼操作起点、关键步骤、示例提示词和结果画面，用中文重新组织讲解，保留演示链接。
  preferred_visuals:
  - 产品真实截图
  - 操作步骤
  - 结果展示
  - 变化前后对比
status: configured
notes: 让观众跟着同一份输入从头走到可用成品，每步只说完成当前任务用到的入口、能照说的指令和屏幕上应看到的验证结果；不把无关设置和边缘条款堆进主线，卡住时直接给下一步动作；opening 不提前剧透全部步骤，前后不车轱辘复读。
