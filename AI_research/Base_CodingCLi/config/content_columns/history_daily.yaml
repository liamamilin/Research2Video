schema_version: 1
name: 回到那个现场
matrix: history
type: news
audience: 喜欢历史故事，希望理解当时的人为何那样生活和行动的普通观众
promise: 通过一件旧物或一个具体历史场景，理解当时的人怎样生活和行动
production_ids:
- history_daily
render_inheritance: source_compatible
render:
  packaging:
    label: 回到那个现场
presentation:
  preferred_visuals:
  - 档案图片
  - 地图
  - 时间轴
  strategy: 先让观众认出材料已有的旧物或人物，具体字迹、形制和动作随当前讲述展开。年代与地点贴在当时的事上，称呼与位置保持连贯；图解让行动双方、对象和结果同时可读，当前强调仍能辨认相邻关系。结尾沿主物件或人物的新处境继续，连起现场发生的变化。
status: configured
notes: 沿一次具体行动让普通观众认出人物当时的身份、要完成的事与手中的物件，保留形制、图案、工具和使用细节。用同一人物与物件的称呼推进故事，需要的年代、地点、制度与前因在影响当前选择时进入，让每次解释把现场向前带一步。新发现、入藏与现代纪念作为研究背景和图像入口，主要篇幅留给过去怎样生活、行动和交接。结尾追到人物或物件的新处境。研究备忘供作者构思，旁白直接讲当时的行动与结果，标题、篇幅和节奏按本期材料组织。
