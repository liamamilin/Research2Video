schema_version: 1
name: T06 · 套餐与付费价值
matrix: chatgpt_acquisition
type: comparison
audience: 中文 ChatGPT 新用户、职场与学习人群、潜在付费用户
promise: 我有没有必要付费？
production_ids:
- chatgpt_t06_value
render_inheritance: content_matrix
render:
  packaging:
    label: 套餐与付费价值
presentation:
  strategy: 按「留原档 vs 掏钱升级」的决策树推进画面：先突出触发升级的具体卡点，再分别展示留原档与升级各自最隐蔽的坑（独立账单、窗口限额、地区或渠道限制），最后用一张简洁拍板卡收束。
  preferred_visuals:
  - 产品真实截图
  - 操作步骤
  - 结果展示
  - 变化前后对比
status: configured
notes: 不要写端水的套餐功能清单。按「什么人继续留原档就行 → 什么人该掏钱升级 → 留原档和升级各自最隐蔽的坑（独立账单、限额、地区/入口限制，严格依据材料不编造）→ 一句话拍板」讲清。
