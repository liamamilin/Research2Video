schema_version: 1
name: 一个选择怎么做
matrix: consumer
type: explainer
audience: 想理解产品体验差别、为自己的日常需求做选择的普通观众
promise: 围绕同一个实际需求，看懂不同方案的体验差别与取舍
production_ids:
- consumer_weekly
render_inheritance: source_compatible
render:
  packaging:
    label: 一个选择怎么做
presentation:
  preferred_visuals:
  - 实物图片
  - 对比卡
  - 使用场景
  strategy: 保持同一使用场景、方案称呼与比较维度，当前差异的两侧同时可读。图片帮助认识对象，流程随当前操作推进，数字和图表展示该项投入与体验的关系；局部聚焦保留对应条件和后续结果。讲当前选择时沿使用者下一步展开，在可读整体里连起需求、取舍和继续使用的结果。
status: configured
notes: "建议让有意义的方案面对可比的使用需求与条件，结合操作、结果、成本、时间、兼容性及维护解释差别。比较范围与顺序随材料安排，结论来自实际取舍。"
