notes: 从日常工程或工作里的一个具体卡点开场，不要写成工具介绍汇编或教科书词条。多项目合集时标题主打项目排在第一个 item，opening 只用 1 到 2 句点出卡点或反差，不提前复述第一节的数字与结论；每节控制在 3 到 5 段以内。每个项目围绕一条核心机制展开：放进工作流接收什么输入、替人省掉或改变了哪一步、交付什么可见结果与适用边界；口播不念带下划线或驼峰的英文配置键名/路径，不同项目无共同机制时不强行用宏大口号串场，收尾留一个手头能立刻试的动作或选型标尺。
