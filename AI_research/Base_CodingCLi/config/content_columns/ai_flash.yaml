schema_version: 1
name: AI 快讯
matrix: ai_media
type: news
audience: 日常在工作、学习和生活中使用或准备使用 AI 的中文观众；具体题目按实际受益人群说明范围
promise: 让观众抓住 AI 重要变化，并理解它们会怎样影响自己的用法
production_ids:
- flash_daily
render_inheritance: source_compatible
render:
  packaging:
    label: AI 快讯
presentation:
  strategy: 用变化前后的操作或使用状态建立画面，截图聚焦本次变化所在的区域。让开场的网站、账号、文件或任务对象持续出现，功能、费用与额度的变化随旁白逐步展开。流程使用简短的对象名和动作标签，先让观众看懂整体，再聚焦当前一步；概念说明贴着这一步出现。版本日期、热度作为辅助标签，收束时保留最值得记住的一处用法变化。
  preferred_visuals:
  - 重点卡
  - 真实截图
  - 关键数字
status: configured
notes: 不要写成新闻联播式通稿，也不要扩写成长篇技术调查报告。标题里最重磅的主菜必须排在正文第一个 item 且控制在 3 段以内，其余每条控制在 2 段左右；opening 只用 1 到 2 句点出本期共同张力，绝不提前复述第一节的数字和结论。每条讲清三件事：真正变了什么（点破缺失基线、限研究或未公布边界）、咬到哪类人或工作流（谁受影响/谁不用慌），以及立刻该查的版本/配置动作或盯紧的关键信号。口播严禁念具体 IP 地址、邮箱、Git PR/分支路径、长串隐藏文件名（如 .npmrc/.netrc）或大写环境变量全名，用一句大白话概括机制，具体文件名和命令留给画面；引用材料数字时保留原小数位，不自行四舍五入抹掉小数。
