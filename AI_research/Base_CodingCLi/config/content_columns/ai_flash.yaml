schema_version: 1
name: AI 快讯
matrix: ai_media
type: news
audience: 已经在工作中使用 AI 的开发者和高频使用者
promise: 让观众抓住一个 AI 重要变化，并理解它会怎样影响自己的用法
production_ids:
- flash_daily
render_inheritance: source_compatible
render:
  packaging:
    label: AI 快讯
presentation:
  strategy: 用变化前后的操作或使用状态建立画面，截图聚焦本次变化所在的区域；功能、操作、费用与额度的变化随旁白逐步出现。版本日期、热度和阅读时间作为辅助标签。讲到用户接下来怎么用时，直接展示相应操作、设置或选项，让画面中的对象从开头延续到收束。
  preferred_visuals:
  - 重点卡
  - 真实截图
  - 关键数字
status: configured
notes: 围绕本期一个最值得关注的变化，找到与观众具体工作任务的联系。开场就让观众知道哪种用法受到影响，再按本期需要展开新结果、问题或前后差异。背景帮助理解变化，主要篇幅留给能力、成本、门槛或操作方式怎样改变。收束时回到开场的工作任务，交代观众现在可以怎样使用、选择或保持现状。标题说出具体看点，讲述顺序与节奏由作者选择。
