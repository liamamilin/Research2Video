name: 每日重要热点合集
matrix: hot_trends
type: news
promise: 串联当日除重磅单条外的跨领域重要热点，帮观众一气看完经济、商业、科技与产业的关键动态。
production_ids:
- hot_trends_daily
content_mode: episode
notes: 不要写成财经推送通稿。标题里最重磅的一条必须排在正文第一个 item（控制在 3 段以内，其余每条 2 段左右）；opening 只用 1 到 2 句点题或直接进正文，严禁提前复述第一节的数字和结论。每条不要只念“发生了什么、官方没公布多少”，必须点出真正改变哪笔账或哪类人的利益（基线缺失或前提有限就顺手点破），并落到普通人可核对的动作或接下来盯紧的唯一关键信号；同一事实或数字全篇只说一次，不车轱辘重复。
