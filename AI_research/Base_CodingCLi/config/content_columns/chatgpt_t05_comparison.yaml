schema_version: 1
name: T05 · AI 产品横向选择
matrix: chatgpt_acquisition
type: comparison
audience: 需要在不同 AI 工具间做选择的中文工作、学习与日常使用人群
promise: 不同需要下，哪些 AI 工具值得用、怎样搭配
production_ids:
- chatgpt_t05_comparison
render_inheritance: content_matrix
render:
  packaging:
    label: AI 产品横向选择
presentation:
  strategy: 围绕同一用户任务展开选型，按「核心分水岭 → 什么人选各自选项 → 各自最隐蔽的坑 → 拍板口诀」推进画面。用关键数字或价格差引出分水岭，用对比卡清晰区分不同人群的选型落点，用流程或重点卡单独捅破隐藏成本、限额或权限风险，不连续堆砌对称优缺点列表。
  preferred_visuals:
  - 并排输出对比
  - 价格卡
  - 对比表
  - 产品真实截图
  - 操作步骤
status: configured
notes: 不要写端水的优缺点列表或逐家念说明书。按「核心分水岭 → 什么具体人群直接选 A / 选 B（落到真实动作、账号与门槛，禁用空标签）→ 各自最隐蔽的坑（只挖材料里已有的隐藏成本、限额、权限风险或限制，不强求对称、不编造）→ 一句话拍板」展开。
content_mode: individual
