schema_version: 1
name: 产业链的一处变化
matrix: industry
type: news
audience: 好奇产品如何被造出、希望看懂制造与供应链关系的普通观众
promise: 理解一处变化落在生产交付的哪一环，以及它怎样改变前后环节
production_ids:
- industry_daily
render_inheritance: source_compatible
render:
  packaging:
    label: 产业链的一处变化
presentation:
  preferred_visuals:
  - 工艺流程
  - 结构图
  - 真实素材
  strategy: 持续跟踪同一产品的材料、操作、可见特征与状态变化，原做法和本次改变围绕同一位置展开。利用材料中已有的实物或结构信息让观众认出正在加工的对象，图示聚焦当前动作和结果。工序交接时让交出方、产品新状态与接手方同时可读，局部聚焦仍能辨认这段关系。旁白换到某个工具或条件时，对应对象和作用随句出现；数字贴着当步比较。结尾继续原产品进入下一操作，连起变化怎样传到交付。
status: configured
notes: 从当前工序发生的具体变化进入，沿同一件产品说明原来怎样做、如今改变哪一步、交给下一环节的东西怎样不同。设备、材料与伙伴在它承担的动作中出现；数字帮助解释当步的尺度与取舍。保留可见特征、操作和前后状态，让一环变化通过一次交接传到下一方。背景平台参数与行业位置简洁服务主过程，结尾继续这件产品的新操作和交付结果。取材备忘留作作者背景，标题、段落与节奏由本期材料组织。
