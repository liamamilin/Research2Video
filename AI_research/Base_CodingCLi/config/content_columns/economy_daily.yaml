schema_version: 1
name: 变化怎样传到你
matrix: economy
type: news
audience: 关心钱与生活、希望理解经济变化怎样影响具体选择的普通观众
promise: 看懂一处经济变化经过哪些环节，影响谁的一次选择或一笔账
production_ids:
- economy_daily
render_inheritance: source_compatible
render:
  packaging:
    label: 变化怎样传到你
presentation:
  preferred_visuals:
  - 趋势图
  - 对比图
  - 传导流程
  strategy: 沿同一组家庭、企业、订单或支出建立可读传导路径。讲到当前交接时，让变化前后与交接双方同时可见，局部聚焦仍能辨认所处关系。数字与图表贴着正在变化的成本、收入或选择，比较保持相同对象、时间范围和含义；读法随当前差异展开。保留具体操作与结果，最后沿原参与者所作决定和下一方的新状态继续推进，让观众看清主场景的变化，背景统计保持简洁。
status: configured
notes: 从一个家庭、企业或一笔支出的具体变化进入，让同一位参与者先完成一次选择，再沿订单、付款或排班把结果传到下一方。每段解释当前关系怎样改变，相关政策和数字贴着这一环节出现；保留操作、过程与生活细节，让主场景持续前进。背景调查、分组统计与相邻国家的例子在帮助理解当步时简洁进入，再接回原选择。取材备忘作为作者背景，口播篇幅用于已有的行动与解释，结尾把开场账单和最后一方得到的结果连起来；标题与节奏由本期材料组织。
