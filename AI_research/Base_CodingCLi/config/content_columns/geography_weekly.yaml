schema_version: 1
name: 地理如何塑造生活
matrix: geography
type: explainer
audience: 想看懂一个地方为何如此、空间与环境怎样影响生活的普通观众
promise: 用一个持续例子理解地形、位置或环境怎样形成生活和发展差异
production_ids:
- geography_weekly
render_inheritance: source_compatible
render:
  packaging:
    label: 地理如何塑造生活
presentation:
  preferred_visuals:
  - 地图
  - 空间变化
  - 统计图
  strategy: 优先利用材料已有的地图、剖面和地点图像建立位置，用现有关系图解释当前两端、路径与生活结果。移动、交接和结果随当步旁白推进，局部聚焦保留必要的相邻关系；比较保持同一问题、对象称呼与尺度。数字贴当前量与位置，随下一步活动推进，最后沿同一例子的新结果汇合解释。图像说明简短指向当前可见对象。
status: configured
notes: 尽早以同一地点或一组可比较地点的具体位置与生活问题建立本期主问题。沿材料中的地形、远近、上下游、通道或设施连接，追着同一个例子的移动、进入与生活后果解释空间差异怎样形成。保留推理、过程和细节，比较对齐同一问题与尺度；机构、资金和争论在改变当前空间路径或活动时进入。旁白直接描述当地的人、路线和结果，研究备忘供作者构思。结尾跟随这个例子的改变连起机制，作者按材料组织标题、篇幅和节奏。
