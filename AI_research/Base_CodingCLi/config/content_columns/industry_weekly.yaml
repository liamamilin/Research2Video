schema_version: 1
name: 一件东西怎样造
matrix: industry
type: explainer
audience: 好奇产品如何被造出、希望看懂制造与供应链关系的普通观众
promise: 通过同一件产品的经历，理解关键制造步骤、分工和取舍
production_ids:
- industry_weekly
render_inheritance: source_compatible
render:
  packaging:
    label: 一件东西怎样造
presentation:
  preferred_visuals:
  - 工艺流程
  - 结构图
  - 真实素材
  strategy: 沿同一产品逐步展开用途、材料、工序与前后状态，保留材料已有的结构和可见特征。当前工具、作用位置和产出随旁白推进，比较保持相同对象与尺度；设备配套逐项贴回正在解释的动作。放大工序时同时保留产品当前状态与前后交接方向，让交出方和接手方可读。时间或规模贴在对应过程，讲述下一步时画面继续该步。最终沿产品的新状态到达交付结果，连起用途、关键工序与分工。
status: configured
notes: 从这件东西要达到的具体用途进入，跟随同一产品经过材料中的关键制造步骤，逐步解释工具怎样作用、结构或状态怎样变化、为何需要这个条件。设备与伙伴在产品交到它手上的那一步进入，每项配套硬件贴着它负责的动作和结果说明。沿具体例子把做出来接到可重复交付，数字和时间贴在当前工序；背景参数、取材备注与相邻应用简洁带过，再回到产品下一步。结尾连起开场用途与最终交付，讲述深度和篇幅用于过程，标题与节奏由材料决定。
