schema_version: 1
name: 现象背后的原理
matrix: science
type: explainer
audience: 喜欢追问为什么，希望通过具体例子理解科学原理的普通观众
promise: 围绕一个现象逐步理解它如何发生，并能用这套理解认识相近的事情
production_ids:
- science_weekly
render_inheritance: source_compatible
render:
  packaging:
    label: 现象背后的原理
presentation:
  strategy: 保持一个主现象和具体对象随整期推进，用局部结构、作用方向与状态变化解释机制。先用可读的对象关系建立当前位置；跨尺度时说明对象和尺度，类比图与真实对象承担同一步关系。对照和流程的对象名称、颜色与位置连贯，当前一对对象或相邻一步随旁白突出，机制推进后回到主例子显示新增结果。相关图片、实验和图表服务这一层解释，收束回放主例子的关键变化。最后的回顾使用主例子的关键动作与状态变化，让观众在同一个对象上看到开场疑问如何得到解释。
    对照先同时交代比较对象与维度，背景规模和制作资源保持简洁，核心解释使用当前对象的作用关系。
  preferred_visuals:
  - 原理动画
  - 实验图
  - 图表
status: configured
notes: 围绕材料中一个可以深入解释的现象，让具体对象的一次经历贯穿整期。沿动作、状态和结果逐层讲清它如何发生，每一层都让开场例子实际前进一步。类比帮助建立当前一步的直觉，接着落回真实对象；公式、术语、历史发现和相近实验解释这一层机制后接回主线。材料中的未取得参数与取材备忘留作作者背景，把篇幅用在本期已有的过程与解释。需要说明的适用条件贴着对应结果出现。结尾沿主例子回放关键关系，重新回答开场，再带到一个相近现象；作者按材料组织标题、段落和节奏。
