# 主题分类独立于报告频率，复用原有制作绑定。
categories:
- key: history_turns
  name: T01 · 事件与关键转折
  promise: 一个重要变化怎样由连续行动形成？
  type: explainer
  production_ids:
  - history_weekly
  keywords:
  - 事件与关键转折 一个重要变化怎样由连续行动形成？
  notes: 围绕一个具体问题展开，让同一个对象贯穿材料、过程和结果。从一个具体历史场景进入；认识当时的处境和参与者；跟随连续行动和变化；连接后续影响。
