# 主题分类独立于报告频率，复用原有制作绑定。
categories:
- key: consumer_choices
  name: T01 · 需求与选购
  promise: 怎样从自己的需求缩小产品选择？
  type: comparison
  production_ids:
  - consumer_weekly
  keywords:
  - 需求与选购 怎样从自己的需求缩小产品选择？
  notes: 围绕一个具体问题展开，让同一个对象贯穿材料、过程和结果。说明具体使用者和环境；列出真正要完成的任务；比较影响任务的差异；给出按需求选择的路径。
