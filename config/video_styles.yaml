# 视频讲稿风格：深浅 × 语气。见 spec/video-adaptation.md 第三节。
#
# 改一个预设就把它的 version 加 1；讲稿版本记录用的是哪一版（如 explainer@1），
# 所以旧版本的风格仍然查得到。

depths:
  intro:
    name: 入门
    version: 1
    audience: 没用过这类工具的观众，不熟悉行业名词
    max_new_terms_per_section: 1
    guidance: |
      观众没用过这类工具。所有术语都要铺垫，包括 token、API 这类基础词。
      全片只保留 3 到 5 个关键数字，全部换算成观众熟悉的量。每节最多引入 1 个新概念。
  intermediate:
    name: 进阶
    version: 1
    audience: 用过这类工具、知道基础名词的从业者或爱好者
    max_new_terms_per_section: 2
    guidance: |
      观众用过这类工具，知道 token、API、模型这类基础名词，不用解释。
      只铺垫这个话题特有的概念。关键数字要有参照：倍数、对比，或换算成具体的钱和时间。
      每节最多引入 2 个新概念。
  expert:
    name: 专家
    version: 1
    audience: 每天和这类工具打交道的从业者
    max_new_terms_per_section: 0   # 0 表示不限
    guidance: |
      观众是从业者。不铺垫行业通用词，只澄清容易误解的地方。
      可以保留精确数字和口径，重点讲取舍和反常识的地方。

tones:
  concise:
    name: 简洁干货
    version: 1
    guidance: |
      定位：给时间紧的从业者，结论先行。
      句式：短句，以陈述句为主，少修饰。
      修辞：不用类比就讲不清时才用类比。
      节奏：一节一个要点，不回顾，不铺垫情绪。
      结构偏好：结论 → 依据 → 做法。
      禁忌：寒暄、反问堆叠、「我们来看看」这类空转句。
    example: |
      缓存的账就两个数。存进去，多付 25%。之后原样再用，只付一折。Opus 5.5 和 Sonnet 5.5 又把再用的价格砍了一半。按 Opus 5.5 算，正常 4 美元的输入，走缓存只要 2 毛。
  explainer:
    name: 讲解通俗
    version: 2   # v1 让每个新概念都配类比，C4 一篇用了 6 个类比，太散
    guidance: |
      定位：老师把学生讲明白，先提问题再给答案。
      句式：口语，可以自问自答。
      修辞：全片用一个贯穿的生活类比（最多再加一个），类比的每个部分都要能对应到真实概念；其余概念用白话讲清楚。
      节奏：每节结尾一句小结；长视频大约每 2 分钟回顾一次讲到哪了。
      结构偏好：问题 → 类比 → 机制 → 证据 → 怎么做。
      禁忌：类比对不上；居高临下（「这很简单」）。
    example: |
      打个比方，提示词缓存就像复印店。第一次把原稿交给店员存档，要多付一点存档费，比正常价贵四分之一。之后你只要说「照上次那份再来一份」，价格只有原来的一成。到了 Opus 5.5 和 Sonnet 5.5，「再来一份」又便宜了一半。按 Opus 5.5 的价格，正常 4 美元的输入，走缓存只要 2 毛钱。
  playful:
    name: 风趣口语
    version: 1
    guidance: |
      定位：朋友聊天，好笑但不糊弄。
      句式：口语，可以用俗语和网络说法，适度吐槽。
      修辞：夸张的比喻、反差。
      节奏：每分钟最多一两个包袱，抖完马上回到正题。
      结构偏好：反差开场 → 吐槽现象 → 讲清机制 → 给招。
      禁忌：笑点只能落在比喻和语气上，不能落在事实上：不夸大数字，不编情节；可以调侃现象，不调侃具体的公司和个人。
    example: |
      缓存这事儿，说白了就是头一回贵，往后白菜价。头一回存进去，多掏 25% 的开户费；往后只要原样再来，直接打一折。Opus 5.5 和 Sonnet 5.5 更狠，再对半砍。按 Opus 5.5 算，4 美元的活儿，2 毛钱拿下。前提是你得「原样」再来，差一个字节？不好意思，重新开户。
  story:
    name: 故事案例
    version: 1
    guidance: |
      定位：用一个场景串起全片，让观众代入。
      句式：叙述，有起伏：遇到问题 → 找原因 → 解决。
      修辞：场景细节只为事实服务，不添加新事实。
      节奏：场景开场，中段跳出来讲机制，结尾回到场景。
      结构偏好：场景 → 困惑 → 机制 → 解决 → 你也可以这样做。
      禁忌：虚构的人和事必须让人听得出是假设，只用「你」或明说「假设」；不编人名、公司和数据。
    example: |
      假设你在做一个客服机器人，每次请求前面都带着同一大段说明。缓存开着，月底的账单却比不开还高。翻了半天才发现，说明的第一行写着当前时间。时间一变，缓存就把它当成一份新文件，重新存一遍。每次都多收四分之一的存档费，一次便宜也没占到。
  news:
    name: 新闻播报
    version: 1
    guidance: |
      定位：客观转述，用于今日快讯一类的栏目。
      句式：第三人称，倒金字塔，时间、主体、来源明确。
      修辞：不用类比和玩笑。
      节奏：一条一事，不展开机制。
      结构偏好：发生了什么 → 影响谁 → 下一步看什么。
      禁忌：观点和判断必须说明是谁的。
    example: |
      Anthropic 九月发布的 Opus 5.5 和 Sonnet 5.5，把缓存读取价降到输入价的二十分之一，比之前又降了一半。写入缓存的加价没变，五分钟缓存仍要多付 25%。这意味着，提示词前缀一旦不稳定，开缓存可能比不开还贵。
