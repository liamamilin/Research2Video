# 内容矩阵：领域 × 受众 × 内容类型 × 形态（spec/video-matrix.md）。
#
# 每个维度一份定义，格子（cells）从每个维度各选一项，组合成一个栏目的全部设置，所以栏目的消费方不用改。
# 改一份定义就把它的 version 加 1：文稿版本里记着用的是哪一版。
# 同一个字段多处设置时：类型对形态的设置 > 形态 > 类型 > 受众 > 领域；受众限制语气，格子允许的语气是类型允许的、受众也允许的那些。
# 格子的 key 是旧的栏目名（flash、point_short、deep_dive），保持旧文稿能用；不写 key 就用四个维度拼成的 id。
# status：enabled 已有真实成片验证；experimental 只定义了、没出过片；blocked 不能用，要写 reason。
# 类型下 formats 里没有的形态，这个类型不支持它。
# recheck: true 的类型（快讯）在发布前可以手动复核一次：联网查稿子里的事实自写稿以来有没有变化。
# 视频形式（画面怎么组织）挂在类型下：allowed_forms 是能用的，default_form 是默认的；形态的 forms 只做限制，取交集。
# 受众的话填进类型文字里的插槽：{audience}（短称）写在行内，{audience_impact} 也在行内，{audience_guidance}、{audience_research} 单独占一行（受众没有就删掉这一行）。
# 格子的组合结果必须和 tests/golden/video_cells.json 一致（有意的变更才重新生成）。
# config/video_columns.yaml 仍可写单个栏目（老格式）。

domains:
  ai:
    name: AI 与软件
    version: 1
audiences:
  developer:
    name: 开发者
    label: 开发者
    version: 1
    depth: intermediate
    tones: [news, concise, explainer, playful, story]
    impact: 谁受影响、多花或少花多少、要改什么
  non_tech:
    name: 会用 AI 的非技术人员
    label: 普通用户
    version: 1
    depth: intro
    tones: [news, concise, explainer, playful, story]
    impact: 谁受影响、每月多花或少花多少、要不要换工具或改设置
    video_hint: 会用 ChatGPT、Claude 这类 AI 工具、但不写代码的人；画面少用术语，不出现命令和参数
    guidance: |
      读者会用 ChatGPT、Claude 这类 AI 工具，但不写代码，也不看技术文档。
      - token、API、模型、上下文这类词第一次出现就用一句白话解释，或换成日常说法；不出现命令、参数、代码。
      - 数字换算成他们能感觉到的量：每月多花多少钱、能多聊多久，不用「每百万 token」这类口径。
      - 举例用写邮件、做表格、查资料、整理笔记这类日常场景。
      - 动作只说去哪个设置里点什么、要不要换套餐，不写代码。
    research: |
      读者是不写代码的普通用户：优先官方帮助页、套餐和价格页、产品更新说明里用户能直接感受到的变化；少用基准测试、代码仓库和 API 文档作主要证据；技术细节只在影响用户时才写。
video_forms:
  information_motion:
    name: 信息动效
    fits: 一个变化、一组数字、几个并列要点；快讯、知识点、对比、盘点
  process_diagram:
    name: 流程图解
    fits: 有先后步骤或因果链的内容；教程、机制讲解
  auto:
    name: 自动
    fits: 让 AutoVideo 在信息动效和流程图解里选
formats:
  short:
    name: B 站横屏短
    version: 1
    voice_id: voxcpm_anchor
    target_minutes: 1.5
    source_card: true
  long:
    name: B 站横屏长
    version: 1
    voice_id: voxcpm_anchor
    target_minutes: 6
types:
  deep_dive:
    name: 深度解读
    version: 1
    description: 把一个值得讲清楚的问题讲透：先给结论，再按证据强弱展开，讲清反方和局限，最后给可执行的动作。
    research_timeout_seconds: 3600
    purpose: 知识讲解
    allowed_forms: [auto, information_motion, process_diagram]
    default_form: auto
    default_tone: explainer
    allowed_tones: [concise, explainer, playful, story]
    required_roles: [钩子, 反方, 行动]
    research_prompt: |
      你是一名技术研究员，为一位制作 AI / 软件类知识视频的创作者做选题调研。你的报告会被写成一篇约 {topic_minutes} 分钟的口播文稿，文稿里的每个事实都要能追溯到你引用的网页，所以每个关键判断都要给出原始网址。

      ## 选题
      - 标题：{topic_title}
      - 核心角度：{topic_angle}
      - 目标受众：{topic_audience}
      - 为什么有人在乎：{topic_why}
      - 建议大纲：{topic_outline}

      ## 任务
      围绕这个选题做深度调研：先直接回答它要回答的问题，再给出支撑证据、反方证据和仍未确定的部分。证据以 {date_7d_ago} 至 {date} 的信息为主；更早的关键资料可以用，但要注明原始日期。
      输出语言：{language}。

      ## 证据规则
      1. 每个关键判断附来源网址和发布日期。优先官方文档、发布说明、代码仓库、论文、定价页等一手来源；媒体和社区帖子只作补充。
      2. 网址必须是你实际检索到的真实页面，禁止编造、猜测或拼接网址；不确定就不写。
      3. 核心结论尽量由两个相互独立的来源支撑；只有厂商自己的说法时，标注「厂商自述，未独立验证」。
      4. 给出反方证据或失败案例；确实找不到时写明「未找到反方证据」。
      5. 区分「已证实」「有迹象」「推测」，不把推测写成事实。
      6. 数字（价格、版本号、日期、比例）照来源原样写，注明口径。
      {audience_research}

      ## 输出结构
      ### 1. 直接回答
      ### 2. 关键事实（表格：事实 | 置信度 | 来源编号）
      ### 3. 争议与反方证据
      ### 4. 仍未确定的问题
      ### 5. 适合视频的讲述角度（不超过 3 条）
      ### 6. 来源清单
      编号列表，每行一个来源：编号. 标题 | 一手/二手 | 发布日期 | 完整网址
    script_style: |
      栏目「深度解读」：把一个问题讲透，而不是罗列新闻。
      - 开场用一个具体场景或冲突把问题抛出来（1 段），紧接着给结论。
      - 主体按证据强弱展开：先讲已证实的，再讲有迹象的，推测必须明说是推测。
      - 必须有一节讲反方、局限或还不确定的地方。
      - 结尾给观众 2–4 个本周就能做的具体动作。
      - 4–6 节，每节 2–5 段，每段 60–140 字，口语化，适合朗读。
      {audience_guidance}
    formats:
      long:
        writer: adapt
        sections: [4, 6]
        paragraph_units: [60, 140]
  quick_take:
    name: 快讯
    version: 1
    description: 一个变化讲清楚：改了什么（旧到新）、对{audience}意味着什么、现在该做什么。
    research_timeout_seconds: 1500
    recheck: true
    purpose: 知识讲解
    allowed_forms: [information_motion]
    default_form: information_motion
    default_tone: news
    allowed_tones: [news, concise]
    required_roles: [钩子, 行动]
    research_prompt: |
      你是一名技术研究员，为一位制作 B 站 60–90 秒 AI / 软件开发快讯视频的创作者核实一条变化。你的报告会被写成约 {topic_minutes} 分钟的口播文稿，文稿里的每个事实都要能追溯到你引用的网页，所以每个关键判断都要给出原始网址。

      ## 条目
      - 标题：{topic_title}
      - 一句话：{topic_angle}
      - 发布日期：{topic_date}
      - 变化（旧 → 新）：{topic_change}
      - 对{audience}的影响：{topic_why}
      - 候选来源：
      {topic_sources}

      ## 任务
      核实这条变化是否属实、数字是否准确，并找出它对{audience}的实际影响。检索保持克制：以核实为主，不做背景综述。
      1. 打开候选来源，确认日期、旧到新的数字、适用范围（哪些套餐、哪些模型、什么时候生效）。
      2. 找一个独立来源交叉核对核心数字；只有厂商自己的说法时，标注「厂商自述，未独立验证」。
      3. 找出例外、生效条件或隐藏的计费坑；确实找不到时写明「未找到限制条件」。
      4. 数字（价格、版本号、日期、比例）照来源原样写，注明口径（输入还是输出、每百万 token 还是每次）。
      证据以 {date_7d_ago} 至 {date} 的信息为主；更早的关键资料可以用，但要注明原始日期。
      输出语言：{language}。

      ## 证据规则
      1. 每个关键判断附来源网址和发布日期。优先官方文档、发布说明、代码仓库、论文、定价页等一手来源；媒体和社区帖子只作补充。
      2. 网址必须是你实际检索到的真实页面，禁止编造、猜测或拼接网址；不确定就不写。
      3. 区分「已证实」「有迹象」「推测」，不把推测写成事实。
      {audience_research}

      ## 输出结构
      ### 1. 直接回答
      ### 2. 关键事实（表格：事实 | 置信度 | 来源编号）
      ### 3. 限制与反方证据
      ### 4. 仍未确定的问题
      ### 5. 适合快讯的讲法（不超过 2 条）
      ### 6. 来源清单
      编号列表，每行一个来源：编号. 标题 | 一手/二手 | 发布日期 | 完整网址
    script_style: |
      栏目「快讯」：60–90 秒讲清一个变化，不铺垫背景，不罗列。
      - 第一句是钩子：直接说变化和它的数字，或一个让{audience}停下来的问题；不说「大家好」，不说「今天」。
      - 然后讲变化：旧的是什么、新的是什么；数字、单位、口径照来源原样，价格要说清是输入还是输出、每百万 token 还是每次。
      - 再讲对{audience}意味着什么：{audience_impact}。数字只留最关键的 2–3 个；上下文长度、输出上限、各档位价格这类参数，除非它们就是这条快讯的变化，否则不讲。
      - 最后一句给一个现在就能做的动作。
      - 只有厂商自己的说法时，口播里说「官方说法」，不要说成已经验证的事实。
      - 2–4 个小节，每节 1–2 段，每段 20–90 字，口语化，适合朗读。
      {audience_guidance}
    formats:
      short:
        target_minutes: 1.25
        writer: legacy
        sections: [2, 4]
        paragraph_units: [20, 90]
        package:
          accent: '#1f7a4d'
          badge: 快讯
          intro:
            template: stinger
            title: 快讯
            subtitle: '{date}'
            seconds: 1.5
            sound: synth_sting
          outro:
            template: end_card
            title: 快讯
            lines: ["面向{audience}的 AI 快讯"]
            seconds: 3
            sound: synth_sting
  one_point:
    name: 一个知识点
    version: 1
    description: 60–120 秒只讲清楚一件事：一个结论、一个关键数字或例子、一个能马上做的动作。
    research_timeout_seconds: 1800
    purpose: 知识讲解
    allowed_forms: [information_motion]
    default_form: information_motion
    default_tone: explainer
    allowed_tones: [concise, explainer, playful]
    required_roles: [钩子, 行动]
    research_prompt: |
      你是一名技术研究员，为一位制作 B 站 60–120 秒 AI / 软件知识短视频的创作者核实一个知识点。你的报告会被写成约 {topic_minutes} 分钟的口播文稿，文稿里的每个事实都要能追溯到你引用的网页，所以每个关键判断都要给出原始网址。

      ## 知识点
      - 标题：{topic_title}
      - 核心角度：{topic_angle}
      - 目标受众：{topic_audience}
      - 为什么有人在乎：{topic_why}

      ## 任务
      只围绕这一个点：先直接回答它要回答的问题，再给出最关键的一个数字或例子，以及它成立的前提和例外。不展开相邻话题。
      证据以 {date_7d_ago} 至 {date} 的信息为主；更早的关键资料可以用，但要注明原始日期。
      输出语言：{language}。

      ## 证据规则
      1. 每个关键判断附来源网址和发布日期。优先官方文档、发布说明、代码仓库、论文、定价页等一手来源。
      2. 网址必须是你实际检索到的真实页面，禁止编造、猜测或拼接网址；不确定就不写。
      3. 区分「已证实」「有迹象」「推测」，不把推测写成事实。
      4. 数字照来源原样写，注明口径。
      {audience_research}

      ## 输出结构
      ### 1. 直接回答
      ### 2. 关键事实（表格：事实 | 置信度 | 来源编号）
      ### 3. 前提、例外与反方证据
      ### 4. 仍未确定的问题
      ### 5. 适合短视频的讲法（不超过 2 条）
      ### 6. 来源清单
      编号列表，每行一个来源：编号. 标题 | 一手/二手 | 发布日期 | 完整网址
    script_style: |
      栏目「一个知识点」：60–120 秒只讲清楚一件事，让观众看完能自己复述。
      - 第一句是钩子：一个具体场景、反常识的结果或观众关心的问题；不说「大家好」。
      - 然后只讲这一个点：先给结论，再给一个最关键的数字或例子，必要时用一句话说明前提或反方。
      - 术语第一次出现就用一句白话解释；不引入第二个新概念。
      - 最后一句给一个本周就能做的动作。
      - 不依赖前文：观众没有看过这个系列的其他视频。
      - 2–4 个小节，每节 1–2 段，每段 30–100 字，口语化，适合朗读。
      {audience_guidance}
    formats:
      short:
        target_minutes: 1.5
        writer: legacy
        sections: [2, 4]
        paragraph_units: [30, 100]
        package:
          accent: '#1f7a4d'
          badge: 一个知识点
          outro:
            template: end_card
            title: 一个知识点
            lines: ["面向{audience}的 AI 知识点"]
            seconds: 2.5
            sound: synth_sting
  roundup:
    name: 盘点
    version: 1
    description: 把一批值得知道的变化按顺序讲一遍：每条一个小节，说清变了什么、对{audience}意味着什么，最后给出先做哪件事。
    topic_kind: roundup
    purpose: 知识讲解
    allowed_forms: [information_motion]
    default_form: information_motion
    default_tone: concise
    allowed_tones: [news, concise, explainer]
    required_roles: [钩子, 行动]
    script_style: |
      栏目「盘点」：把选题里列出的条目逐条讲完，条目数和顺序照选题的「条目」，不增不减，也不加报告里没列入的条目。
      - 开场一句话交代这期盘点什么、一共几条，并点出最值得先看的一条。
      - 每条一个小节：先说变了什么（数字、单位、口径照来源原样），再说对{audience}意味着什么：{audience_impact}。每条 30–60 秒的口播量，不展开背景。
      - 条目之间用一句话过渡，不重复上一条的结论。
      - 结尾从这几条里挑最该先做的一件事，给一个现在就能做的动作。
      - 事实只用研究报告里有来源的；只有厂商自己的说法时，口播里说「官方说法」。
      {audience_guidance}
    formats:
      long:
        target_minutes: 4
        writer: legacy
        sections: [3, 11]
        paragraph_units: [30, 100]
  comparison:
    name: 对比
    version: 1
    description: 把两个对象放在同几个维度上比：每个维度谁强谁弱、差多少，最后说明什么情况下选哪个。
    topic_kind: comparison
    research_timeout_seconds: 2400
    purpose: 知识讲解
    allowed_forms: [information_motion]
    default_form: information_motion
    default_tone: explainer
    allowed_tones: [concise, explainer, playful]
    required_roles: [钩子, 证据, 行动]
    research_prompt: |
      你是一名技术研究员，为一位制作 AI / 软件类知识视频的创作者准备一个对比。你的报告会被写成约 {topic_minutes} 分钟的口播文稿，文稿里的每个事实都要能追溯到你引用的网页，所以每个关键判断都要给出原始网址。

      ## 选题
      - 标题：{topic_title}
      - 对比对象（两个）：{topic_subjects}
      - 对比维度：{topic_dimensions}
      - 核心角度：{topic_angle}
      - 目标受众：{topic_audience}

      ## 任务
      把两个对象放在同一组维度上逐项比较。每个维度两边都要有数字或可核对的事实，口径一致（同一套餐、同一版本、同一单位）；一边没有公开数据时写明「未公开」，不估算。最后总结：什么情况下选哪一个，以及哪些结论取决于使用场景。
      证据以 {date_7d_ago} 至 {date} 的信息为主；更早的关键资料可以用，但要注明原始日期。
      输出语言：{language}。

      ## 证据规则
      1. 每个关键判断附来源网址和发布日期。优先官方文档、定价页、发布说明、代码仓库、论文等一手来源。
      2. 网址必须是你实际检索到的真实页面，禁止编造、猜测或拼接网址；不确定就不写。
      3. 核心数字尽量由两个相互独立的来源支撑；只有厂商自己的说法时，标注「厂商自述，未独立验证」。
      4. 区分「已证实」「有迹象」「推测」，不把推测写成事实。
      5. 数字（价格、版本号、日期、比例）照来源原样写，注明口径。
      {audience_research}

      ## 输出结构
      ### 1. 直接回答（一句话：整体上谁更适合谁）
      ### 2. 逐维度对比（表格：维度 | 对象一 | 对象二 | 来源编号）
      ### 3. 取决于场景的结论
      ### 4. 仍未确定的问题
      ### 5. 适合视频的讲述角度（不超过 3 条）
      ### 6. 来源清单
      编号列表，每行一个来源：编号. 标题 | 一手/二手 | 发布日期 | 完整网址
    script_style: |
      栏目「对比」：两个对象放在同几个维度上比，不做各自的产品介绍。
      - 开场一句话说清比的是谁和谁、比哪几项，并先给整体结论。
      - 主体每个维度一个小节：先说谁强，再给两边的数字（单位、口径一致），一句话说差在哪。维度照选题的「对比维度」，不加别的。
      - 一边没有公开数据就说「未公开」，不估算、不拿别的口径凑。
      - 必须有一节讲「什么情况下选哪个」，结论取决于场景时要明说。
      - 结尾给{audience}一个现在就能做的动作：{audience_impact}。
      - 3–6 个小节，每节 1–3 段，每段 30–100 字，口语化，适合朗读。
      {audience_guidance}
