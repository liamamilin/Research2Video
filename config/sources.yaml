# 信息源注册表：每个源只在这里写一次；Job 的 sources 里用 `source:<id>` 引用单个源，用 `tag:<标签>` 引用一类
# （也可以继续直接写 `rss:网址` 这样的完整写法）。标签没有固定含义，Job 要什么就按什么标签取。
# spec 的写法见 core/sources.py 开头；note 写这个源的限制：只有标题、付费、版权、抓取偶尔失败等。
# 2026-10-22 逐个用项目自己的抓取器试过，下面的都抓到了条目。

# --- AI（AI 视频栏目现有 Job 用的；Job 里还是完整写法，后面改引用也不影响抓取） ---
tldr_ai:
  name: TLDR AI
  spec: tldr:ai
  tags: [ai]
  note: 周末没有新一期，抓最近几天的
therundown:
  name: The Rundown AI
  spec: rss:https://www.therundown.ai/feed
  tags: [ai]
import_ai:
  name: Import AI
  spec: rss:https://importai.substack.com/feed
  tags: [ai]
hf_papers:
  name: Hugging Face 每日论文
  spec: hf_papers:daily
  tags: [ai, science]
hf_models:
  name: Hugging Face 热门模型
  spec: hf_models:trending
  tags: [ai]
aa_models:
  name: Artificial Analysis 模型榜
  spec: aa:models
  tags: [ai]
gh_new_llm:
  name: GitHub 新项目 · llm
  spec: gh_new:llm
  tags: [ai, software]
gh_new_agent:
  name: GitHub 新项目 · agent
  spec: gh_new:agent
  tags: [ai, software]

