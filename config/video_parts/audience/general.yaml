# 观众档案（给谁看）：配方里的 {{audience}}、{{audience.depth}}、{{audience.<名>}} 由它填，字段说明见 spec/video-recipes.md。
# 这一份给「专题速览」这类和领域无关的配方：观众对这个领域没有基础，但愿意听。

name: 大众观众
status: experimental
depth: intro
creative_intent:
  purpose: 知识讲解
  audience: 对这个领域没有专业基础、但愿意花几分钟弄明白一件事的人；画面少用术语和缩写
text:
  impact: 这件事和普通人有什么关系，它改变了什么，值不值得继续关注
  writing_rules: |
    观众对这个领域没有专业基础，也没有看过任何原始材料。
    - 专业名词、缩写、机构名第一次出现，只能用报告里已经写明的说明来解释，或换成报告里的日常说法；报告没有解释的，就说「报告没有解释它」或干脆不提，不要自己补定义。
    - 数字说清楚它量的是什么、单位和年份（「2025 年全球 GDP 增长 2.3%」，不是「2.3」）；两个口径不同的数字不放在一起比。
    - 区分三种说法：机构、公司自己说的；媒体报道的；第三方测得的数据。口播里用「官方说」「媒体报道」「测试数据显示」，不把后两种写成确定的事实；没有亲自测试过就不说「实测」。
    - 讲因果和关系，不堆名字：每个新名字要么说清它是谁、做什么，要么不提。
    - 有争议或不确定的地方直接说「目前还没有定论」，不替它下结论。
  research_rules: 读者没有专业基础：优先官方发布、原始数据和机构说明，少用二手转述；专业细节只在影响理解时才写。
