# 文稿配方：一份文件就是一种文稿的完整做法（调研 → 写稿 → 出片），字段说明见 spec/video-recipes.md。
# research.template 是 jobs/_templates/video_research/ 下的调研模板，output.use 是 config/video_parts/output/ 下的出片部件。
# 改完在「文稿配方」页保存会先校验；新配方从现有配方复制。

name: 一个知识点
description: 60–120 秒只讲清楚一件事：一个结论、一个关键数字或例子、一个能马上做的动作。
status: experimental
tags:
  domain:
    key: ai
    name: AI 与软件
  audience:
    key: non_tech
    name: 普通用户
  type:
    key: one_point
    name: 一个知识点
  format:
    key: short
    name: B 站横屏短
audience: 普通用户
target_minutes: 1.5
topic:
  kind: single
  sources: [flash]
  fields: [核心角度, 目标受众, 条目数, 条目, 对比对象, 对比维度]
research:
  template: one_point_non_tech
writing:
  pipeline: single
  default_style:
    depth: intro
    tone: explainer
  allowed_tones: [concise, explainer, playful]
  sections: [2, 4]
  paragraph_units: [30, 100]
  required_roles: [钩子, 行动]
  audit:
    model: review
    style_severity: must
    timeout_seconds: 240
  style: |
    栏目「一个知识点」：60–120 秒只讲清楚一件事，让观众看完能自己复述。
    - 第一句是钩子：一个具体场景、反常识的结果或观众关心的问题；不说「大家好」。
    - 然后只讲这一个点：先给结论，再给一个最关键的数字或例子，必要时用一句话说明前提或反方。
    - 术语第一次出现就用一句白话解释；不引入第二个新概念。
    - 最后一句给一个本周就能做的动作。
    - 不依赖前文：观众没有看过这个系列的其他视频。
    - 2–4 个小节，每节 1–2 段，每段 30–100 字，口语化，适合朗读。
    读者会用 ChatGPT、Claude 这类 AI 工具，但不写代码，也不看技术文档。
    - token、API、模型、上下文这类词第一次出现就用一句白话解释，或换成日常说法；不出现命令、参数、代码。
    - 数字换算成他们能感觉到的量：每月多花多少钱、能多聊多久，不用「每百万 token」这类口径。
    - 举例用写邮件、做表格、查资料、整理笔记这类日常场景。
    - 动作只说去哪个设置里点什么、要不要换套餐，不写代码。
output:
  use: motion
  creative_intent:
    purpose: 知识讲解
    audience: 会用 ChatGPT、Claude 这类 AI 工具、但不写代码的人；画面少用术语，不出现命令和参数
  source_card: true
  package:
    accent: '#1f7a4d'
    badge: 一个知识点
    outro:
      template: end_card
      title: 一个知识点
      lines: [面向普通用户的 AI 知识点]
      seconds: 2.5
      sound: synth_sting
