# 文稿配方：一份文件就是一种文稿的完整做法（选题 → 调研 → 写稿 → 出片），字段说明见 spec/video-recipes.md。
# 改完在「文稿配方」页保存会先校验；新配方从现有配方复制。

name: 一个知识点
description: 60–120 秒只讲清楚一件事：一个结论、一个关键数字或例子、一个能马上做的动作。
status: experimental
tags:
  domain:
    key: ai
    name: AI 与软件
  audience:
    key: non_tech
    name: 普通用户
  type:
    key: one_point
    name: 一个知识点
  format:
    key: short
    name: B 站横屏短
audience: 普通用户
target_minutes: 1.5
topic:
  kind: single
  sources: [flash]
  fields: [核心角度, 目标受众, 条目数, 条目, 对比对象, 对比维度]
research:
  mode: job
  timeout_seconds: 1800
  language: zh
  prompt: |
    你是一名技术研究员，为一位制作 B 站 60–120 秒 AI / 软件知识短视频的创作者核实一个知识点。你的报告会被写成约 {topic_minutes} 分钟的口播文稿，文稿里的每个事实都要能追溯到你引用的网页，所以每个关键判断都要给出原始网址。

    ## 知识点
    - 标题：{topic_title}
    - 核心角度：{topic_angle}
    - 目标受众：{topic_audience}
    - 为什么有人在乎：{topic_why}

    ## 任务
    只围绕这一个点：先直接回答它要回答的问题，再给出最关键的一个数字或例子，以及它成立的前提和例外。不展开相邻话题。
    证据以 {date_7d_ago} 至 {date} 的信息为主；更早的关键资料可以用，但要注明原始日期。
    输出语言：{language}。

    ## 证据规则
    1. 每个关键判断附来源网址和发布日期。优先官方文档、发布说明、代码仓库、论文、定价页等一手来源。
    2. 网址必须是你实际检索到的真实页面，禁止编造、猜测或拼接网址；不确定就不写。
    3. 区分「已证实」「有迹象」「推测」，不把推测写成事实。
    4. 数字照来源原样写，注明口径。
    读者是不写代码的普通用户：优先官方帮助页、套餐和价格页、产品更新说明里用户能直接感受到的变化；少用基准测试、代码仓库和 API 文档作主要证据；技术细节只在影响用户时才写。

    ## 输出结构
    ### 1. 直接回答
    ### 2. 关键事实（表格：事实 | 置信度 | 来源编号）
    ### 3. 前提、例外与反方证据
    ### 4. 仍未确定的问题
    ### 5. 适合短视频的讲法（不超过 2 条）
    ### 6. 来源清单
    编号列表，每行一个来源：编号. 标题 | 一手/二手 | 发布日期 | 完整网址
writing:
  pipeline: single
  default_style:
    depth: intro
    tone: explainer
  allowed_tones: [concise, explainer, playful]
  sections: [2, 4]
  paragraph_units: [30, 100]
  required_roles: [钩子, 行动]
  audit:
    model: review
    style_severity: must
    timeout_seconds: 240
  style: |
    栏目「一个知识点」：60–120 秒只讲清楚一件事，让观众看完能自己复述。
    - 第一句是钩子：一个具体场景、反常识的结果或观众关心的问题；不说「大家好」。
    - 然后只讲这一个点：先给结论，再给一个最关键的数字或例子，必要时用一句话说明前提或反方。
    - 术语第一次出现就用一句白话解释；不引入第二个新概念。
    - 最后一句给一个本周就能做的动作。
    - 不依赖前文：观众没有看过这个系列的其他视频。
    - 2–4 个小节，每节 1–2 段，每段 30–100 字，口语化，适合朗读。
    读者会用 ChatGPT、Claude 这类 AI 工具，但不写代码，也不看技术文档。
    - token、API、模型、上下文这类词第一次出现就用一句白话解释，或换成日常说法；不出现命令、参数、代码。
    - 数字换算成他们能感觉到的量：每月多花多少钱、能多聊多久，不用「每百万 token」这类口径。
    - 举例用写邮件、做表格、查资料、整理笔记这类日常场景。
    - 动作只说去哪个设置里点什么、要不要换套餐，不写代码。
output:
  target: autovideo
  voice_id: voxcpm_anchor
  video_form: information_motion
  allowed_forms: [information_motion]
  creative_intent:
    purpose: 知识讲解
    audience: 会用 ChatGPT、Claude 这类 AI 工具、但不写代码的人；画面少用术语，不出现命令和参数
  source_card: true
  package:
    accent: '#1f7a4d'
    badge: 一个知识点
    outro:
      template: end_card
      title: 一个知识点
      lines: [面向普通用户的 AI 知识点]
      seconds: 2.5
      sound: synth_sting
