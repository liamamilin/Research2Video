# 文稿配方：一份文件就是一种文稿的完整做法（调研 → 写稿 → 出片），字段说明见 spec/video-recipes.md。
# 这一份是「整份报告」配方：不挑条目、不再调研，直接从 Job 的整份报告写（topic.whole_report: true）。
# 它和「报告速览」的做法一样，只是不绑 AI 这个领域：给十个非 AI 矩阵（科技、商业、财经……）用，观众是大众观众。
# 改完在「文稿配方」页保存会先校验；新配方从现有配方复制。

name: 专题速览
description: 把一份报告里最重要的 3–5 件事按重要程度讲一遍：每件一个小节，说清是什么、变了什么、和{{audience}}有什么关系，最后点出最值得继续关注的一件。
status: experimental
tags:
  domain:
    key: topics
    name: 综合专题
  type:
    key: digest
    name: 专题速览
  format:
    key: long
    name: B 站横屏长
audiences: [general]
target_minutes: 3
minutes_range: [3, 6]
topic:
  kind: single
  whole_report: true
  fields: [核心角度, 目标受众]
research:
  mode: none
writing:
  pipeline: single
  default_style:
    depth: '{{audience.depth}}'
    tone: concise
  allowed_tones: [concise, explainer, news]
  sections: [4, 7]
  paragraph_units: [30, 100]
  required_roles: [钩子, 行动]
  audit:
    model: review
    style_severity: warn
    timeout_seconds: 480
  style: |
    栏目「专题速览」：把一份报告讲给没时间读它的{{audience}}听。观众只听一遍，面前没有报告，也不认识报告里的任何名字。
    - 开场先给观众一张地图：一两句话说这期讲哪几件事，每件用白话描述它是什么，不只报名字。不说「大家好」，不说「这是某某报告」，不向观众提问。
    - 挑 3–5 件对{{audience}}最有用的，不按榜单名次硬凑；报告里再多的条目也不全讲，也不加报告里没有的内容。
    - 每件一个小节，按这个顺序讲：它是什么（一句白话说清；第一次出现的名字、缩写、术语当场解释）→ 它变了什么、能让你做什么 → 一个最该知道的限制。三步用说话的口气连起来，不念条目。
    - 先介绍再评价：没讲清一件东西是什么之前，不说它排第几、有多少数字。
    - 数字：一件事最多一个，并说明它量的是什么、单位和年份或期数；不拿数字当结论，口径不同的数字不互相比较。金额说清币种，增长率说清和什么比。
    - 限制只讲这件事自己的；整体性的提醒（比如「新闻稿不等于独立验证」）全片最多说一次，不反复强调。
    - 限制不要每件都用「要留意」「限制是」开头，也不把同一种缺口（比如「只有机构自己的说法」）每件都说一遍：相同的合并成一句，只在确实影响判断的那件上细说。
    - 不自问自答，不写「接下来看它怎么……」这类指向还没讲的东西的预告；过渡用一句话说清接着讲什么、和上一件有什么关系。
    - 结尾挑一件最值得继续关注的，说清为什么、接下来看什么信号；不重复开场，不把某一件的限制说成全片的结论。
    - 事实只用报告里写明来源的；只有机构、公司自己的说法时，口播里说「官方说」「公司说」；报告里是媒体转述的，说「媒体报道」；报告标了「窗口外」「未验证」「只有标题」的不当成事实讲。数字、日期、单位照报告原样。没有亲自测试的东西不说「实测」。
    - 标题直接说内容：讲了什么、最有看点的是哪一件；25 个字以内，不用口号，不写结论句。
    - 4–7 个小节，每段 30–100 字，口语化，适合朗读。
    {{audience.writing_rules}}
output:
  use: motion
  source_card: true
  package:
    accent: '#1f7a4d'
    badge: 专题速览
    outro:
      template: end_card
      title: 专题速览
      lines: ['面向{{audience}}的专题速览']
      seconds: 3
      sound: synth_sting
