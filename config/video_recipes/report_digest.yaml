# 文稿配方：一份文件就是一种文稿的完整做法（调研 → 写稿 → 出片），字段说明见 spec/video-recipes.md。
# 这一份是「整份报告」配方：不挑条目、不再调研，直接从 Job 的整份报告写（topic.whole_report: true）。
# 改完在「文稿配方」页保存会先校验；新配方从现有配方复制。

name: 报告速览
description: 把一份报告里最重要的 3–5 件事按重要程度讲一遍：每件一个小节，说清变了什么、对{{audience}}意味着什么，最后给出先做哪件事。
status: experimental
tags:
  domain:
    key: ai
    name: AI 与软件
  type:
    key: digest
    name: 报告速览
  format:
    key: long
    name: B 站横屏长
audiences: [developer, non_tech]
target_minutes: 3
minutes_range: [3, 6]
topic:
  kind: single
  whole_report: true
  fields: [核心角度, 目标受众]
research:
  mode: none
writing:
  pipeline: single
  default_style:
    depth: '{{audience.depth}}'
    tone: concise
  allowed_tones: [concise, explainer, news]
  sections: [4, 7]
  paragraph_units: [30, 100]
  required_roles: [钩子, 行动]
  audit:
    model: review
    style_severity: warn
    timeout_seconds: 480
  style: |
    栏目「报告速览」：把一份报告讲给没时间读它的{{audience}}听。观众只听一遍，面前没有报告，也不认识报告里的任何名字。
    - 开场先给观众一张地图：一两句话说这期讲哪几件事，每件用白话描述它是什么，不只报名字。不说「大家好」，不说「这是某某报告」，不向观众提问。
    - 挑 3–5 件对{{audience}}最有用的，不按榜单名次硬凑；报告里再多的条目也不全讲，也不加报告里没有的内容。
    - 每件一个小节，按这个顺序讲：它是什么（一句白话说清；第一次出现的名字、缩写、术语当场解释）→ 它变了什么、能让你做什么 → 一个最该知道的限制。三步用说话的口气连起来，不念条目。
    - 先介绍再评价：没讲清一件东西是什么之前，不说它排第几、有多少数字。
    - 数字：一件事最多一个，并说明它代表什么（比如 star 是 GitHub 上的收藏数，下载量是被下载的次数）；不拿数字当结论，不同指标不互相比较。价格要说清是输入还是输出、每百万 token 还是每次。
    - 限制只讲这件事自己的；整体性的提醒（比如「热度不等于质量」）全片最多说一次，不反复强调。
    - 限制不要每件都用「要留意」「限制是」开头，也不把同一种缺口（比如「许可证没说明」）每件都说一遍：相同的合并成一句，只在确实影响取舍的那件上细说。
    - 不自问自答，不写「接下来看它怎么……」这类指向还没讲的东西的预告；过渡用一句话说清接着讲什么、和上一件有什么关系。
    - 结尾挑一件最值得现在就试的，说清谁适合、做什么、第一步怎么做；不重复开场，不把某一件的限制说成全片的结论。
    - 事实只用报告里写明来源的；只有厂商或项目方自己的说法时，口播里说「项目方说」「官方说」；报告标了「窗口外」或「未验证」的不当成事实讲。数字、版本号、单位照报告原样。
    - 标题直接说内容：讲了什么、最有看点的是哪一件；25 个字以内，不用口号，不写结论句。
    - 4–7 个小节，每段 30–100 字，口语化，适合朗读。
    {{audience.writing_rules}}
output:
  use: motion
  source_card: true
  package:
    accent: '#1f7a4d'
    badge: 报告速览
    outro:
      template: end_card
      title: 报告速览
      lines: ['面向{{audience}}的 AI 报告速览']
      seconds: 3
      sound: synth_sting
