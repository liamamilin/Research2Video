# 文稿配方：一份文件就是一种文稿的完整做法（选题 → 调研 → 写稿 → 出片），字段说明见 spec/video-recipes.md。
# 改完在「文稿配方」页保存会先校验；新配方从现有配方复制。

name: 对比
description: 把两个对象放在同几个维度上比：每个维度谁强谁弱、差多少，最后说明什么情况下选哪个。
status: experimental
tags:
  domain:
    key: ai
    name: AI 与软件
  audience:
    key: developer
    name: 开发者
  type:
    key: comparison
    name: 对比
  format:
    key: long
    name: B 站横屏长
audience: 开发者
target_minutes: 4.5
topic:
  kind: comparison
  sources: []
  fields: [核心角度, 目标受众, 条目数, 条目, 对比对象, 对比维度]
research:
  mode: job
  timeout_seconds: 2400
  language: zh
  prompt: |
    你是一名技术研究员，为一位制作 AI / 软件类知识视频的创作者准备一个对比。你的报告会被写成约 {topic_minutes} 分钟的口播文稿，文稿里的每个事实都要能追溯到你引用的网页，所以每个关键判断都要给出原始网址。

    ## 选题
    - 标题：{topic_title}
    - 对比对象（两个）：{topic_subjects}
    - 对比维度：{topic_dimensions}
    - 核心角度：{topic_angle}
    - 目标受众：{topic_audience}

    ## 任务
    把两个对象放在同一组维度上逐项比较。每个维度两边都要有数字或可核对的事实，口径一致（同一套餐、同一版本、同一单位）；一边没有公开数据时写明「未公开」，不估算。最后总结：什么情况下选哪一个，以及哪些结论取决于使用场景。
    证据以 {date_7d_ago} 至 {date} 的信息为主；更早的关键资料可以用，但要注明原始日期。
    输出语言：{language}。

    ## 证据规则
    1. 每个关键判断附来源网址和发布日期。优先官方文档、定价页、发布说明、代码仓库、论文等一手来源。
    2. 网址必须是你实际检索到的真实页面，禁止编造、猜测或拼接网址；不确定就不写。
    3. 核心数字尽量由两个相互独立的来源支撑；只有厂商自己的说法时，标注「厂商自述，未独立验证」。
    4. 区分「已证实」「有迹象」「推测」，不把推测写成事实。
    5. 数字（价格、版本号、日期、比例）照来源原样写，注明口径。

    ## 输出结构
    ### 1. 直接回答（一句话：整体上谁更适合谁）
    ### 2. 逐维度对比（表格：维度 | 对象一 | 对象二 | 来源编号）
    ### 3. 取决于场景的结论
    ### 4. 仍未确定的问题
    ### 5. 适合视频的讲述角度（不超过 3 条）
    ### 6. 来源清单
    编号列表，每行一个来源：编号. 标题 | 一手/二手 | 发布日期 | 完整网址
writing:
  pipeline: single
  default_style:
    depth: intermediate
    tone: explainer
  allowed_tones: [concise, explainer, playful]
  sections: [3, 6]
  paragraph_units: [30, 100]
  required_roles: [钩子, 证据, 行动]
  audit:
    model: review
    style_severity: must
    timeout_seconds: 480
  style: |
    栏目「对比」：两个对象放在同几个维度上比，不做各自的产品介绍。
    - 开场一句话说清比的是谁和谁、比哪几项，并先给整体结论。
    - 主体每个维度一个小节：先说谁强，再给两边的数字（单位、口径一致），一句话说差在哪。维度照选题的「对比维度」，不加别的。
    - 一边没有公开数据就说「未公开」，不估算、不拿别的口径凑。
    - 必须有一节讲「什么情况下选哪个」，结论取决于场景时要明说。
    - 结尾给开发者一个现在就能做的动作：谁受影响、多花或少花多少、要改什么。
    - 3–6 个小节，每节 1–3 段，每段 30–100 字，口语化，适合朗读。
output:
  target: autovideo
  voice_id: voxcpm_anchor
  video_form: information_motion
  allowed_forms: [information_motion]
  creative_intent:
    purpose: 知识讲解
