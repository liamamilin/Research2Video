# 文稿配方：一份文件就是一种文稿的完整做法（调研 → 写稿 → 出片），字段说明见 spec/video-recipes.md。
# research.template 是 jobs/_templates/video_research/ 下的调研模板，output.use 是 config/video_parts/output/ 下的出片部件。
# 改完在「文稿配方」页保存会先校验；新配方从现有配方复制。

name: 深度解读
description: 把一个值得讲清楚的问题讲透：先给结论，再按证据强弱展开，讲清反方和局限，最后给可执行的动作。
status: experimental
tags:
  domain:
    key: ai
    name: AI 与软件
  audience:
    key: non_tech
    name: 普通用户
  type:
    key: deep_dive
    name: 深度解读
  format:
    key: long
    name: B 站横屏长
audience: 普通用户
target_minutes: 6
topic:
  kind: single
  sources: [opportunities]
  fields: [核心角度, 目标受众, 为什么有人在乎]
research:
  template: deep_dive_non_tech
writing:
  pipeline: adapt
  default_style:
    depth: intro
    tone: explainer
  allowed_tones: [concise, explainer, playful, story]
  sections: [4, 6]
  paragraph_units: [60, 140]
  required_roles: [钩子, 反方, 行动]
  revise_rounds: 2
  audit:
    model: review
    style_severity: must
    timeout_seconds: 480
  style: |
    栏目「深度解读」：把一个问题讲透，而不是罗列新闻。
    - 开场用一个具体场景或冲突把问题抛出来（1 段），紧接着给结论。
    - 主体按证据强弱展开：先讲已证实的，再讲有迹象的，推测必须明说是推测。
    - 必须有一节讲反方、局限或还不确定的地方。
    - 结尾给观众 2–4 个本周就能做的具体动作。
    - 4–6 节，每节 2–5 段，每段 60–140 字，口语化，适合朗读。
    读者会用 ChatGPT、Claude 这类 AI 工具，但不写代码，也不看技术文档。
    - token、API、模型、上下文这类词第一次出现就用一句白话解释，或换成日常说法；不出现命令、参数、代码。
    - 数字换算成他们能感觉到的量：每月多花多少钱、能多聊多久，不用「每百万 token」这类口径。
    - 举例用写邮件、做表格、查资料、整理笔记这类日常场景。
    - 动作只说去哪个设置里点什么、要不要换套餐，不写代码。
output:
  use: auto_form
  creative_intent:
    purpose: 知识讲解
    audience: 会用 ChatGPT、Claude 这类 AI 工具、但不写代码的人；画面少用术语，不出现命令和参数
