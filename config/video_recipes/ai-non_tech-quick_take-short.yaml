# 文稿配方：一份文件就是一种文稿的完整做法（选题 → 调研 → 写稿 → 出片），字段说明见 spec/video-recipes.md。
# 改完在「文稿配方」页保存会先校验；新配方从现有配方复制。

name: 快讯
description: 一个变化讲清楚：改了什么（旧到新）、对普通用户意味着什么、现在该做什么。
status: experimental
tags:
  domain:
    key: ai
    name: AI 与软件
  audience:
    key: non_tech
    name: 普通用户
  type:
    key: quick_take
    name: 快讯
  format:
    key: short
    name: B 站横屏短
audience: 普通用户
target_minutes: 1.25
topic:
  kind: single
  sources: [flash]
  fields: [核心角度, 目标受众, 条目数, 条目, 对比对象, 对比维度]
research:
  mode: job
  timeout_seconds: 1500
  language: zh
  prompt: |
    你是一名技术研究员，为一位制作 B 站 60–90 秒 AI / 软件开发快讯视频的创作者核实一条变化。你的报告会被写成约 {topic_minutes} 分钟的口播文稿，文稿里的每个事实都要能追溯到你引用的网页，所以每个关键判断都要给出原始网址。

    ## 条目
    - 标题：{topic_title}
    - 一句话：{topic_angle}
    - 发布日期：{topic_date}
    - 变化（旧 → 新）：{topic_change}
    - 对普通用户的影响：{topic_why}
    - 候选来源：
    {topic_sources}

    ## 任务
    核实这条变化是否属实、数字是否准确，并找出它对普通用户的实际影响。检索保持克制：以核实为主，不做背景综述。
    1. 打开候选来源，确认日期、旧到新的数字、适用范围（哪些套餐、哪些模型、什么时候生效）。
    2. 找一个独立来源交叉核对核心数字；只有厂商自己的说法时，标注「厂商自述，未独立验证」。
    3. 找出例外、生效条件或隐藏的计费坑；确实找不到时写明「未找到限制条件」。
    4. 数字（价格、版本号、日期、比例）照来源原样写，注明口径（输入还是输出、每百万 token 还是每次）。
    证据以 {date_7d_ago} 至 {date} 的信息为主；更早的关键资料可以用，但要注明原始日期。
    输出语言：{language}。

    ## 证据规则
    1. 每个关键判断附来源网址和发布日期。优先官方文档、发布说明、代码仓库、论文、定价页等一手来源；媒体和社区帖子只作补充。
    2. 网址必须是你实际检索到的真实页面，禁止编造、猜测或拼接网址；不确定就不写。
    3. 区分「已证实」「有迹象」「推测」，不把推测写成事实。
    读者是不写代码的普通用户：优先官方帮助页、套餐和价格页、产品更新说明里用户能直接感受到的变化；少用基准测试、代码仓库和 API 文档作主要证据；技术细节只在影响用户时才写。

    ## 输出结构
    ### 1. 直接回答
    ### 2. 关键事实（表格：事实 | 置信度 | 来源编号）
    ### 3. 限制与反方证据
    ### 4. 仍未确定的问题
    ### 5. 适合快讯的讲法（不超过 2 条）
    ### 6. 来源清单
    编号列表，每行一个来源：编号. 标题 | 一手/二手 | 发布日期 | 完整网址
writing:
  pipeline: single
  default_style:
    depth: intro
    tone: news
  allowed_tones: [news, concise]
  sections: [2, 4]
  paragraph_units: [20, 90]
  required_roles: [钩子, 行动]
  audit:
    model: review
    style_severity: must
    timeout_seconds: 240
  style: |
    栏目「快讯」：60–90 秒讲清一个变化，不铺垫背景，不罗列。
    - 第一句是钩子：直接说变化和它的数字，或一个让普通用户停下来的问题；不说「大家好」，不说「今天」。
    - 然后讲变化：旧的是什么、新的是什么；数字、单位、口径照来源原样，价格要说清是输入还是输出、每百万 token 还是每次。
    - 再讲对普通用户意味着什么：谁受影响、每月多花或少花多少、要不要换工具或改设置。数字只留最关键的 2–3 个；上下文长度、输出上限、各档位价格这类参数，除非它们就是这条快讯的变化，否则不讲。
    - 最后一句给一个现在就能做的动作。
    - 只有厂商自己的说法时，口播里说「官方说法」，不要说成已经验证的事实。
    - 2–4 个小节，每节 1–2 段，每段 20–90 字，口语化，适合朗读。
    读者会用 ChatGPT、Claude 这类 AI 工具，但不写代码，也不看技术文档。
    - token、API、模型、上下文这类词第一次出现就用一句白话解释，或换成日常说法；不出现命令、参数、代码。
    - 数字换算成他们能感觉到的量：每月多花多少钱、能多聊多久，不用「每百万 token」这类口径。
    - 举例用写邮件、做表格、查资料、整理笔记这类日常场景。
    - 动作只说去哪个设置里点什么、要不要换套餐，不写代码。
output:
  target: autovideo
  voice_id: voxcpm_anchor
  video_form: information_motion
  allowed_forms: [information_motion]
  creative_intent:
    purpose: 知识讲解
    audience: 会用 ChatGPT、Claude 这类 AI 工具、但不写代码的人；画面少用术语，不出现命令和参数
  source_card: true
  package:
    accent: '#1f7a4d'
    badge: 快讯
    intro:
      template: stinger
      title: 快讯
      subtitle: '{date}'
      seconds: 1.5
      sound: synth_sting
    outro:
      template: end_card
      title: 快讯
      lines: [面向普通用户的 AI 快讯]
      seconds: 3
      sound: synth_sting
  recheck: true
